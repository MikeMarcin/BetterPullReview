# [[BPR-1832]]. Settings BetterPullReview passes to ccache on every compile.
# cmake/BprCompilerCache.cmake reads each `key = value` line here and hands it
# to ccache on the compile command line, so these settings win over a personal
# ccache.conf for this project without changing it for anything else.
# Configure adds the settings that depend on the machine and the checkout:
# cache_dir (one directory outside every worktree), base_dir (this checkout's
# source directory, so paths inside it hash the same from any worktree) and, on
# macOS, file_clone with compression off, so an APFS hit clones the object into
# the build tree instead of copying it.
#
# One cache serves every checkout, worktree and preset, so the cap is shared.
max_size = 20G
