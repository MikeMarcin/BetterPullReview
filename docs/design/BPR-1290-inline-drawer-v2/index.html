<title>BPR-1290 inline drawer and BPR-1293 finder, prototype v2</title>
<!--
  Prototype v2 for the owner to try and answer in chat: [[BPR-1290]]'s inline drawer (v1, kept as
  the owner liked it) plus [[BPR-1293]]'s finder, a view for finding a conversation anywhere in the
  pull request. Navigation only: it does not hold pull request comments that are not on a file
  (BPR-1294). The owner on v1: "I like it" and "Of course it didnt show the tree nav".

  The finder button at the top of the drawer, or Cmd+J (Ctrl+J), opens it. The status bar switches
  where it opens, so both placements can be tried: A, a tab in the main pane beside the file (stays
  open; picking switches to the file); B, summoned over the whole window like Home (picking closes it).

  A conversation is one row: its line, its first post's label mark, its first words, then one small
  avatar per post in posting order (blue dot new, amber ring where you are). A row branches only
  where a post has two or more replies that have replies of their own; a reply nobody answered stays
  on its parent's row, so a GitHub thread is always one row. Picking a row or an avatar opens the
  file, scrolls to the line and opens the thread in the drawer at that post.

  Content: the pull request is made up, 22 conversations in 10 files, in the conventional-comments-v1
  people's voices. The deep one, line 667 of conversation_cards_view.cpp, has branching-thread-v1's
  shape (three branches off the first comment; the third forks after its third reply), with
  illustrative words and new state. Code is verbatim (code.js): conversation_cards_view.cpp at
  fbbabb3ef, as in v1; the other nine files at 25f700e09. Changed-line ranges are illustrative.

  ?theme=light|dark, ?place=tab|window, ?finder=1 opens the finder at start.
  A design prototype, not the product.
-->

}

  --route:#E3B357; --route-soft:#3A3018; --route-line:#6B5622; --ok:#3FB950; --new:#7FB0E8; --hover:#2A3039;
  --code:#0F1318; --gutter:#13181E; --lnum:#6E7781; --add:#11261A; --add-g:#173521; --drawer:#1C2128;
  --shadow:0 14px 40px rgba(0,0,0,.55), 0 1px 4px rgba(0,0,0,.4);
  --tip:#E6EDF3; --tip-ink:#1A1E24; --soft:30%;

:focus-visible { outline:2px solid var(--signal); outline-offset:1px; }

/* ---------- window ---------- */
.win { width:100vw; height:100vh; display:flex; flex-direction:column; }

.theme { display:inline-flex; padding:2px; border-radius:8px; background:var(--panel-2); border:1px solid var(--rule); }

.theme button[aria-pressed="true"] { background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.14); }

.theme button:focus-visible { outline:2px solid var(--signal); }
.main { flex:1; display:flex; min-height:0; }

.sbar { flex:0 0 24px; display:flex; align-items:center; gap:16px; padding:0 12px; background:var(--panel); border-top:1px solid var(--rule); color:var(--ink-3); font-size:11.5px; white-space:nowrap; overflow:hidden; }

/* ---------- code ---------- */
.codewrap { flex:1; display:flex; min-height:0; }
#code { flex:1; overflow:auto; background:var(--code); scrollbar-width:none; position:relative; }
#code::-webkit-scrollbar { display:none; }
#lines { font:12.5px/20px var(--mono); padding-top:8px; min-width:max-content; tab-size:4; -moz-tab-size:4; }
.ln { display:flex; white-space:pre; height:20px; position:relative; }
.ln .g { position:sticky; left:0; z-index:2; flex:0 0 52px; text-align:right; padding-right:8px; color:var(--lnum); background:var(--gutter); font-variant-numeric:tabular-nums; user-select:none; }
.ln .m { position:sticky; left:52px; z-index:2; flex:0 0 24px; display:flex; align-items:center; justify-content:center; background:var(--gutter); border-right:1px solid var(--rule); }
.ln .t { padding:0 24px 0 14px; flex:1; }

.ln.hov .t { background:color-mix(in srgb, var(--route) 9%, var(--code)); }
.ln.pick .t { background:var(--route-soft); }
.ln.pick .g { color:var(--ink); font-weight:700; background:var(--route-soft); }
.ln.pick .m { background:var(--route-soft); }
.ln.pick .g { box-shadow:inset 3px 0 0 var(--route); }
.k { color:var(--kw); } .fn { color:var(--fn); } .ty { color:var(--ty); } .str { color:var(--str); } .cm { color:var(--cm); font-style:italic; } .nu { color:var(--nm); } .pp { color:var(--pp); }

/* gutter markers */
.pin { all:unset; cursor:pointer; position:relative; width:18px; height:18px; display:flex; align-items:center; justify-content:center; border-radius:5px; }
.pin:hover { background:var(--hover); }
.pin:focus-visible { outline:2px solid var(--signal); }

.ln.add .pin.u::after { box-shadow:0 0 0 1.5px var(--add-g); }
.pin.sel { box-shadow:0 0 0 2px var(--route); background:var(--panel); }
.pin.dim { opacity:.5; }
.pin .plainpin { width:12px; height:12px; border-radius:3px; border:1.5px solid var(--ink-3); background:color-mix(in srgb, var(--ink-3) 18%, var(--code)); }
.pin .draftpin { width:13px; height:13px; border-radius:3px; border:1.5px dashed var(--ink-3); display:flex; align-items:center; justify-content:center; color:var(--ink-3); }
.pin.flash { animation:flash .9s ease-out 1; }
@keyframes flash { 0% { box-shadow:0 0 0 2px var(--route), 0 0 0 2px color-mix(in srgb, var(--route) 60%, transparent); } 100% { box-shadow:0 0 0 2px var(--route), 0 0 0 12px transparent; } }

#ruler { flex:0 0 14px; position:relative; background:var(--side); border-left:1px solid var(--rule); cursor:pointer; }

#ruler .tk.dr { background:transparent; box-shadow:inset 0 0 0 1px var(--ink-3); }

.dhead { flex:0 0 34px; display:flex; align-items:stretch; gap:2px; padding:0 6px 0 4px; background:var(--panel); border-bottom:1px solid var(--rule); }

.tab svg.i { display:none; } #drawer.narrow .tab svg.i { display:block; } #drawer.narrow .tab .tl { display:none; } #drawer.narrow .tab { padding:0 7px; }

/* edges: threads above and below the visible code */
.edge { position:absolute; left:0; right:0; z-index:10; display:flex; align-items:center; gap:4px; padding:0 8px; height:34px; pointer-events:none; }

.ech:hover { border-color:var(--ink-3); color:var(--ink); }
.ech:focus-visible { outline:2px solid var(--signal); }

/* ---------- threads ---------- */
.card { position:absolute; left:8px; right:8px; border-radius:8px; transition:top .16s ease; outline:none; }

.ch .where:focus-visible { outline:2px solid var(--signal); }

.ch .state.ok { color:var(--ok); }

.post { --t:var(--rule-2); position:relative; display:flex; gap:9px; padding:8px 10px 8px 12px; }
.card.closed .post { padding:0 0 0 12px; }
.post .rail { position:absolute; left:6px; top:3px; bottom:3px; width:2px; border-radius:1px; background:var(--t); }
.card.open .post .rail { top:10px; bottom:6px; }
.post.blk .rail { width:4px; left:4px; }
.post.plain .rail { background:var(--rule-2); }
.post.dash .rail { background:repeating-linear-gradient(var(--t) 0 6px, transparent 6px 9px); }
.post .gut { flex:0 0 18px; display:flex; flex-direction:column; align-items:center; gap:3px; padding-top:1px; }
.post .pb { flex:1; min-width:0; }
.post .nm { display:flex; align-items:center; gap:7px; height:19px; }
.post .nm b { font-weight:600; font-size:12.5px; }
.post .nm time { color:var(--ink-3); font-size:11.5px; }
.post .nm .meta { margin-left:auto; display:inline-flex; align-items:center; gap:6px; color:var(--ink-3); font-size:11.5px; font-variant-numeric:tabular-nums; }
.post .tx { margin:1px 0 0; font-size:13px; line-height:1.5; color:var(--ink); overflow-wrap:anywhere; white-space:pre-wrap; }
.post .tx code { font:11.5px var(--mono); padding:0 4px; border-radius:4px; background:var(--panel-2); border:1px solid var(--rule); }
.post .tx .pfx { font-weight:600; color:var(--ink-2); }
.card.closed .post .tx { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; }
.card.closed.res .post .tx { -webkit-line-clamp:1; }
.post + .post { border-top:1px solid color-mix(in srgb, var(--rule) 60%, transparent); }
.newl { display:flex; align-items:center; gap:8px; margin:2px 10px 0 39px; color:var(--new); font:700 10.5px var(--ui); }
.newl::after { content:""; flex:1; height:1px; background:var(--new); opacity:.55; }
.newl + .post { border-top:0; }
.dot { width:7px; height:7px; border-radius:50%; background:var(--new); display:inline-block; flex:none; }
.cnt2 { display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 5px; border-radius:8px; background:var(--new); color:var(--on-signal); font:700 10px/1 var(--ui); }
.okm { color:var(--ok); display:inline-flex; }
.stack { display:inline-flex; } .stack .av { box-shadow:0 0 0 1.5px var(--drawer); } .stack .av + .av { margin-left:-5px; }
.card.closed:hover .stack .av, .card.closed.hov .stack .av { box-shadow:0 0 0 1.5px var(--panel); }
.reps { display:inline-flex; align-items:center; gap:3px; }
.open-body { animation:reveal .14s ease-out 1; }
@keyframes reveal { from { opacity:0; transform:translateY(-3px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { .open-body { animation:none; } }

/* marks and avatars */
.lm { width:16px; height:16px; flex:none; display:block; }
.av { width:18px; height:18px; border-radius:50%; flex:none; display:inline-flex; align-items:center; justify-content:center; font:700 9.5px/1 var(--ui); color:var(--avk); background:var(--avb); }
.av.xs { width:14px; height:14px; font-size:7.5px; }
.av.me { box-shadow:0 0 0 1.5px var(--panel), 0 0 0 2.5px var(--ink-3); }

/* composer */
.comp { padding:8px 10px 10px 12px; border-top:1px solid var(--rule); }
.cfb { all:unset; box-sizing:border-box; cursor:text; display:flex; align-items:center; gap:9px; width:100%; min-height:32px; padding:0 8px 0 9px; border-radius:7px; border:1px solid var(--rule-2); background:var(--code); color:var(--ink-3); }

.cfb:focus-visible { outline:2px solid var(--signal); }

.btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 11px; border-radius:6px; font-weight:600; font-size:12px; color:var(--ink-2); }
.btn:hover { background:var(--hover); color:var(--ink); }
.btn.pri { background:var(--signal); color:var(--on-signal); }
.btn.pri:hover { filter:brightness(1.07); }
.btn.pri[disabled] { opacity:.45; cursor:default; filter:none; }
.btn:focus-visible { outline:2px solid var(--signal); outline-offset:1px; }
.priv { display:inline-flex; align-items:center; gap:5px; color:var(--ink-3); font-size:11.5px; }
.dacts { display:flex; align-items:center; gap:4px; padding:4px 10px 10px 39px; }

/* tooltip and toast */
#tip { position:fixed; z-index:100; pointer-events:none; background:var(--tip); color:var(--tip-ink); font-size:11.5px; line-height:1.4; padding:4px 8px; border-radius:5px; max-width:340px; box-shadow:0 4px 14px rgba(0,0,0,.25); white-space:pre-line; }
#tip[hidden] { display:none; }
#toast { position:fixed; z-index:90; left:24px; bottom:36px; max-width:380px; padding:10px 12px; border-radius:9px; background:var(--tip); color:var(--tip-ink); font-size:12.5px; line-height:1.45; box-shadow:0 10px 30px rgba(0,0,0,.3); }
#toast[hidden] { display:none; }

/* ================= v2: navigation across files ================= */
.main { position:relative; }
.filepane { flex:1; display:flex; flex-direction:column; min-height:0; }
.filepane[hidden] { display:none; }
.stepper .sb { all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:5px; color:var(--ink-2); }
.stepper .sb:hover { background:var(--hover); color:var(--ink); }
.stepper .sb:focus-visible { outline:2px solid var(--signal); }
.hbar .finderbtn { margin-left:2px; }

/* placement A: tabs in the main pane */
.ptabs { flex:0 0 32px; display:flex; align-items:stretch; gap:1px; padding:0 6px; background:var(--side); border-bottom:1px solid var(--rule); }
.ptabs[hidden] { display:none; }
.ptab { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; padding:0 8px 0 11px; max-width:280px; color:var(--ink-2); font-weight:600; position:relative; white-space:nowrap; border-radius:7px 7px 0 0; margin-top:4px; }
.ptab .nm { overflow:hidden; text-overflow:ellipsis; }
.ptab:hover { color:var(--ink); background:color-mix(in srgb, var(--panel) 55%, transparent); }
.ptab[aria-selected="true"] { color:var(--ink); background:var(--panel); box-shadow:0 0 0 1px var(--rule); clip-path:inset(-2px -2px 0 -2px); }
.ptab:focus-visible { outline:2px solid var(--signal); outline-offset:-3px; }
.ptab .x { all:unset; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px; color:var(--ink-3); }
.ptab .x:hover { background:var(--hover); color:var(--ink); }
.ptab .kbd { font-weight:600; }
.codecol { position:relative; }
.fhost { position:absolute; left:0; right:0; top:32px; bottom:0; z-index:6; display:flex; min-height:0; background:var(--panel); }
.fhost[hidden] { display:none; }

/* placement B: summoned over the window, like Home */
.fwin { position:absolute; inset:0; z-index:40; display:flex; justify-content:center; background:var(--bg); }
.fwin[hidden] { display:none; }
.fwin.in { animation:summon .16s ease-out 1; }
@keyframes summon { from { opacity:0; transform:scale(.985); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) { .fwin.in { animation:none; } }
.fwin .finder { flex:0 1 940px; min-width:0; }

/* ---------- the finder ---------- */
.finder { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
.fbar { flex:none; display:flex; align-items:center; gap:6px; padding:10px 16px 10px 14px; }
.fwin .fbar { padding:22px 16px 12px; }
.fsearch { flex:1; max-width:520px; display:flex; align-items:center; gap:8px; height:32px; padding:0 8px 0 10px; border-radius:8px; border:1px solid var(--rule-2); background:var(--code); color:var(--ink-3); }
.fwin .fsearch { height:38px; max-width:none; border-radius:9px; }
.fsearch:focus-within { border-color:var(--signal); box-shadow:0 0 0 3px color-mix(in srgb, var(--signal) 20%, transparent); }
.fsearch input { all:unset; flex:1; min-width:0; font:13px var(--ui); color:var(--ink); }
.fwin .fsearch input { font-size:14px; }
.fsearch input::placeholder { color:var(--ink-3); }
.fsearch .clr { all:unset; cursor:pointer; display:inline-flex; width:18px; height:18px; align-items:center; justify-content:center; border-radius:4px; color:var(--ink-3); }
.fsearch .clr:hover { background:var(--hover); color:var(--ink); }
.fsearch .clr[hidden] { display:none; }
.fchip { all:unset; box-sizing:border-box; cursor:pointer; display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 9px; border-radius:7px; border:1px solid var(--rule); color:var(--ink-2); font-weight:600; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.fwin .fchip { height:34px; }
.fchip:hover { border-color:var(--rule-2); color:var(--ink); background:var(--hover); }
.fchip[aria-pressed="true"] { background:var(--signal-soft); border-color:color-mix(in srgb, var(--signal) 55%, var(--rule)); color:var(--ink); }
.fchip:focus-visible { outline:2px solid var(--signal); outline-offset:1px; }
.fchip .lm { width:16px; height:16px; }
.fchip.newc .n { color:var(--new); }
.fchip .chev { width:12px; height:12px; opacity:.7; }
.fclose { margin-left:4px; }

.flist { flex:1; overflow:auto; padding:0 0 28px; outline:none; }
.flist-in { max-width:880px; padding:0 8px 0 6px; }
.fwin .flist-in { max-width:none; }
.fgrp + .fgrp { margin-top:6px; }
.fgh { all:unset; box-sizing:border-box; cursor:pointer; position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:7px; width:100%; height:30px; padding:0 12px 0 8px; background:var(--panel); color:var(--ink-2); }
.fwin .fgh { background:var(--bg); }
.fgh:hover b { text-decoration:underline; text-decoration-color:var(--rule-2); text-underline-offset:3px; }
.fgh .fold { width:14px; height:14px; color:var(--ink-3); transition:transform .12s; }
.fgh[aria-expanded="false"] .fold { transform:rotate(-90deg); }
.fgh b { color:var(--ink); font-weight:600; }
.fgh .dir { color:var(--ink-3); font-size:11.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; min-width:0; }
.fgh .here { width:7px; height:7px; border-radius:50%; background:var(--route); flex:none; }
.fgh .gnew { width:7px; height:7px; border-radius:50%; background:var(--new); margin-right:12px; }
.fgh:focus-visible { outline:2px solid var(--signal); outline-offset:-2px; border-radius:6px; }

.frow { position:relative; display:flex; align-items:center; gap:0; height:30px; padding:0 12px 0 0; border-radius:7px; cursor:pointer; outline:none; }
.frow:hover { background:var(--hover); }
.frow.kf { box-shadow:inset 0 0 0 2px var(--signal); }
.frow.cur { background:var(--route-soft); }
.frow.cur::before { content:""; position:absolute; left:0; top:5px; bottom:5px; width:3px; border-radius:0 3px 3px 0; background:var(--route); }
.frow .fln { flex:0 0 46px; padding-right:10px; text-align:right; font:12px var(--mono); color:var(--ink-3); font-variant-numeric:tabular-nums; }
.frow.cur .fln { color:var(--ink); font-weight:700; }
.frow .tr { flex:none; display:flex; align-self:stretch; }
.frow .tr i { width:18px; position:relative; }
.frow .tr i.pipe::before, .frow .tr i.tee::before { content:""; position:absolute; left:8px; top:-1px; bottom:-1px; border-left:1.5px solid var(--rule-2); }
.frow .tr i.end::before { content:""; position:absolute; left:8px; top:-1px; height:calc(50% + 1px); border-left:1.5px solid var(--rule-2); }
.frow .tr i.tee::after, .frow .tr i.end::after { content:""; position:absolute; left:8px; right:2px; top:50%; border-top:1.5px solid var(--rule-2); }
.frow.path .tr i.tee::after, .frow.path .tr i.end::after, .frow.path .tr i.end::before { border-color:var(--route); }
.frow .mk { flex:0 0 16px; height:16px; display:flex; align-items:center; justify-content:center; margin-right:9px; }
.frow .mk .lm { width:16px; height:16px; }
.frow .mk .plain { width:12px; height:12px; border-radius:3px; border:1.5px solid var(--ink-3); background:color-mix(in srgb, var(--ink-3) 18%, var(--panel)); }
.frow .mk .draft { width:14px; height:14px; border-radius:3px; border:1.5px dashed var(--ink-3); display:flex; align-items:center; justify-content:center; color:var(--ink-3); }
.frow .wd { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); font-size:13px; }
.frow.sub .wd { color:var(--ink-2); }
.frow .wd code { font:11.5px var(--mono); }
.frow .wd mark { background:color-mix(in srgb, var(--signal) 22%, transparent); color:inherit; border-radius:2px; }
.frow.res .wd, .frow.res .ppl, .frow.res .mk { opacity:.5; }
.frow.res:hover .wd, .frow.res:hover .ppl, .frow.res:hover .mk { opacity:.85; }
.frow .ppl { flex:none; display:flex; align-items:center; gap:3px; margin-left:14px; }
.frow .st { flex:0 0 30px; display:flex; justify-content:flex-end; align-items:center; color:var(--ink-3); }
.frow .st .okm { color:var(--ok); }

/* a bead is one post: its author, in order; blue dot when new, amber ring where you are */
.bd { all:unset; box-sizing:border-box; cursor:pointer; position:relative; width:16px; height:16px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font:700 8px/1 var(--ui); color:var(--avk); background:var(--avb); flex:none; }
.bd.me { box-shadow:0 0 0 1.5px var(--panel), 0 0 0 2.5px var(--ink-3); }
.bd.u::after { content:""; position:absolute; right:-2px; top:-2px; width:6px; height:6px; border-radius:50%; background:var(--new); box-shadow:0 0 0 1.5px var(--panel); }
.frow:hover .bd.u::after { box-shadow:0 0 0 1.5px var(--hover); }
.frow.cur .bd.u::after { box-shadow:0 0 0 1.5px var(--route-soft); }
.bd:hover, .bd.kb { box-shadow:0 0 0 2px var(--panel), 0 0 0 3.5px var(--ink-2); }
.bd.path { box-shadow:0 0 0 1.5px var(--panel), 0 0 0 3px var(--route-line); }
.bd.pk { box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--route); }
.frow.cur .bd.pk, .frow.cur .bd.path { --panel:var(--route-soft); }
.bd.hit { box-shadow:0 0 0 2px var(--panel), 0 0 0 3.5px var(--ink); }
.bd.lbl { box-shadow:0 0 0 2px var(--panel), 0 0 0 3.5px var(--lt); }
.ppl.dimmed .bd:not(.lbl):not(.hit) { opacity:.35; }
.bfold { all:unset; cursor:pointer; height:16px; padding:0 5px; border-radius:8px; background:var(--panel-2); border:1px solid var(--rule); color:var(--ink-3); font:700 9.5px/16px var(--ui); font-variant-numeric:tabular-nums; }
.bfold:hover { color:var(--ink); border-color:var(--rule-2); }

.fempty { padding:40px 16px; color:var(--ink-3); display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
.fwin .fempty { align-items:center; }

/* preview of one post, beside its bead */
#pv { position:fixed; z-index:95; width:340px; padding:9px 11px 10px; border-radius:9px; background:var(--panel); border:1px solid var(--rule); box-shadow:var(--shadow); pointer-events:none; }
#pv[hidden] { display:none; }
#pv .h { display:flex; align-items:center; gap:7px; height:20px; }
#pv .h b { font-weight:600; }
#pv .h time { color:var(--ink-3); font-size:11.5px; }
#pv .h .lm { margin-left:auto; }
#pv .re { color:var(--ink-3); font-size:11.5px; display:inline-flex; align-items:center; gap:3px; margin-top:2px; }
#pv p { margin:4px 0 0; font-size:13px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
#pv p code { font:11.5px var(--mono); padding:0 4px; border-radius:4px; background:var(--panel-2); border:1px solid var(--rule); }
#pv p .pfx { font-weight:600; color:var(--ink-2); }

/* label popover */
#lpop { position:fixed; z-index:96; min-width:200px; padding:5px; border-radius:9px; background:var(--panel); border:1px solid var(--rule); box-shadow:var(--shadow); }
#lpop[hidden] { display:none; }
#lpop button { all:unset; box-sizing:border-box; cursor:pointer; display:flex; align-items:center; gap:8px; width:100%; height:28px; padding:0 9px 0 7px; border-radius:6px; color:var(--ink); }
#lpop button:hover, #lpop button:focus-visible { background:var(--hover); }
#lpop button[aria-checked="true"] { background:var(--signal-soft); }
#lpop button .n { margin-left:auto; color:var(--ink-3); font-variant-numeric:tabular-nums; font-size:11.5px; }
#lpop hr { border:0; border-top:1px solid var(--rule); margin:4px 2px; }

/* the drawer: whom a reply answers, and the reply you picked */
.card.open .ch { position:relative; z-index:3; background:var(--panel); border-radius:8px 8px 0 0; }
.card.open .ch.stuck { border-radius:0; box-shadow:0 1px 0 var(--rule), 0 6px 12px -6px rgba(0,0,0,.18); }
.post .nm .re { display:inline-flex; align-items:center; gap:3px; height:17px; padding:0 6px 0 4px; border-radius:9px; background:var(--panel-2); border:1px solid var(--rule); color:var(--ink-2); font-size:11px; font-weight:600; cursor:pointer; }
.post .nm .re:hover { border-color:var(--rule-2); color:var(--ink); }
.post.picked { background:color-mix(in srgb, var(--route-soft) 80%, transparent); box-shadow:inset 3px 0 0 var(--route); }
.post.picked.flash { animation:pflash 1.1s ease-out 1; }
@keyframes pflash { 0% { background:color-mix(in srgb, var(--route) 38%, transparent); } 100% { background:color-mix(in srgb, var(--route-soft) 80%, transparent); } }
@media (prefers-reduced-motion: reduce) { .post.picked.flash { animation:none; } }

/* the prototype's own control, in the status bar */
.proto { display:inline-flex; align-items:center; gap:7px; color:var(--ink-2); }
.seg { display:inline-flex; padding:1px; border-radius:6px; background:var(--panel-2); border:1px solid var(--rule); }
.seg button { all:unset; cursor:pointer; padding:0 8px; height:17px; line-height:17px; border-radius:5px; color:var(--ink-2); font-size:11.5px; text-decoration:none !important; }
.seg button[aria-pressed="true"] { background:var(--panel); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.14); }
body.dark .seg button[aria-pressed="true"] { background:#343B45; }
.seg button:focus-visible { outline:2px solid var(--signal); }
.frow .mk { position:relative; }
.frow.hasSub .mk::after { content:""; position:absolute; left:7.25px; top:17px; height:8px; border-left:1.5px solid var(--rule-2); }
.fclose[hidden], .cnt[hidden] { display:none; }
</style>
</head>

  const tab = e.target.closest("[data-tab]");
  if (tab) { setTab(tab.dataset.tab); return; }
  const act = e.target.closest("[data-act]");
  const card = e.target.closest("[data-card]");
  if (card && card.classList.contains("closed")) { openThread(card.dataset.card); return; }
  if (e.target === $("#finderWin")) { closeFinder(); return; }
  if (!act) return;
  const t = card && BYID[card.dataset.card];
  switch (act.dataset.act) {
    case "collapse": case "collapse-area":
      if (act.dataset.act === "collapse-area" && e.target !== act) return;
      closeThread(); break;
    case "reveal": scrollToLine(t.line, true); flashPin(t.id); break;
    case "resolve": t.res = !t.res; renderCards(); toast(t.res ? `Resolved the thread on line ${t.line}.` : `Unresolved the thread on line ${t.line}.`); break;
    case "read": if (unread(t)) { t.posts.forEach((p) => delete p.u); renderCards(); renderPtabs(); } break;
    case "more": toast("More keeps today's items: Copy link, View source, Copy source and Classify. Not drawn in this prototype."); break;
    case "reply": S.reply[t.id] = {on:true, text:(S.reply[t.id] || {}).text || ""}; renderCards(); dlayer.querySelector(`[data-reply="${t.id}"]`).focus({preventScroll:true}); break;
    case "reply-cancel": S.reply[t.id] = {on:false, text:""}; renderCards(); dlayer.querySelector(`[data-card="${t.id}"]`).focus({preventScroll:true}); break;
    case "reply-send": publishReply(t); break;
    case "draft-publish": t.draft = false; t.posts[0].t = "now"; renderCards(); toast(`Published your comment on line ${t.line}.`); break;
    case "draft-edit": toast("Editing a draft uses the composer BPR-1212 settles. Not drawn here."); break;
    case "draft-delete": { const i = ALL.indexOf(t); ALL.splice(i, 1); delete BYID[t.id]; T = T.filter((x) => x !== t); S.open = null; S.pick = null; renderCards(); toast(`Deleted your draft on line ${t.line}.`); break; }
    case "fnew": S.fNew = !S.fNew; act.setAttribute("aria-pressed", S.fNew); renderCards(); break;
    case "fopen": S.fOpen = !S.fOpen; act.setAttribute("aria-pressed", S.fOpen); renderCards(); break;
    case "next": nextNew(1); break;
    case "finder": toggleFinder(); break;
    case "finder-close": closeFinder(); break;
    case "tab-close": closeFinder(true); S.tabOpen = false; renderPtabs(); layout(); code.focus({preventScroll:true}); break;
    case "ff-new": S.ffNew = !S.ffNew; renderFinder(); break;
    case "ff-open": S.ffOpen = !S.ffOpen; renderFinder(); break;
    case "ff-label": openLabels(); break;
    case "ff-reset": S.ffNew = S.ffOpen = false; S.ffLabel = null; S.q = fq.value = ""; renderFinder(); fq.focus(); break;
    case "fq-clear": S.q = fq.value = ""; renderFinder(); fq.focus(); break;
    case "prevfile": case "nextfile": {
      const i = FILES.indexOf(S.file) + (act.dataset.act === "nextfile" ? 1 : -1);
      if (i >= 0 && i < FILES.length) loadFile(FILES[i]);
      break;
    }
    case "prwide": toast("Pull request comments and review summaries that are not on a file need a better home (BPR-1294). The leading idea is Overview, as in Collaborator. Not designed yet."); break;
    case "drawer": { const d = $("#drawer"); d.hidden = !d.hidden; act.setAttribute("aria-pressed", !d.hidden); if (!d.hidden) layout(); break; }
    case "noop": break;
  }
});
function publishReply(t) {
  const st = S.reply[t.id];
  const text = (st && st.text || "").trim();
  if (!text) return;
  const p = {a:ME, t:"now", b:text, id:t.id + "." + t.posts.length, p:t.flat ? t.posts[0].id : S.pick || t.posts[0].id};
  t.posts.push(p); POST[p.id] = {t, p};
  S.reply[t.id] = {on:false, text:""};
  renderCards();
  dlayer.querySelector(`[data-card="${t.id}"]`).focus({preventScroll:true});
  toast(`Published your reply on line ${t.line}.`);
}
document.addEventListener("input", (e) => {
  if (e.target === fq) { S.q = fq.value; S.cursor = null; renderFinder(); return; }
  const ta = e.target.closest("[data-reply]");
  if (!ta) return;
  const id = ta.dataset.reply;
  S.reply[id] = {...S.reply[id], on:true, text:ta.value};
  const card = ta.closest(".card");
  card.querySelector("[data-chip]").innerHTML = chipHtml(ta.value);
  const send = card.querySelector('[data-act="reply-send"]');
  if (ta.value.trim()) send.removeAttribute("disabled"); else send.setAttribute("disabled", "");
  layout();
});
document.addEventListener("mouseover", (e) => {
  const c = e.target.closest("[data-card],[data-pin]");
  const id = c ? c.dataset.card || c.dataset.pin : null;
  if (id === S.hover) return;
  if (S.hover && BYID[S.hover]) { const l = $(`#L${BYID[S.hover].line}`); if (l) l.classList.remove("hov"); const k = dlayer.querySelector(`[data-card="${S.hover}"]`); if (k) k.classList.remove("hov"); }
  S.hover = id;
  if (id && BYID[id] && BYID[id].f === S.file) { const l = $(`#L${BYID[id].line}`); if (l) l.classList.add("hov"); const k = dlayer.querySelector(`[data-card="${id}"].closed`); if (k) k.classList.add("hov"); }
});

/* ===== keyboard =====
   Anywhere: ⌘J (Ctrl+J) opens or closes the finder.
   Finder: type to search; Up/Down between rows; Left/Right along a row's posts; Return goes there;
   Esc clears the search, then closes. Drawer, as v1: Up/Down, Return, Esc, R, N, ⌘Return. */
function finderKey(e) {
  const pop = $("#lpop");
  if (!pop.hidden && e.target.closest("#lpop")) {
    const bs = [...pop.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); bs[(i + (e.key === "ArrowDown" ? 1 : bs.length - 1)) % bs.length].focus(); }
    else if (e.key === "Escape") { e.preventDefault(); pop.hidden = true; $("#ffLabel").focus(); }
    return true;
  }
  const els = rowsEls();
  const curEl = S.cursor && flistIn.querySelector(`[data-row="${S.cursor}"], [data-fold="${S.cursor}"]`);
  const i = curEl ? els.indexOf(curEl) : -1;
  const inSearch = e.target === fq;
  if (e.key === "Escape") {
    e.preventDefault();
    if (S.q) { S.q = fq.value = ""; renderFinder(); fq.focus(); }
    else closeFinder();
    return true;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const down = e.key === "ArrowDown";
    let j = inSearch ? (down ? 0 : -1) : i + (down ? 1 : -1);
    if (j < 0) { fq.focus(); S.cursor = null; flistIn.querySelectorAll(".kf, .kb").forEach((x) => x.classList.remove("kf", "kb")); hidePreview(); return true; }
    if (j >= els.length) j = els.length - 1;
    setCursor(els[j]);
    return true;
  }
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && !inSearch && curEl) {
    e.preventDefault();
    if (curEl.classList.contains("fgh")) { S.fold[curEl.dataset.fold] = e.key === "ArrowLeft"; renderFinder(); return true; }
    const n = curEl.querySelectorAll(".bd").length;
    S.bead = Math.max(-1, Math.min(n - 1, S.bead + (e.key === "ArrowRight" ? 1 : -1)));
    setCursor(curEl, {keepBead:true});
    return true;
  }
  if (e.key === "Enter") {
    e.preventDefault();
    const el = inSearch ? (curEl || flistIn.querySelector(".frow")) : curEl;
    if (!el) return true;
    if (el.classList.contains("fgh")) { S.fold[el.dataset.fold] = !S.fold[el.dataset.fold]; renderFinder(); return true; }
    const b = S.bead >= 0 && el.querySelectorAll(".bd")[S.bead];
    goToPost(b ? b.dataset.bead : el.dataset.pid);
    return true;
  }
  /* Typing anywhere in the finder goes to the search. */
  if (!inSearch && e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey) { fq.focus(); return false; }
  return false;
}
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && (e.key === "j" || e.key === "J")) { e.preventDefault(); toggleFinder(); return; }
  if (S.finder && (finder.contains(e.target) || e.target.closest("#lpop") || e.target === document.body)) { if (finderKey(e)) return; if (finder.contains(e.target)) return; }
  const typing = e.target.matches("textarea, input");
  if (typing) {
    if (e.target.dataset.reply === undefined) return;
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); publishReply(BYID[e.target.dataset.reply]); }
    else if (e.key === "Escape") { e.preventDefault(); const id = e.target.dataset.reply; if (!(S.reply[id].text || "").trim()) { S.reply[id] = {on:false, text:""}; renderCards(); } dlayer.querySelector(`[data-card="${id}"]`).focus({preventScroll:true}); }
    return;
  }
  const card = e.target.closest && e.target.closest("[data-card]");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!card) return;
    e.preventDefault();
    const vs = visible(), i = vs.findIndex((t) => t.id === card.dataset.card);
    const n = vs[i + (e.key === "ArrowDown" ? 1 : -1)];
    if (n) { const el = dlayer.querySelector(`[data-card="${n.id}"]`); el.focus({preventScroll:true}); scrollToLine(n.line); }
  } else if ((e.key === "Enter" || e.key === " ") && card && card.classList.contains("closed")) {
    e.preventDefault(); openThread(card.dataset.card);
  } else if (e.key === "Escape" && S.open) {
    e.preventDefault(); closeThread();
  } else if ((e.key === "r" || e.key === "R") && S.open && !e.metaKey && !e.ctrlKey && !BYID[S.open].draft) {
    e.preventDefault(); S.reply[S.open] = {on:true, text:(S.reply[S.open] || {}).text || ""}; renderCards(); dlayer.querySelector(`[data-reply="${S.open}"]`).focus({preventScroll:true});
  } else if ((e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); nextNew(e.shiftKey ? -1 : 1);
  }
});
flistIn.addEventListener("focusin", (e) => { const el = e.target.closest(".frow, .fgh"); if (el && (el.dataset.row || el.dataset.fold) !== S.cursor) { S.cursor = el.dataset.row || el.dataset.fold; S.bead = -1; } });

/* ruler: click to jump, drag the thumb */
ruler.addEventListener("pointerdown", (e) => {
  if (e.target.closest("[data-go]")) return;
  const thumb = $(".thumb", ruler), r = ruler.getBoundingClientRect();
  const SH = code.scrollHeight, H = r.height;
  if (e.target === thumb) {
    const y0 = e.clientY, s0 = code.scrollTop;
    thumb.classList.add("drag"); thumb.setPointerCapture(e.pointerId);
    const mv = (ev) => (code.scrollTop = s0 + ((ev.clientY - y0) / H) * SH);
    const up = () => { thumb.classList.remove("drag"); thumb.removeEventListener("pointermove", mv); thumb.removeEventListener("pointerup", up); };
    thumb.addEventListener("pointermove", mv); thumb.addEventListener("pointerup", up);
  } else {
    code.scrollTo({top:((e.clientY - r.top) / H) * SH - code.clientHeight / 2, behavior:reduce ? "auto" : "smooth"});
  }
});
$("#grip").addEventListener("pointerdown", (e) => {
  const g = e.currentTarget, d = $("#drawer"), x0 = e.clientX, w0 = d.offsetWidth;
  g.classList.add("drag"); g.setPointerCapture(e.pointerId);
  const mv = (ev) => { d.style.width = Math.max(280, Math.min(760, w0 - (ev.clientX - x0))) + "px"; layout(); };
  const up = () => { g.classList.remove("drag"); g.removeEventListener("pointermove", mv); g.removeEventListener("pointerup", up); };
  g.addEventListener("pointermove", mv); g.addEventListener("pointerup", up);
});

function setTab(name) {
  S.tab = name;
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === name));
  $("#dview").hidden = name !== "comments";
  $("#tools").style.visibility = name === "comments" ? "" : "hidden";
  $("#pNotes").hidden = name !== "notes";
  $("#pTour").hidden = name !== "tour";
  if (name === "comments") layout();
}
function setTheme(name) {
  document.body.classList.toggle("dark", name === "dark");
  document.querySelectorAll("[data-theme]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.theme === name));
}

/* tooltips beside what they name */
const tip = $("#tip");
let tipFor = null;
function hideTip() { tip.hidden = true; tipFor = null; }
document.addEventListener("pointerover", (e) => {
  const el = e.target.closest("[data-tip]");
  if (el === tipFor) return;
  tipFor = el;
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, thh = tip.offsetHeight;
  let x = Math.min(r.left, innerWidth - tw - 6), y = r.bottom + 4;
  if (y + thh > innerHeight - 4) y = r.top - thh - 4;
  tip.style.left = Math.max(4, x) + "px"; tip.style.top = y + "px";
});
document.addEventListener("pointerdown", hideTip);
code.addEventListener("scroll", hideTip, {passive:true});
$("#flist").addEventListener("scroll", () => { hideTip(); hidePreview(); }, {passive:true});

/* start: ?theme=light|dark, ?place=tab|window, ?finder=1 opens it */
const q = new URLSearchParams(location.search);
setTheme(q.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
setPlace(q.get("place") === "window" ? "window" : "tab");
loadFile(CCV);
code.scrollTop = lineTop(636);
sync();
if (q.get("finder")) openFinder();
else toast("⌘J, or the finder button at the top of the drawer, finds any conversation in the pull request.", 6500);
</script>
