<title>BPR-1290 Conversations drawer frames v2</title>
<!--
  [[BPR-1290]] Conversations drawer, round v2. The owner, in BPR-1083's v002 review (session
  c2a2442c, sequence 25): "that one tab is trying to serve 2 masters. I think we need to split the
  inline comments and the comment tree into separate ttabs in the drawer." And on v1: "It's hard to
  tell the value of the inline comments without a long file, you have no long files in your mockups".

  v2 splits the old Comments tab in two:
    Inline        this file's threads as readable cards at their lines; a card expands in place
    Conversation  one conversation read in full, with its reply structure
  Notes and Tour are unchanged. Two real choices are drawn both ways:
    tree   indented at forks (ind)  |  flat with a "↩ name" chip (chip)
    pick   a card expands in place  |  picking a card opens it in Conversation

  Content.
  - Long file: src/adapters/qt/src/conversation_cards_view.cpp at 7513758b0, 1518 lines, this
    repository's own source (no fixture has threads on a long file). Its code lines are verbatim.
    Its seven threads are illustrative, written in the voices of the conventional-comments-v1
    fixture's people (tbutler, jiayin, fixture-author = you).
  - Short threads and the whole pull request: tests/fixtures/github/contracts/v1/conventional-comments-v1.
  - Deep thread: tests/fixtures/github/conversations/branching-thread-v1 (24 posts; the root has
    three branches; C forks at its third reply). Its unread state is illustrative.
  - Marks: BPR-1080's selected glyphs; posts per BPR-1083 v4 (18 px avatar, 16 px mark 3 px under
    it, rail 3 px left of it; blocking = filled mark, 4 px rail).

  Query parameters:  f = frame id (none draws the index)   theme = light (default) | dark
  Static design frames, not the product. Nothing here is implemented.
-->

    const sib = kids(p.p).length;
    if (o.style === "chip" || !branches) { vd[p.id] = 1; continue; }
    fork[p.id] = p.p === root.id || sib > 1;
    vd[p.id] = fork[p.id] ? vd[p.p] + 1 : vd[p.p];
  }
  let h = "", seen = false, prev = null;
  const folded = o.fold || {};
  for (const p of posts) {
    if (folded.hide && folded.hide.includes(p.id)) continue;
    if (p.u && !seen) { h += `<div class="newline" style="margin-left:${16 + vd[p.id] * STEP}px">New</div>`; seen = true; }
    const re = o.style === "chip" && branches && p.p && prev && p.p !== prev.id ? by[p.p] : null;
    h += post(p, {pl:16 + vd[p.id] * STEP, re, reHot:o.hotChip === p.id, sel:o.sel === p.id});
    prev = p;
    if (folded.after === p.id) {
      h += `<div class="fold" style="--pl:${16 + vd[p.id] * STEP}px" role="button" title="${folded.n} more replies on this run. Click to show them.">${ic("chev", "s")}<span class="stack">${folded.who.map(avatar).join("")}</span>${folded.n} more</div>`;
      prev = by[folded.last];
    }
  }
  return {html:h, meta:{style:o.style, branches, fork, vd, posts, STEP, root:root.id, knobHot:o.knobHot, foldedHide:(folded.hide || [])}};
}
/* Draw the guides after layout: from a post with several replies down to each of them. */
function drawGuides(feedin, meta) {
  if (meta.style === "chip" || !meta.branches) return;
  const box = feedin.getBoundingClientRect();
  const el = (id) => feedin.querySelector(`.post[data-id="${id}"]`);
  const av = (id) => { const e = el(id); if (!e) return null; const r = e.querySelector(".av").getBoundingClientRect(); return {x:r.left - box.left, y:r.top - box.top, w:r.width, h:r.height}; };
  for (const parent of meta.posts) {
    const ch = meta.posts.filter((p) => p.p === parent.id && meta.fork[p.id] && !meta.foldedHide.includes(p.id));
    if (!ch.length) continue;
    const pa = av(parent.id); if (!pa) continue;
    const x = pa.x + pa.w / 2 - 1;
    const last = av(ch[ch.length - 1].id); if (!last) continue;
    feedin.insertAdjacentHTML("beforeend", `<i class="guide" style="left:${x}px;top:${pa.y + pa.h + 3}px;height:${last.y + last.h / 2 - (pa.y + pa.h + 3)}px"></i>`);
    for (const c of ch) {
      const ca = av(c.id); if (!ca) continue;
      const y = ca.y + ca.h / 2 - 1;
      feedin.insertAdjacentHTML("beforeend", `<i class="elbow" style="left:${x}px;top:${y}px;width:${ca.x - x - 8}px"></i>`);
      const n = 1 + countBelow(meta.posts, c.id);
      feedin.insertAdjacentHTML("beforeend", `<span class="knob ${meta.knobHot === c.id ? "hot" : ""}" style="left:${x + 1}px;top:${y + 1}px" role="button" title="Fold this branch (${n} posts)">${ic("minus")}</span>`);
    }
  }
}
const countBelow = (ps, id) => ps.filter((p) => p.p === id).reduce((n, c) => n + 1 + countBelow(ps, c.id), 0);

/* ================= drawer pieces ================= */
function tabs(on, narrow) {
  const t = [["inline", "Inline", `${LUNREAD}`, `${LUNREAD} threads on this file have new comments`], ["conv", "Conversation", "", "One conversation, read in full"], ["notes", "Notes", "", "Private notes and AI tools"], ["tour", "Tour", "", "Guided tour of the changes"]];
  return `<div class="tabs" role="tablist">${t.map(([k, label, n, tip]) => {
    const showLabel = !narrow || k === on;
    return `<span class="tab ${k === on ? "on" : ""}" role="tab" title="${label}: ${tip}">${ic(k)}${showLabel ? label : ""}${n && (k !== "inline" || true) ? `<span class="pillc">${n}</span>` : ""}</span>`;
  }).join("")}</div>`;
}
const scopes = (pr) => `<span class="scopes">${btn("file", "This file", pr ? "" : "on")}${btn("pr", "Whole pull request", pr ? "on" : "")}</span>`;
const filterBtn = () => btn("filter", "Filter: new, unresolved, drafts, defects");
const nextNew = () => btn("next", "Next new comment ⌥N");
const navInline = () => `<div class="nav">${scopes(false)}<span class="vsep"></span>${btn("up", "Previous thread ⌥↑")}${btn("down", "Next thread ⌥↓")}<span class="sp"></span>${nextNew()}${filterBtn()}</div>`;

function replyBox(state) {
  if (state === "typing") {
    return `<div class="rbox"><div class="field on"><div><span class="lab" style="--t:${tint("suggestion")}">${mark("suggestion", 0, "sm")}suggestion</span></div><div>Wait on the clear's fence before draw_scene()<span class="caret"></span></div></div>
      <div class="ract">${btn("tag", "Label ⌘L")}<span class="priv" style="margin-left:4px">${ic("lock", "s")}Kept as your draft</span><span class="sp"></span>${btn("trash", "Discard")}<span class="btn pri" title="Publish reply ⌘↩">${ic("send", "s")}Publish</span></div></div>`;
  }
  return `<div class="rbox"><div class="rf">${avatar(ME)}<div class="field">Reply</div></div></div>`;
}

/* ---- Inline: one card ---- */
function card(k, o = {}) {
  const t = LT[k], u = unread(t), r = t.posts[0];
  if (t.draft) {
    return `<div class="card draft" data-k="${k}"><i class="notch"></i><div class="chead"><span class="where" title="Show line ${t.line}">${t.line}</span><span class="sp"></span><span class="priv">${ic("lock", "s")}Only you</span></div>
      ${post({...r, u:1})}<div class="dacts"><span class="sp"></span>${btn("pencil", "Edit draft")}${btn("trash", "Delete draft")}<span class="btn pri" title="Publish to GitHub">${ic("send", "s")}Publish</span></div></div>`;
  }
  const open = o.open;
  const n = t.posts.length - 1;
  const meta = open
    ? `${btn("resolve", "Resolve thread")}${btn("read", u ? `Mark ${u} new as read` : "Nothing new")}${btn("open", "Open in Conversation")}${btn("more", "More: copy link, view source, classify")}${btn("chevu", "Collapse")}`
    : `${n ? `<span class="stack" title="${people(t.posts).join(", ")}">${people(t.posts).map(avatar).join("")}</span><span class="cnt" title="${n} ${n === 1 ? "reply" : "replies"}">${ic("reply", "s")}${n}</span>` : ""}${u ? `<span class="n" title="${u} new">${u}</span>` : ""}${btn("chevd", "Show the whole conversation here")}`;
  let posts = "";
  if (open) {
    let seen = false;
    t.posts.forEach((p, i) => {
      if (p.u && !seen) { posts += `<div class="newline">New</div>`; seen = true; }
      posts += post(p, {pl:i ? 38 : 16});
    });
    posts += replyBox(o.reply);
  } else posts = post(r);
  return `<div class="card ${open ? "open" : ""} ${o.cur ? "cur" : ""} ${o.hov ? "hov" : ""} ${o.peek ? "peek" : ""}" data-k="${k}" ${o.peek ? `style="${o.peek === "up" ? "top:36px" : "bottom:36px"}"` : ""}>${o.peek ? "" : '<i class="notch"></i>'}<div class="chead">${o.peek ? `<span class="peekdir" title="Nearest thread ${o.peek === "up" ? "above" : "below"}">${ic(o.peek, "s")}</span>` : ""}<span class="where" title="Show line ${t.line}">${t.line}</span><span class="sp"></span>${meta}</div>${posts}</div>`;
}
function echip(k, hov) {
  const t = LT[k], u = unread(t), r = t.posts[0];
  const tip = t.draft ? `Your draft at line ${t.line}` : `Line ${t.line}: ${r.a}, ${t.posts.length} post${t.posts.length > 1 ? "s" : ""}${u ? ", " + u + " new" : ""}`;
  return `<span class="ech ${t.draft ? "dr" : ""} ${hov ? "hov" : ""}" data-k="${k}" role="button" title="${tip}. Click to scroll there.">${t.draft ? '<i class="dsh"></i>' : rootGlyph(r)}${t.line}${u ? '<i class="u"></i>' : ""}</span>`;
}

/* ================= the window around the drawer ================= */
const ROW = 19, FH = 24, NAVH = 64;
function hl(s) {
  let out = "", m;
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|\b(void|const|auto|bool|int|for|if|return|continue|break|true|false|static|constexpr|namespace|std|noexcept|this)\b|\b([A-Z][A-Za-z_]*[a-z][A-Za-z_]*)(?=\b)|\b([a-z_][a-z_0-9]*)(?=\()/g;
  let last = 0;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    const v = esc(m[0]);
    out += m[1] ? `<span class="cm">${v}</span>` : m[2] ? `<span class="str">${v}</span>` : m[3] ? `<span class="k">${v}</span>` : m[4] ? `<span class="ty">${v}</span>` : `<span class="fn">${v}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}
function codePane(top, rows, st) {
  let h = "";
  for (let n = top; n < top + rows; n++) {
    const txt = SRC[n];
    if (txt === undefined) break;
    const k = LKEYS.find((x) => LT[x].line === n);
    let gm = "";
    if (k) { const t = LT[k]; gm = `<i class="gm ${t.draft ? "dr" : ""}" style="background:${unread(t) ? "var(--new)" : "var(--open)"}" title="${t.draft ? "Your draft" : "Thread"}"></i>`; }
    const add = st.added && n >= st.added[0] && n <= st.added[1];
    h += `<div class="ln ${add ? "add" : ""} ${st.curLine === n ? "cur" : ""}"><span class="g">${n}</span>${gm}<span class="t">${hl(txt)}</span></div>`;
  }
  return `<div class="pane">${h}</div>`;
}
function ruler(top, rows) {
  // thumb and ticks as a share of the file; the frame's main area is 734 px, the ruler 710
  const H = 710;
  let h = `<i class="thumb" style="top:${(top - 1) / LONG.lines * H}px;height:${Math.max(10, rows / LONG.lines * H)}px"></i>`;
  for (const k of LKEYS) {
    const t = LT[k], r = t.posts[0];
    h += `<i class="rt ${t.draft ? "dr" : ""}" style="top:${(t.line - 1) / LONG.lines * H}px;background:${r.l ? tint(r.l) : "var(--ink-3)"}" title="Line ${t.line}"></i>`;
  }
  return `<div class="ruler" title="Threads in this file">${h}</div>`;
}

function inlineDrawer(st, dw) {
  const rows = st.rows;
  const inView = LKEYS.filter((k) => LT[k].line >= st.top && LT[k].line < st.top + rows);
  // nearest first in both edges
  const above = LKEYS.filter((k) => LT[k].line < st.top).reverse();
  const below = LKEYS.filter((k) => LT[k].line >= st.top + rows);
  const n = (a) => a.length;
  const fit = dw < 320 ? 3 : 5;
  const chips = (a) => a.slice(0, fit).map((k) => echip(k, st.hovChip === k)).join("") + (a.length > fit ? `<span class="dir" title="${a.slice(fit).map((k) => LT[k].line).join(", ")}">+${a.length - fit}</span>` : "");
  let lane = "";
  // when nothing is on these lines the nearest each way is drawn as a card, not a chip
  const peek = !inView.length;
  if (n(above)) lane += `<div class="edge top"><span class="dir" title="${n(above)} threads above">${ic("up", "s")}${n(above)}</span>${chips(peek ? above.slice(1) : above)}</div>`;
  for (const k of inView) lane += card(k, {open:st.open === k, cur:st.cur === k, reply:st.reply, hov:st.hovCard === k});
  if (!inView.length) {
    // Nothing on these lines: the nearest thread each way peeks in, closed.
    if (n(above)) lane += card(above[0], {peek:"up"});
    if (n(below)) lane += card(below[0], {peek:"down"});
    lane += `<div class="empty"><span>No threads on lines ${st.top}–${st.top + rows - 1}</span></div>`;
  }
  if (n(below)) lane += `<div class="edge bot"><span class="dir" title="${n(below)} threads below">${ic("down", "s")}${n(below)}</span>${chips(peek ? below.slice(1) : below)}</div>`;
  return `${tabs("inline", dw < 320)}<div class="dbody">${navInline()}<div class="lane" data-top="${st.top}" data-edges="${n(above) ? 1 : 0}${n(below) ? 1 : 0}">${lane}</div>${st.tip ? `<div class="tip" style="${st.tip.pos}">${st.tip.text}</div>` : ""}</div>`;
}
/* Place the cards at their lines once they can be measured: a card's top meets its line,
   unless the card above or the top edge pushes it down. */
function placeCards(lane) {
  const top = +lane.dataset.top;
  const edges = lane.dataset.edges;
  let y = edges[0] === "1" ? 36 : 6;
  for (const c of lane.querySelectorAll(".card:not(.peek)")) {
    const line = LT[c.dataset.k].line;
    const lineY = FH + (line - top) * ROW - NAVH;
    const at = Math.max(lineY, y);
    c.style.top = at + "px";
    const notch = c.querySelector(".notch");
    notch.style.top = Math.max(8, Math.min(lineY - at + 8, 20)) + "px";
    if (at !== lineY) notch.style.display = "none";
    y = at + c.offsetHeight + 8;
  }
}

function convDrawer(st, dw) {
  const narrow = dw < 320;
  let posts, head, ttl;
  if (st.deep) {
    ttl = {glyph:avatar("reviewer-one"), name:"thread_map.cpp", line:42, u:3};
    posts = tree(DEEP.posts, {style:st.style, step:narrow ? 18 : 22, fold:{after:"a01", hide:["a02", "a03", "a04", "a05", "a06", "a07", "a08"], n:7, last:"a08", who:["observer-three", "reviewer-four", "reviewer-one", "author-two"]}, hotChip:st.hotChip, sel:st.sel, knobHot:st.knobHot});
  } else if (st.long) {
    const t = LT[st.long];
    ttl = {glyph:mark(t.posts[0].l, t.posts[0].blk, "sm"), name:base(LONG.path), line:t.line, u:unread(t)};
    posts = tree(asTree(t), {style:st.style});
  } else {
    const t = T[st.key || "t6"];
    ttl = {glyph:mark(t.posts[0].l, t.posts[0].blk, "sm"), name:base(t.path), line:t.line, u:unread(t)};
    posts = tree(asTree(t), {style:st.style});
  }
  head = `<div class="thead"><span class="pick ${st.picker ? "on" : ""}" role="button" title="Choose a thread">${ttl.glyph}<span class="p">${ttl.name}<span>:${ttl.line}</span></span>${ic("chevd", "s")}</span>${btn("up", "Previous thread ⌥↑")}${btn("down", "Next thread ⌥↓")}<span class="sp"></span>${btn("code", `Show line ${ttl.line} in the code`)}${btn("resolve", "Resolve thread")}${narrow ? "" : btn("read", ttl.u ? `Mark ${ttl.u} new as read` : "Nothing new")}${btn("more", "More: mark read, copy link, view source, classify")}</div>`;
  let pop = "";
  if (st.picker) {
    let rows = "";
    for (const [f, ks] of PR) {
      rows += `<div class="fgroup" title="${f}">${f}</div>`;
      for (const k of ks) { const t = T[k], r = t.posts[0], u = unread(t); rows += `<div class="row ${k === (st.key || "t6") ? "on" : ""}">${rootGlyph(r)}<span class="ln2">${t.line}</span><span class="first">${esc(r.b)}</span>${u ? `<span class="n" title="${u} new">${u}</span>` : ""}</div>`; }
    }
    pop = `<div class="pop" style="left:6px;right:6px;top:${30 + 32}px">${rows}</div>`;
  }
  return `${tabs("conv", narrow)}<div class="dbody"><div class="conv">${head}<div class="feed"><div class="feedin ${st.tail ? "tail" : ""}" data-scroll="${st.scrollTo || ""}">${posts.html}</div></div>${replyBox(st.reply)}</div>${pop}${st.tip ? `<div class="tip" style="${st.tip.pos}">${st.tip.text}</div>` : ""}</div>`;
}

/* Put a tooltip by its target once laid out: below it, right-aligned to the drawer when needed. */
function anchorTips(st) {
  if (!st.tip || !st.tip.anchor) return;
  const tip = document.querySelector(".tip"), a = document.querySelector(st.tip.anchor);
  if (!tip || !a) return;
  const host = tip.offsetParent.getBoundingClientRect(), r = a.getBoundingClientRect();
  const w = tip.offsetWidth, hw = host.width;
  let x = r.left - host.left + (st.tip.dx || 0);
  x = Math.max(4, Math.min(x, hw - w - 4));
  const y = st.tip.above ? r.top - host.top - tip.offsetHeight - 6 : r.bottom - host.top + 6;
  tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.right = "auto"; tip.style.bottom = "auto";
}
function windowFrame(st, dw) {
  const rows = 38;
  const top = st.top;
  const drawer = st.tab === "conv" ? convDrawer(st, dw) : inlineDrawer({...st, rows}, dw);
  return `<div class="win"><div class="title"><span class="lights"><i></i><i></i><i></i></span><span class="tb">${ic("home")}</span><span class="tb">${ic("drawer")}</span><span class="sp"></span>
      <span class="seg"><span>Overview <kbd>⌘1</kbd></span><span class="on">Read <kbd>⌘2</kbd></span><span>Review <kbd>⌘3</kbd></span><span>Discuss <kbd>⌘4</kbd></span></span>
      <span class="tb">${ic("refresh")}</span><span class="tb on">${ic("drawer")}<span class="pillc">${LUNREAD}</span></span><span class="tb">${ic("user")}</span><span class="tb">${ic("sun")}</span></div>
    <div class="bar"><span>Comparing whole PR</span><span><b>Changes ${st.change || "2 of 5"}</b></span><span class="sp"></span></div>
    <div class="main"><div class="cmp"><div class="fh">${base(LONG.path)}<span>${LONG.lines} lines</span></div><div class="panes">${codePane(top, rows, st)}${ruler(top, rows)}</div></div>
      <div class="drawer" style="width:${dw}px">${drawer}</div></div>
    <div class="status">${st.status || "Actionable file 9 of 17."}</div></div>`;
}

/* ================= frames ================= */
const FRAMES = {};
const add = (id, cap, w, h, kind, st = {}, dw = 375) => (FRAMES[id] = {cap, w, h, kind, st, dw});
// Inline, the long file at three scroll positions.
add("in-p1", "Inline: line 642's thread open beside its code", 1440, 820, "window", {tab:"inline", top:632, open:"l642", cur:"l642", curLine:642, added:[643, 658], hovChip:"l1109",
  tip:{anchor:".ech.hov", above:true, text:"Line 1109: jiayin, 2 posts, 1 new. Click to scroll there."}});
add("in-p2", "Inline: after clicking 1109, the code has scrolled there", 1440, 820, "window", {tab:"inline", top:1095, open:"l1109", cur:"l1109", curLine:1109, added:[1117, 1124], change:"4 of 5"});
add("in-p3", "Inline at 280 px: scrolled by hand between threads", 1440, 820, "window", {tab:"inline", top:760, change:"3 of 5"}, 280);
// Conversation
add("cv-long", "Conversation: line 642's thread, opened from Inline", 1440, 820, "window", {tab:"conv", top:632, long:"l642", curLine:642, added:[643, 658], style:"ind"});
add("cv-reply", "Conversation: replying, renderer.cpp:6", 375, 760, "solo", {tab:"conv", key:"t6", reply:"typing", style:"ind"});
add("cv-pick", "Conversation: the thread list, whole pull request", 375, 760, "solo", {tab:"conv", key:"t6", picker:true, style:"ind"});
// The tree, both ways, on branching-thread-v1
for (const [s, name] of [["ind", "indented"], ["chip", "↩ chip"]]) {
  add(`tr-${s}-1`, `24 posts, ${name}: the top`, 375, 760, "solo", {tab:"conv", deep:true, style:s});
  add(`tr-${s}-2`, `24 posts, ${name}: branch C and its aside`, 375, 760, "solo", {tab:"conv", deep:true, style:s, scrollTo:"cc02", tail:true,
    ...(s === "chip" ? {hotChip:"aside", sel:"cc03", tip:{anchor:".re.hot", dx:40, text:"Answers author-two: Branch C, reply 3. Click to go there."}} : {knobHot:"aside", tip:{anchor:".knob.hot", dx:14, text:"Fold this branch (1 post)"}})});
  add(`tr-${s}-280`, `24 posts, ${name}, 280 px`, 280, 760, "solo", {tab:"conv", deep:true, style:s}, 280);
}
// Picking a thread in Inline opens it in Conversation: the Inline side
add("pk-inline", "Inline, cards closed: clicking one opens Conversation", 1440, 820, "window", {tab:"inline", top:632, cur:"l642", curLine:642, added:[643, 658], hovCard:"l642",
  tip:{anchor:".card.hov", above:true, dx:60, text:"Open in Conversation. ⌄ shows it here."}});

const f = Q.get("f");
const root = document.getElementById("root");
if (!f || !FRAMES[f]) {
  document.body.classList.add("index");
  root.innerHTML = `<div class="idx"><h3>BPR-1290 frames v2</h3>${Object.entries(FRAMES).map(([k, v]) => `<a href="?f=${k}">${k}: ${v.cap}</a><a href="?f=${k}&theme=dark">${k}, dark</a>`).join("")}</div>`;
} else {
  const F = FRAMES[f];
  if (F.kind === "window") root.innerHTML = windowFrame(F.st, F.dw);
  else { document.body.classList.add("solo"); root.innerHTML = `<div class="solo" style="width:${F.w}px;height:${F.h}px"><div class="drawer">${F.st.tab === "conv" ? convDrawer(F.st, F.w) : ""}</div></div>`; }
  for (const lane of document.querySelectorAll(".lane")) placeCards(lane);
  for (const fi of document.querySelectorAll(".feedin")) {
    const meta = tree(F.st.deep ? DEEP.posts : (F.st.long ? asTree(LT[F.st.long]) : asTree(T[F.st.key || "t6"])), {style:F.st.style, step:F.dw < 320 || F.w < 320 ? 18 : 22, fold:F.st.deep ? {after:"a01", hide:["a02", "a03", "a04", "a05", "a06", "a07", "a08"], n:7, last:"a08", who:[]} : {}, knobHot:F.st.knobHot}).meta;
    drawGuides(fi, meta);
    if (fi.dataset.scroll) { const t = fi.querySelector(`.post[data-id="${fi.dataset.scroll}"]`); if (t) fi.parentElement.scrollTop = t.offsetTop - 6; }
  }
  anchorTips(F.st);
}
</script>
