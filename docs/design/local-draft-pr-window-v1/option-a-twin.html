<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Option A · the pull request window</title><style>/* Tokens are the accepted pull request window mock's (docs/design/BPR-2051-agents-roster-and-footer)
   and the accepted tour stop's route colours (docs/design/v0-5-0-targets-v1). No new hue. */
*{box-sizing:border-box}
html{background:var(--canvas)}
html[data-theme=light]{--canvas:#dcdde1;--docink:#1b1c20;--docink2:#474a52;--doclink:#0b4fd6;--pickbg:rgba(26,127,55,.08);--pickline:rgba(26,127,55,.3);
--bg:#f6f7f9;--drawer:#f6f7f9;--panel:#fff;--panel2:#eceff2;--rule:#d9dee4;--rule2:#c3cad2;--ink:#1f2328;--ink2:#57606a;--ink3:#7d8590;--signal:#0969da;--ok:#1a7f37;--onok:#fff;--bad:#cf222e;--needs:#9a6100;--code:#fff;--gutter:#f0f2f5;--lnum:#5b6570;--add:#e6ffec;--del:#ffebe9;--agent:#4a3fd6;--agentwash:rgba(74,63,214,.07);--agentline:rgba(74,63,214,.34);--kw:#b51d27;--fn:#6639ba;--ty:#0550ae;--cm:#6e7781;--codeink:#1f2328;--winedge:rgba(0,0,0,.24);--shadow:0 26px 64px rgba(0,0,0,.22),0 3px 10px rgba(0,0,0,.10);--menu:rgba(250,250,251,.98);--sel:#0969da;--route:#a86e00;--routeline:#e4cf9f;--mine:#8250df;--waiting:#0969da;--rowrule:rgba(31,35,40,.08);--selrow:rgba(9,105,218,.11);color-scheme:light}
html[data-theme=dark]{--canvas:#101113;--docink:#e6edf3;--docink2:#a3acb6;--doclink:#7fb0e8;--pickbg:rgba(63,185,80,.08);--pickline:rgba(63,185,80,.3);
--bg:#1c2026;--drawer:#1f242b;--panel:#22272e;--panel2:#272d35;--rule:#30363f;--rule2:#414955;--ink:#e6edf3;--ink2:#a3acb6;--ink3:#7e8893;--signal:#7fb0e8;--ok:#3fb950;--onok:#0d1117;--bad:#f47067;--needs:#e0a23c;--code:#0d1117;--gutter:#141921;--lnum:#8b949e;--add:#153622;--del:#3e1f1f;--agent:#a3a0ff;--agentwash:rgba(163,160,255,.09);--agentline:rgba(163,160,255,.42);--kw:#6da9db;--fn:#dcdcaa;--ty:#4ec9b0;--cm:#8b949e;--codeink:#dcdcdc;--winedge:rgba(255,255,255,.16);--shadow:0 26px 64px rgba(0,0,0,.6),0 3px 10px rgba(0,0,0,.4);--menu:rgba(39,45,53,.985);--sel:#1f6fd0;--route:#e3b357;--routeline:#6b5622;--mine:#cf86e8;--waiting:#6d9bff;--rowrule:rgba(48,54,63,.55);--selrow:rgba(127,176,232,.15);color-scheme:dark}

/* ---------- the page around the frames ---------- */
body{margin:0;font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--docink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:40px 40px 120px}
.crumbs{display:flex;gap:18px;font-size:13.5px;margin:0 0 26px;color:var(--docink2)}
.crumbs .themes{margin-left:auto}
.wrap a{color:var(--doclink);text-decoration-thickness:1px;text-underline-offset:3px}
.wrap a:focus-visible{outline:2px solid var(--doclink);outline-offset:3px;border-radius:3px}
h1{font-size:30px;line-height:1.14;font-weight:700;letter-spacing:-.022em;margin:0 0 10px}
.lede{max-width:70ch;margin:0 0 8px;color:var(--docink2);font-size:16px;line-height:1.5}
h2{font-size:20px;font-weight:680;letter-spacing:-.012em;margin:60px 0 4px}
h2 + p,.say{max-width:74ch;margin:0 0 6px;color:var(--docink2)}
figure{margin:24px 0 34px}
figure .scroll{overflow-x:auto;padding:6px 6px 40px;margin:0 -6px -22px}
figcaption{max-width:80ch;margin:0;color:var(--docink2);font-size:14px;line-height:1.5}
figcaption b{color:var(--docink);font-weight:650}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:6px 36px;max-width:1000px;margin:14px 0 0;padding:0}
.trade dt{font-weight:650;margin:0 0 2px}
.trade dd{margin:0;color:var(--docink2);font-size:14.5px;line-height:1.5}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px -20px 0;max-width:1320px}
.thumbs img{display:block;width:100%;height:auto}
.links{font-size:14px;margin:6px 0 0;color:var(--docink2)}
ul.plain{max-width:78ch;margin:10px 0 0;padding-left:20px;color:var(--docink2);font-size:14.5px}
ul.plain li{margin:0 0 5px}
.pick{max-width:78ch;margin:16px 0 0;padding:12px 16px;border-radius:8px;background:var(--pickbg);box-shadow:inset 0 0 0 1px var(--pickline);font-size:15px}
.pick p{margin:0 0 8px}.pick p:last-child{margin:0}
body.shot{display:inline-block;padding:40px}
body.shot .wrap{max-width:none;margin:0;padding:0}
body.shot .doconly,body.shot figcaption{display:none}
body.shot figure{display:none;margin:0}
body.shot figure.sel{display:block}
body.shot figure .scroll{overflow:visible;padding:0;margin:0}
@media (max-width:760px){.wrap{padding:26px 18px 80px}.trade,.thumbs{grid-template-columns:1fr}}

/* ---------- the window, as the accepted mock draws it ---------- */
.bpr{--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Monaco,monospace;font:12.5px/16px var(--font);color:var(--ink);cursor:default;text-align:left}
.bpr.win{position:relative;border-radius:12px;background:var(--bg);overflow:hidden;box-shadow:0 0 0 .5px var(--winedge),var(--shadow);display:flex;flex-direction:column}
.bpr svg.i{flex:none;width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
.bpr .sp{flex:1}
.bpr a{color:var(--signal);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--signal) 40%,transparent);text-underline-offset:2px}
.tb1{flex:none;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px 0 11px}
.lights{display:flex;gap:8px;margin-right:10px}
.lights i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.16)}
.lights i:nth-child(2){background:#febc2e}
.lights i:nth-child(3){background:#28c840}
.ib{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:24px;border-radius:6px;color:var(--ink2)}
.ib.on{box-shadow:inset 0 0 0 1px var(--rule2);color:var(--ink)}
.ttl{flex:0 1 auto;min-width:0;margin-left:2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl b{font-weight:500;color:var(--ink2);margin-right:8px}
.seg{flex:none;display:inline-flex;height:24px;border-radius:7px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--rule)}
.seg span{display:inline-flex;align-items:center;gap:6px;padding:0 11px;border-radius:6px;white-space:nowrap}
.seg span i{font-style:normal;color:var(--ink3)}
.seg span.on{background:var(--sel);color:#fff}
.seg span.on i{color:rgba(255,255,255,.75)}
.seg span.off{color:var(--ink3);opacity:.6}
.badge{flex:none;display:inline-flex;align-items:center;height:18px;padding:0 8px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--rule2);color:var(--ink2);font-size:11.5px;font-weight:500;white-space:nowrap}
.btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:24px;padding:0 11px;border-radius:6px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule2);color:var(--ink);font-weight:500;white-space:nowrap}
.btn.pri{background:var(--sel);color:#fff;box-shadow:none;font-weight:600}
.btn.dis{opacity:.42}
.btn.quiet{background:transparent;box-shadow:none;color:var(--ink2);padding:0 8px}
.btn.agent{color:var(--agent);box-shadow:inset 0 0 0 1px var(--agentline);background:var(--agentwash)}
.btn.danger{color:var(--bad);background:transparent;box-shadow:none;padding:0 6px}
.btn.eq{min-width:78px}.btn.w96{min-width:96px}.btn.w132{min-width:132px}
.icb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:var(--ink2)}
.dd{flex:none;display:inline-flex;align-items:center;gap:14px;height:24px;padding:0 7px 0 11px;border-radius:6px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule2);white-space:nowrap}
.dd svg.i{width:9px;height:13px;color:var(--ink2)}
.dd.flat{height:20px;gap:6px;padding:0 4px;background:transparent;box-shadow:none}
.vr{flex:none;width:1px;height:14px;background:var(--rule2)}
.tb2{flex:none;display:flex;align-items:center;gap:14px;height:34px;padding:0 12px 0 14px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--bg)}
.tb2 .q{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);white-space:nowrap}
.tb2 .q svg.i{width:13px;height:13px}
.tb2 .nv{display:inline-flex;align-items:center;gap:12px;font-size:13.5px;white-space:nowrap;padding:0 4px 5px;border-bottom:2px solid var(--signal);margin-bottom:-7px}
.tb2 .nv svg.i{width:12px;height:12px;color:var(--ink2)}
.tb2.cut{border-top:0}
.pst{flex:none;display:inline-flex;align-items:center;gap:7px;color:var(--ink2);white-space:nowrap}
.pst .pd{width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.pst.amber{color:var(--needs)}.pst.amber .pd{background:var(--needs)}
.pst.ok .pd{background:var(--ok)}
.spin{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--signal);background:conic-gradient(var(--signal) 0 30%,transparent 30%)}
.main{flex:1;min-height:0;display:flex}
.lhead + .main{border-top:1px solid var(--rule)}
.diff{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--code)}
.fhead{position:relative;flex:none;height:26px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-bottom:1px solid var(--rule)}
.fhead .fl1,.fhead .fl2{position:absolute;top:0;height:25px;display:inline-flex;align-items:center;gap:8px;color:var(--ink2)}
.fhead .fl1{left:12px}.fhead .fl2{right:12px}
.fhead .fl1 svg.i,.fhead .fl2 svg.i{width:10px;height:10px}
.fhead.cutf{justify-content:flex-start;padding-left:60px}
.panes{flex:1;min-height:0;display:flex;overflow:hidden}
.pane{flex:1;min-width:0;padding-top:8px;overflow:hidden}
.pane + .pane{border-left:1px solid var(--rule)}
.ln{position:relative;display:flex;height:18px;font:11.5px/18px var(--mono);white-space:pre;color:var(--codeink)}
.ln .g{flex:none;width:40px;padding-right:9px;text-align:right;color:var(--lnum);background:var(--gutter)}
.ln .t{padding-left:9px;flex:1;min-width:0;overflow:hidden}
.ln.add .t{background:var(--add)}
.ln.del .t{background:var(--del)}
.ln.pad .t{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--rule) 5px 6px);opacity:.5}
.ln.rt .t{box-shadow:inset 2px 0 0 var(--route)}
.ln .mk{position:absolute;left:33px;top:2px;z-index:2;width:14px;height:14px;border-radius:50%;background:var(--route);color:var(--code);font:700 9px/14px var(--font);font-style:normal;text-align:center}
.k{color:var(--kw)}.f{color:var(--fn)}.y{color:var(--ty)}.c{color:var(--cm)}
.drawer{flex:none;display:flex;flex-direction:column;background:var(--drawer);border-left:1px solid var(--rule)}
.drawer.full{border-left:0}
.dtabs{flex:none;display:flex;padding:6px 10px 0;height:33px;border-bottom:1px solid var(--rule)}
.dtabs span{display:inline-flex;align-items:center;padding:0 13px;border:1px solid var(--rule);border-bottom:none;border-left-width:0;color:var(--ink2);background:var(--bg);font-weight:500}
.dtabs span:first-child{border-left-width:1px;border-top-left-radius:6px}
.dtabs span:last-child{border-top-right-radius:6px}
.dtabs span.on{color:var(--ink);background:var(--drawer);box-shadow:inset 0 2px 0 var(--signal);font-weight:600}
.sbar{flex:none;display:flex;align-items:center;gap:10px;height:28px;padding:0 12px 0 6px;border-top:1px solid var(--rule);background:var(--bg);white-space:nowrap}
.sbar .dif{flex:none;width:19px;height:23px;margin:0 2px 1px 3px}
.sbar .msg{font-size:13px}
.sbar .fresh{color:var(--ink3)}
.apill{flex:none;display:inline-flex;align-items:center;gap:7px;height:21px;padding:0 6px 0 10px;border-radius:10.5px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--rule)}
.apill svg.i{width:8px;height:12px;color:var(--ink2)}
.apill .q{color:var(--ink2)}
.cost{flex:none;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- the accepted Tour panel: head, route, pinned agent bar ---------- */
.tpanel{flex:1;min-height:0;display:flex;flex-direction:column}
.thead{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 9px 0 14px;border-bottom:1px solid var(--rule)}
.thead b{font-weight:600}
.st8{color:var(--ink3);margin-left:7px}
.tbody{flex:1;min-height:0;overflow:hidden;padding:13px 12px 0}
.tbody.pad{padding:14px 16px 0}
.sect{margin:0 2px 12px}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.sh b{font-weight:650;font-size:13px}
.sg{flex:none;width:16px;height:16px;border-radius:50%;background:var(--ok);color:var(--onok);display:inline-flex;align-items:center;justify-content:center}
.sg svg.i{width:10px;height:10px;stroke-width:2.2}
.prose{color:var(--ink2);line-height:1.5}
.stl{font-weight:650;font-size:13px;margin:2px 2px 5px}
.stop{position:relative;display:flex;gap:10px;padding:7px 8px 9px;border-radius:7px}
.stop::before{content:"";position:absolute;left:18px;top:31px;bottom:-7px;width:2px;background:var(--routeline)}
.stop.last::before{display:none}
.ring{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 10.5px/1 var(--font);background:var(--drawer);color:var(--route);box-shadow:inset 0 0 0 1.8px var(--route);position:relative;z-index:1}
.ring.ok{color:var(--ok);box-shadow:inset 0 0 0 1.8px var(--ok)}
.ring.sm{width:16px;height:16px;background:transparent}
.stop.open{background:var(--panel);box-shadow:inset 3px 0 0 var(--route),0 0 0 1px var(--rule)}
.stop.open.isok{box-shadow:inset 3px 0 0 var(--ok),0 0 0 1px var(--rule)}
.stop.open .ring{background:var(--panel)}
.st{flex:1;min-width:0}
.st > b{display:block;font-weight:600}
.trow{display:flex;align-items:center;gap:8px}
.trow b{flex:1;font-weight:600}
.trow .ico{color:var(--ink3);display:inline-flex}
.trow .ico.ag{color:var(--agent)}
.trow .ico svg.i{width:14px;height:14px}
.src{display:inline-block;margin-top:2px;padding:0 5px;border-radius:3px;color:var(--ink2);background:var(--panel2);font:11px/16px var(--mono)}
.src.go{color:var(--signal);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--signal) 40%,transparent);text-underline-offset:2px}
.ex{color:var(--ink2);margin-top:6px;line-height:1.55}
.ex code,.prose code{font:11.5px var(--mono);color:var(--ink);background:var(--panel2);padding:0 4px;border-radius:3px}
.cite{font:11.5px var(--mono);color:var(--signal);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--signal) 40%,transparent);text-underline-offset:2px}
.whyrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.why{flex:1;color:var(--route);font-size:11.5px}
.in{border-radius:6px;background:var(--code);box-shadow:inset 0 0 0 1px var(--rule2);padding:5px 9px}
.in.ta{margin-top:7px;min-height:88px;font:11.5px/1.6 var(--mono);white-space:pre-wrap}
.loc{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--ink3);font:11px var(--mono)}
.loc .btn{font:500 12.5px var(--font)}
.erow{display:flex;align-items:center;gap:6px;margin-top:10px}
.erow .btn svg.i{width:13px;height:13px}
.compose{flex:none;margin:8px 12px 10px;border-radius:9px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule2);padding:8px 8px 7px 11px}
.compose .ph{color:var(--ink3);height:24px}
.compose .tools{display:flex;align-items:center;gap:8px;padding-top:6px;border-top:1px solid var(--rule)}
.compose .tb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;color:var(--ink2)}
.compose .sess{color:var(--ink3);font-size:11.5px}
.compose .send{display:inline-flex;align-items:center;justify-content:center;width:40px;height:22px;border-radius:6px;background:var(--panel2);color:var(--ink3);box-shadow:inset 0 0 0 1px var(--rule)}
.md{font-size:13px;line-height:1.5}
.md h3{font-size:13px;font-weight:650;margin:0 0 2px}
.md p{margin:0 0 10px}
.md code,.pt code{font:11.5px var(--mono);background:var(--panel2);padding:1px 4px;border-radius:3px}
.msgs{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 12px 0;overflow:hidden}
.me{align-self:flex-end;max-width:84%;padding:6px 10px;border-radius:11px 11px 4px 11px;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--rule)}
.ag{line-height:1.5}
.prop{border-radius:8px;box-shadow:inset 0 0 0 1px var(--agentline);background:var(--agentwash);padding:9px 11px 10px}
.prop .ph{display:flex;align-items:center;gap:6px;color:var(--agent);font-weight:600;margin-bottom:5px}
.prop .ph svg.i{width:13px;height:13px}
.prop .pt{line-height:1.5}
.ended{display:flex;gap:10px;color:var(--ink3);font-size:11.5px}

/* ---------- publishing: steps, what is sent, menus ---------- */
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:9px;align-items:flex-start;padding:5px 0;color:var(--ink3)}
.steps .d{flex:none;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1.5px var(--rule2)}
.steps .d svg.i{width:10px;height:10px;stroke-width:2.2}
.steps li.done{color:var(--ink2)}
.steps li.done .d{background:var(--ok);box-shadow:none;color:var(--onok)}
.steps li.now{color:var(--ink);font-weight:600}
.steps li.now .d{box-shadow:inset 0 0 0 1.5px var(--signal);background:radial-gradient(circle,var(--signal) 0 3px,transparent 3.6px)}
.steps li.now.amber .d{box-shadow:inset 0 0 0 1.5px var(--needs);background:radial-gradient(circle,var(--needs) 0 3px,transparent 3.6px)}
.steps li.now.busy .d{background:conic-gradient(var(--signal) 0 30%,transparent 30%)}
.steps .bd{flex:1;min-width:0}
.steps .r{flex:none;color:var(--ink3);font-weight:400}
.steps .cmd{display:block;margin-top:7px}
.steps .cmd code{display:block;font:11px/16px var(--mono);font-weight:400;color:var(--ink);background:var(--code);box-shadow:inset 0 0 0 1px var(--rule2);border-radius:6px;padding:5px 9px}
.steps .acts{display:flex;gap:6px;margin:7px 0 3px}
.kv{display:grid;grid-template-columns:68px 1fr;gap:5px 10px;margin:0}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.kv dd b{font-weight:500;color:var(--ink)}
.menu{position:absolute;z-index:30;min-width:250px;padding:5px;border-radius:9px;background:var(--menu);box-shadow:0 0 0 .5px var(--winedge),0 12px 34px rgba(0,0,0,.28)}
.menu .mi{display:flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 6px;border-radius:5px;white-space:nowrap}
.menu .ck{flex:none;width:15px;display:inline-flex;justify-content:center}
.menu .ck svg.i{width:11px;height:11px;stroke-width:2}
.menu .r{margin-left:auto;padding-left:26px;color:var(--ink3);font-variant-numeric:tabular-nums}
.menu .r.amber{color:var(--needs)}
.menu .mi.on{background:var(--sel);color:#fff}
.menu .mi.on .r{color:rgba(255,255,255,.82)}
.menu hr,.pop hr{border:0;border-top:1px solid var(--rule);margin:5px 6px}
.menu .mh{padding:3px 10px 3px 27px;color:var(--ink3);font-size:11.5px;font-weight:600}
.pop{width:346px;margin:8px 10px 14px auto;padding:10px 14px 12px;border-radius:10px;background:var(--menu);box-shadow:0 0 0 .5px var(--winedge),0 12px 34px rgba(0,0,0,.26)}
.pop hr{margin:8px 0 10px}
.sheet{padding:18px 20px 16px;border-radius:10px;background:var(--bg);box-shadow:0 0 0 .5px var(--winedge),0 14px 40px rgba(0,0,0,.28)}
.sheet .sh1{display:block;font-size:13px;font-weight:700;margin-bottom:12px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px}
.chk.dim{color:var(--ink3)}
.chk .r{margin-left:auto}
.cb{flex:none;display:inline-block;width:14px;height:14px;border-radius:3.5px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule2);vertical-align:-2px}
.fb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:3.5px;font:700 9.5px/1 var(--font);box-shadow:inset 0 0 0 1px var(--rule2);color:var(--ink2)}

/* ---------- A: Overview and the Status tab ---------- */
.ov{flex:1;min-width:0;background:var(--code);padding:16px 22px 0;overflow:hidden}
.ov h1{font-size:19px;line-height:1.25;font-weight:700;letter-spacing:-.012em;margin:0}
.wants{color:var(--ink3);font-size:13px;margin:4px 0 12px}
.wants b{font-weight:500;color:var(--ink2)}
.descp{position:relative;border-radius:6px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--rule);padding:12px 48px 3px 14px}
.descp .edit{position:absolute;top:7px;right:8px}
.fl{margin-top:16px}
.fl .cap{color:var(--ink3);font-weight:600;font-size:13px;margin-bottom:6px}
table.files{width:100%;border-collapse:collapse;font-size:13px}
table.files th{text-align:left;font-weight:600;padding:4px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.files td{padding:0 8px;height:25px;white-space:nowrap;border-bottom:1px solid var(--rowrule)}
table.files td:first-child{width:230px}
table.files th:nth-child(2),table.files th:nth-child(3),table.files td.p,table.files td.m{text-align:right;width:76px}
table.files th:nth-child(4),table.files td.c{text-align:center;width:110px}
table.files td.p{color:var(--ok)}
table.files td.m{color:var(--bad)}
table.files td.nt{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;max-width:0}
table.files tr.grp td{color:var(--ink2);background:var(--bg)}
table.files tr.grp svg.i{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:6px}
table.files .fb{vertical-align:middle;margin:-2px 9px 0 0}
.gn{color:var(--ink3);margin-right:8px}
.inck{display:inline-flex;color:var(--ink3)}
.inck svg.i{width:12px;height:12px;stroke-width:1.9}
.stat{flex:1;min-height:0;padding:16px 14px 16px;overflow:hidden}
.who{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:650}
.bigdot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink3)}
.bigdot.amber{box-shadow:inset 0 0 0 2px var(--needs)}
.bigdot.ok{background:var(--ok);box-shadow:none}
.stat h5{margin:18px 0 6px;font-size:12px;font-weight:650;color:var(--ink2)}

/* ---------- B: the accepted header and the publish rail ---------- */
.lhead{flex:none;padding:9px 16px 9px;border-top:1px solid var(--rule);background:var(--bg)}
.lhead .r1{display:flex;align-items:center;gap:10px;height:26px}
.ltitle{font-size:16px;font-weight:650;letter-spacing:-.005em;white-space:nowrap}
.lhead .r2{display:flex;align-items:center;gap:8px;height:28px;margin-top:3px}
.ident{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);white-space:nowrap}
.ident b{font-weight:500;color:var(--ink)}
.ident svg.i{width:13px;height:13px}
.lhead.cut{border-top:0;border-bottom:1px solid var(--rule)}
.lhead.cut .r2{margin-top:0}
.rail{flex:none;display:flex;align-items:center;gap:14px;height:38px;padding:0 16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);background:var(--bg);white-space:nowrap}
.rsteps{flex:none;display:inline-flex;align-items:center;width:356px}
.rs{flex:none;display:inline-flex;align-items:center;gap:7px;color:var(--ink3);font-weight:500}
.rs .d{flex:none;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 10px/1 var(--font);box-shadow:inset 0 0 0 1.5px var(--rule2)}
.rs .d svg.i{width:10px;height:10px;stroke-width:2.2}
.rs.done{color:var(--ink2)}
.rs.done .d{background:var(--ok);box-shadow:none;color:var(--onok)}
.rs.now{color:var(--ink)}
.rs.now .d{box-shadow:inset 0 0 0 1.5px var(--signal);color:var(--signal)}
.rs.now.amber .d{box-shadow:inset 0 0 0 1.5px var(--needs);color:var(--needs)}
.rs.now.busy .d{font-size:0;background:conic-gradient(var(--signal) 0 30%,transparent 30%)}
.rl{flex:1;height:1px;background:var(--rule2);margin:0 10px}
.rtxt{flex:1;min-width:0;display:flex;align-items:center;gap:8px;color:var(--ink2);overflow:hidden}
.rtxt code{font:11.5px var(--mono);color:var(--ink);background:var(--code);box-shadow:inset 0 0 0 1px var(--rule2);border-radius:6px;padding:4px 9px;margin-right:2px}

/* ---------- C: the outline sidebar and the description's own page ---------- */
.side{flex:none;width:236px;background:var(--drawer);border-right:1px solid var(--rule);padding:4px 8px 0}
.side h6{margin:12px 8px 4px;font-size:11px;font-weight:650;color:var(--ink3)}
.srow{display:flex;align-items:center;gap:8px;height:26px;padding:0 8px;border-radius:6px;white-space:nowrap}
.srow.on{background:var(--selrow)}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.srow .r{flex:none;color:var(--ink3);font-size:11.5px;font-variant-numeric:tabular-nums}
.srow .r.amber{color:var(--needs)}
.srow .p{color:var(--ok)}.srow .m{color:var(--bad)}
.sch{display:flex;align-items:center;gap:4px;margin:2px 2px 6px 8px}
.sch .dd{flex:1;justify-content:space-between}
.side.cut{height:100%;border-radius:10px 0 0 10px}
.docp{flex:1;min-width:0;background:var(--code);display:flex;justify-content:center;padding:16px 24px 0;overflow:hidden}
.docc{width:100%;max-width:640px}
.dch{display:flex;align-items:center;height:28px;margin-bottom:8px}
.dch b{font-size:13px;font-weight:650}
.in.big{margin:0;height:340px;padding:10px 12px;font:12px/1.65 var(--mono)}

/* ---------- the states boards ---------- */
.board{display:flex;flex-wrap:wrap;gap:26px 24px;align-items:flex-start;width:1280px}
.lab{margin:0 0 8px;font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--docink2)}
.lab b{color:var(--docink);font-weight:650;margin-right:2px}
.slice{position:relative;border-radius:10px;background:var(--bg);box-shadow:0 0 0 .5px var(--winedge),0 10px 28px rgba(0,0,0,.14);overflow:hidden}
.slice.tall{overflow:visible;background:var(--code)}
.slice.tall > :first-child{border-radius:10px 10px 0 0}
.slice.under{background:var(--code)}
.slice.bare{background:transparent;box-shadow:none;overflow:visible;border-radius:0}

/* ---------- Home ---------- */
.home{flex:1;min-height:0;background:var(--bg);overflow:hidden;border-top:1px solid var(--rule)}
.home.split{display:flex}
.hmain{flex:1;min-width:0}
.hside{flex:none;width:324px;border-left:1px solid var(--rule);padding:22px 18px 0}
.hside .hsec{padding:16px 0 6px}
.openrow{display:flex;align-items:center;gap:12px;margin:16px 24px 6px}
.openf{flex:1;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--rule2)}
.openf .l{font-weight:600;font-size:13px}
.openf .ph{flex:1;color:var(--ink3);font-size:13px}
.openf .k{color:var(--ink3)}
.hlist{margin:0 24px}
.hsec{display:flex;align-items:baseline;gap:10px;padding:14px 0 5px 15px;font-weight:650}
.hsec .n,.hsec .sum{color:var(--ink3);font-weight:500}
.hsec.needs{color:var(--needs)}.hsec.mine{color:var(--mine)}.hsec.wait{color:var(--waiting)}
.hrow{display:grid;grid-template-columns:3px 88px 1fr auto;column-gap:12px;padding:7px 4px 7px 0;align-items:start}
.hrow + .hrow{border-top:1px solid var(--rowrule)}
.hrow .hr{align-self:stretch;border-radius:0 2px 2px 0}
.hrow .word{font-weight:650;padding-top:1px}
.hrow .title{font-weight:600;font-size:13px}
.hrow .id{color:var(--ink3);margin-left:8px;font-size:12px}
.hrow .id svg.i{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:3px}
.hrow .why{color:var(--ink2);margin-top:2px}
.hrow .when{color:var(--ink3);font-size:12px;padding-top:1px}
.hrow.needs .hr,.hrow.back .hr{background:var(--needs)}
.hrow.needs .word,.hrow.back .word{color:var(--needs)}
.hrow.ready .hr{background:var(--ok)}.hrow.ready .word{color:var(--ok)}
.hrow.mine .hr{background:var(--mine);opacity:.55}.hrow.mine .word{color:var(--mine)}
.hrow.wait .hr{background:var(--waiting);opacity:.55}.hrow.wait .word{color:var(--waiting)}
.hrow.draft .hr{background:var(--ink3);opacity:.55}.hrow.draft .word{color:var(--ink2)}
.hrow.one{padding:5px 4px 5px 0}
.drow{padding:7px 0;border-top:1px solid var(--rowrule)}
.drow .t1{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .t2{display:flex;align-items:center;gap:6px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden}
.drow .t2 svg.i{width:11px;height:11px;margin-right:-3px}
.drow .t2 b{color:var(--ink2);font-weight:650}
.drow .t2 .when{margin-left:auto}
