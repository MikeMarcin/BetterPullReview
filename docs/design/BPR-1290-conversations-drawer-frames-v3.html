<title>BPR-1290 Conversations drawer frames v3</title>
<!--
  [[BPR-1290]] Conversations drawer, round v3. The owner, in chat on 2026-10-06: "I feel like the
  treemap should be the primary interface to navigate the conversation view., unless you have a
  good reason it shouldnt be." Then: "Not to move around a single conversation, I mean to find the
  right conversation." The treemap is the Treeverse thread map (BPR-0418), of which the owner said
  on 2026-08-21: "it still needs to show the full branch that you clicked on, or at least up to
  the noce you selected."

  v3 makes the Conversation tab a map of every conversation in the pull request, grouped by file,
  above (A), beside (B) or in place of (C) the reader. Picking a conversation or one of its posts
  shows, in the reader, the branch from the first comment to that post and what follows it.
  Inline is v2's, unchanged (BPR-1290-conversations-drawer-frames-v2.html).

  The map's rule. Time runs left to right. A conversation's replies sit on one line in the order
  they were posted; a reply that has replies of its own starts a lane below, joined to the post it
  answers. A GitHub thread, where every reply answers the first comment, is therefore one line,
  and the map branches only where the conversation does. A line too long for the drawer folds
  its oldest read posts into a count; the picked post and new ones are never folded.

  Content.
  - The pull request is made up for the frames: 21 conversations in 10 files. The renderer.cpp,
    README, bloom.frag, main.cpp and button.cpp threads are tests/fixtures/github/contracts/v1/
    conventional-comments-v1's; conversation_cards_view.cpp's seven are v2's illustrative threads;
    the others are illustrative, in the fixture people's voices.
  - Long thread: github_thread_map.cpp:214, 17 posts, illustrative; every reply answers the first
    comment, as GitHub records it. Code lines of github_thread_map.cpp (196-239) and of
    conversation_cards_view.cpp are verbatim from this repository.
  - Deep thread: tests/fixtures/github/conversations/branching-thread-v1 (24 posts; A, B and C
    branch off the first comment; an aside forks off C's third reply). Its unread state is
    illustrative.
  - Marks: BPR-1080's selected glyphs; posts per BPR-1083 v4. Per-post unread is the ledger's
    (BPR-0656).

  Query parameters:  f = frame id (none draws the index)   theme = light (default) | dark
  Static design frames, not the product. Nothing here is implemented.
-->

  const lo = o.hl && !posts.some((p) => p.l === o.hl);
  return `<div class="cv ${c.k === (o.sel && o.sel.k) ? "sel" : ""} ${c.res ? "res" : ""} ${c.draft ? "dr" : ""} ${lo ? "lo" : ""}" data-k="${c.k}" style="height:${H}px"><svg class="ed" width="${W}" height="${H}">${d}</svg>${chip}${nodes}<span class="rt">${right}</span></div>`;
}

function mapView(W, o) {
  let h = "";
  for (const f of FILES) {
    if (o.scope === "file" && f !== o.here) continue;
    const all = CONVS.filter((c) => c.path === f);
    let cs = all;
    if (o.only) cs = cs.filter((c) => o.only.includes(c.k));
    if (o.filters && o.filters.unread) cs = cs.filter((c) => unread(c) && !c.draft);
    if (o.filters && o.filters.unres) cs = cs.filter((c) => !c.res);
    if (!cs.length) continue;
    const closed = o.closed && o.closed.includes(f);
    if (!o.only) {
      const fu = all.some((c) => unread(c) && !c.draft);
      h += `<div class="fgrp ${f === o.here ? "here" : ""}" title="${f}"><span class="tw">${ic(closed ? "chev" : "chevd", "s")}</span>${ic("file", "s")}<span class="fn2">${base(f)}</span>${f === o.here ? `<span class="herem" title="The file in the code">${ic("code", "s")}</span>` : ""}<span class="fc">${cs.length === all.length ? all.length : cs.length + "/" + all.length}</span>${fu && closed ? '<i class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--new)"></i>' : ""}</div>`;
    }
    if (closed) continue;
    for (const c of cs) h += mapConv(c, W, o);
  }
  return `<div class="map"><div class="mapin" data-scroll="${o.mapScroll || ""}">${h}</div></div>`;
}
const LABELS = ["issue", "question", "suggestion", "todo", "nitpick", "praise", "thought", "chore", "typo", "quibble"];
const labelCount = (l) => CONVS.reduce((n, c) => n + c.posts.filter((p) => p.l === l).length, 0);
function mapBar(o) {
  const f = o.filters || {};
  const hl = o.hl ? `<span class="tg on" title="Highlighting ${o.hl}: ${labelCount(o.hl)} posts. Click to change.">${mark(o.hl, 0, "sm")}${labelCount(o.hl)}<span class="x">${ic("chevd", "s")}</span></span>`
    : `<span class="tg ${o.menu ? "on" : ""}" title="Highlight a label">${ic("tag", "s")}${ic("chevd", "s")}</span>`;
  return `<div class="nav">${scopes(o.scope === "pr")}<span class="vsep"></span>
    <span class="tg ${f.unread ? "on" : ""}" title="Only conversations with new comments"><i class="u"></i>${PRUNREAD}</span>
    <span class="tg ${f.unres ? "on" : ""}" title="Only unresolved conversations">${ic("unres", "s")}${PRUNRES}</span>${hl}
    <span class="sp"></span>${btn("next", "Next new comment ⌥N")}</div>`;
}
function labelMenu() {
  const rows = LABELS.filter(labelCount).map((l) => `<div class="lrow ${l === "issue" ? "on" : ""}">${mark(l, 0, "sm")}${l}<span class="c">${labelCount(l)}</span></div>`).join("");
  return `<div class="pop" style="left:120px;width:170px;top:${30 + 34}px">${rows}</div>`;
}

/* ================= the reader: the picked branch ================= */
function reader(c, focusId, o = {}) {
  const L = layout(c.posts), by = Object.fromEntries(c.posts.map((p) => [p.id, p]));
  const focus = focusId || L.root.id;
  const path = []; for (let w = focus; w; w = L.dpar[w]) path.unshift(w);
  const down = new Set(descend(L.dpar, focus));
  const show = c.posts.filter((p) => path.includes(p.id) || down.has(p.id));
  const r = L.root;
  let h = "", seen = false, prev = null;
  for (const p of show) {
    if (p.u && !seen) { h += `<div class="newline" style="margin-left:34px">New</div>`; seen = true; }
    const re = p.p && prev && p.p !== prev.id && p.p !== r.id ? by[p.p] : null;
    h += post(p, {pl:p.id === r.id ? 16 : 34, re}).replace('class="post', `class="post ${p.id === focus ? "foc" : ""} ${down.has(p.id) ? "dwn" : ""}`);
    const others = Object.keys(L.dpar).filter((v) => L.dpar[v] === p.id && !path.includes(v) && !down.has(v));
    if (path.includes(p.id) && p.id !== focus && others.length) {
      const n = others.length;
      h += `<div class="fork" style="--pl:${p.id === r.id ? 16 : 34}px" title="${n} other ${n === 1 ? "branch starts" : "branches start"} here. Pick ${n === 1 ? "it" : "one"} in the map.">${ic("fork", "s")}${n}</div>`;
    }
    prev = p;
  }
  const u = unread(c);
  const glyph = r.l ? mark(r.l, r.blk, "sm") : avatar(r.a);
  const narrow = o.W < 320;
  const head = `<div class="thead"><span class="ttl" title="${c.path}:${c.line}">${glyph}<span class="p">${base(c.path)}<span>:${c.line}</span></span></span>${o.noNav ? "" : btn("up", "Previous conversation ⌥↑") + btn("down", "Next conversation ⌥↓")}<span class="sp"></span>${btn("code", `Show line ${c.line} in the code`)}${btn("resolve", "Resolve")}${narrow ? "" : btn("read", u ? `Mark ${u} new as read` : "Nothing new")}${btn("more", "More: copy link, view source, classify")}</div>`;
  return `<div class="conv">${head}<div class="feed"><div class="feedin" data-focus="${focus}">${h}</div></div>${replyBox(o.reply)}</div>`;
}

/* ================= the Conversation tab ================= */
function tabs3(on, narrow) {
  const t = [["inline", "Inline", LUNREAD, `${LUNREAD} threads on this file have new comments`], ["conv", "Conversation", PRUNREAD, `${PRUNREAD} conversations have new comments`], ["notes", "Notes", 0, "Private notes and AI tools"], ["tour", "Tour", 0, "Guided tour of the changes"]];
  return `<div class="tabs" role="tablist">${t.map(([k, label, n, tip]) => `<span class="tab ${k === on ? "on" : ""}" role="tab" title="${label}: ${tip}">${ic(k)}${!narrow || k === on ? label : ""}${n ? `<span class="pillc">${n}</span>` : ""}</span>`).join("")}</div>`;
}
function convTab(st, dw) {
  const narrow = dw < 320, sel = st.sel, c = sel ? CV[sel.k] : null;
  const o = {...st, W:dw};
  let bodyH;
  if (st.layout === "stack") {
    bodyH = `<div class="mapwrap" style="height:${st.mapH}px">${mapBar(o)}${mapView(dw, o)}</div><div class="split" title="Drag to share the height"><i></i></div>${reader(c, sel.n, {W:dw, reply:st.reply})}`;
  } else if (st.layout === "beside") {
    const mw = st.mapW || 340;
    bodyH = `<div class="bes"><div class="mapwrap">${mapBar({...o, W:mw})}<div style="width:${mw}px;flex:1;display:flex;min-height:0">${mapView(mw, {...o, W:mw})}</div></div><div class="vsplit" title="Drag to share the width"><i></i></div>${reader(c, sel.n, {W:dw - mw})}</div>`;
  } else if (st.layout === "drill-map") {
    bodyH = `<div class="mapwrap" style="flex:1">${mapBar(o)}${mapView(dw, o)}</div>`;
  } else {
    bodyH = `<div class="back">${`<span class="tg" title="Back to all conversations (Esc)">${ic("back", "s")}${ic("map", "s")}${CONVS.length}</span>`}<span class="sp"></span>${btn("up", "Previous conversation ⌥↑")}${btn("down", "Next conversation ⌥↓")}</div><div class="strip">${mapConv(c, dw, o)}</div>${reader(c, sel.n, {W:dw, reply:st.reply, noNav:true})}`;
  }
  return `${tabs3("conv", narrow)}<div class="dbody">${bodyH}${st.menu ? labelMenu() : ""}${st.tip ? `<div class="tip">${st.tip.text}</div>` : ""}</div>`;
}

/* ================= the window ================= */
function codePane3(cf, top, rows, st) {
  let h = "";
  for (let n = top; n < top + rows; n++) {
    const txt = cf.src[n];
    if (txt === undefined) break;
    const c = CONVS.find((x) => x.path === cf.path && x.line === n);
    const gm = c ? `<i class="gm ${c.draft ? "dr" : ""}" style="background:${unread(c) && !c.draft ? "var(--new)" : "var(--open)"}" title="Conversation"></i>` : "";
    h += `<div class="ln ${st.curLine === n ? "cur" : ""}"><span class="g">${n}</span>${gm}<span class="t">${hl(txt)}</span></div>`;
  }
  return `<div class="pane">${h}</div>`;
}
function ruler3(cf, top, rows) {
  const H = 710;
  let h = `<i class="thumb" style="top:${(top - 1) / cf.lines * H}px;height:${Math.max(10, rows / cf.lines * H)}px"></i>`;
  for (const c of CONVS.filter((x) => x.path === cf.path)) {
    const r = c.posts[0];
    h += `<i class="rt ${c.draft ? "dr" : ""}" style="top:${(c.line - 1) / cf.lines * H}px;background:${r.l ? tint(r.l) : "var(--ink-3)"}" title="Line ${c.line}"></i>`;
  }
  return `<div class="ruler" title="Conversations in this file">${h}</div>`;
}
function windowFrame3(st, dw) {
  const cf = CODEF[st.file], rows = 38;
  return `<div class="win"><div class="title"><span class="lights"><i></i><i></i><i></i></span><span class="tb">${ic("home")}</span><span class="tb">${ic("drawer")}</span><span class="sp"></span>
      <span class="seg"><span>Overview <kbd>⌘1</kbd></span><span class="${st.discuss ? "" : "on"}">Read <kbd>⌘2</kbd></span><span>Review <kbd>⌘3</kbd></span><span class="${st.discuss ? "on" : ""}">Discuss <kbd>⌘4</kbd></span></span>
      <span class="tb">${ic("refresh")}</span><span class="tb on">${ic("drawer")}<span class="pillc">${PRUNREAD}</span></span><span class="tb">${ic("user")}</span><span class="tb">${ic("sun")}</span></div>
    <div class="bar"><span>Comparing whole PR</span><span><b>Changes ${st.change || "4 of 10"}</b></span><span class="sp"></span></div>
    <div class="main"><div class="cmp"><div class="fh">${base(cf.path)}<span>${cf.lines} lines</span></div><div class="panes">${codePane3(cf, st.top, rows, st)}${ruler3(cf, st.top, rows)}</div></div>
      <div class="drawer" style="width:${dw}px">${convTab({...st, here:cf.path}, dw)}</div></div>
    <div class="status">${st.status || "21 conversations in 10 files."}</div></div>`;
}

/* ================= frames ================= */
const FRAMES = {};
const add = (id, cap, w, h, kind, st = {}, dw = 375) => (FRAMES[id] = {cap, w, h, kind, st, dw});
// A. Map above, reader below
add("a-long", "A. The long GitHub thread at line 214, picked at its tenth post", 1440, 820, "window",
  {layout:"stack", file:"map", top:196, curLine:214, scope:"pr", sel:{k:"g214", n:"p9"}, mapH:356, mapScroll:"g214"});
add("a-deep", "A. branching-thread-v1, picked at the aside off branch C", 375, 820, "solo",
  {layout:"stack", scope:"pr", sel:{k:"deep", n:"aside"}, mapH:392, mapScroll:"deep", here:LONG.path});
add("a-filter", "A. Only new, issue highlighted", 375, 820, "solo",
  {layout:"stack", scope:"pr", filters:{unread:1}, hl:"issue", sel:{k:"g214", n:"p12"}, mapH:330, here:LONG.path});
add("a-menu", "A. Choosing a label to highlight", 375, 820, "solo",
  {layout:"stack", scope:"pr", menu:1, sel:{k:"t6"}, mapH:330, here:LONG.path});
add("a-280", "A at 280 px, this file only", 280, 820, "solo",
  {layout:"stack", scope:"file", sel:{k:"l642"}, mapH:236, here:LONG.path});
// B. Map beside the reader
add("b-long", "B. Beside, the drawer at 760 px", 1440, 820, "window",
  {layout:"beside", file:"map", top:196, curLine:214, scope:"pr", sel:{k:"g214", n:"p12"}, mapScroll:"p175", mapW:340}, 760);
add("b-deep", "B. branching-thread-v1 picked at branch B's sixth reply", 760, 820, "solo",
  {layout:"beside", scope:"pr", sel:{k:"deep", n:"b06"}, mapScroll:"g214", mapW:340, here:LONG.path}, 760);
// C. The map fills the tab; picking folds it to the picked conversation
add("c-map", "C. The map fills the tab", 375, 820, "solo",
  {layout:"drill-map", scope:"pr", here:LONG.path, hov:"g214:p12", tip:{text:"jiayin, issue, new: A parent that arrives on the next page is promoted and never re-parented."}, closed:["README.md", "docs/ux/workbench-specification.md"]});
add("c-deep", "C. After picking branch C's fifth reply", 375, 820, "solo",
  {layout:"drill-read", scope:"pr", sel:{k:"deep", n:"cc05"}, here:LONG.path});
add("c-long", "C. After picking the long thread's first new post", 375, 820, "solo",
  {layout:"drill-read", scope:"pr", sel:{k:"g214", n:"p12"}, here:LONG.path});
// Inline pick B: the click lands here
add("pk-after", "Inline pick B: after clicking line 642's card", 1440, 820, "window",
  {layout:"stack", file:"cards", top:632, curLine:642, scope:"pr", sel:{k:"l642"}, mapH:330, mapScroll:"l38"});

const f = Q.get("f");
const root = document.getElementById("root");
if (!f || !FRAMES[f]) {
  document.body.classList.add("index");
  root.innerHTML = `<div class="idx"><h3>BPR-1290 frames v3</h3>${Object.entries(FRAMES).map(([k, v]) => `<a href="?f=${k}">${k}: ${v.cap}</a><a href="?f=${k}&theme=dark">${k}, dark</a>`).join("")}</div>`;
} else {
  const F = FRAMES[f];
  if (F.kind === "window") root.innerHTML = windowFrame3(F.st, F.dw);
  else { document.body.classList.add("solo"); root.innerHTML = `<div class="solo" style="width:${F.w}px;height:${F.h}px"><div class="drawer">${convTab(F.st, F.w)}</div></div>`; }
  for (const mi of document.querySelectorAll(".mapin[data-scroll]")) {
    const k = mi.dataset.scroll; if (!k) continue;
    const t = mi.querySelector(`.cv[data-k="${k}"]`); if (t) { let g = t.previousElementSibling; while (g && !g.classList.contains("fgrp")) g = g.previousElementSibling; mi.parentElement.scrollTop = Math.max(0, Math.min(t.offsetTop - 30, g ? g.offsetTop - 4 : 1e9)); }
  }
  for (const fi of document.querySelectorAll(".feedin[data-focus]")) {
    const t = fi.querySelector(".post.foc"), feed = fi.parentElement;
    if (t && t.offsetTop + t.offsetHeight > feed.clientHeight - 10) feed.scrollTop = t.offsetTop - feed.clientHeight * 0.3;
  }
  const tip = document.querySelector(".tip"), hov = document.querySelector(".nd.hov");
  if (tip && hov) {
    const host = tip.offsetParent.getBoundingClientRect(), r = hov.getBoundingClientRect();
    tip.style.left = Math.max(4, Math.min(r.left - host.left - 40, host.width - tip.offsetWidth - 4)) + "px";
    tip.style.top = (r.bottom - host.top + 8) + "px";
  }
}
</script>
