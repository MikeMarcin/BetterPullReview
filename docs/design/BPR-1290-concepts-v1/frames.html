<title>BPR-1290 whole-window concepts v1, frames</title>
<!--
  [[BPR-1290]] Whole-window concepts, round 1. The source of every still in this folder.

  The owner on round v3 (2026-10-06, session 8ecbfc20, stopped): "the treeverse review i'm finding
  it hard to choose any of those they all look bad and that review page format isn't ideal for
  mockup judging on a big redesign like this." They chose fresh whole-window concepts, shown as
  large stills, before any prototype.

  Three concepts of reading and discussing with code, line-anchored threads, the conversation
  finder (the Treeverse map across the whole pull request) and the reader together:
    A  Atlas   the map is a navigator column at the left, code in the centre, the reader at right
    B  Desk    the conversation is the workspace: a forest of every conversation across the top,
               the reader in the middle, the code peeking at the right
    C  Margin  the code is the page: threads are notes in its margin and open under their line;
               the map is a finder laid over the window

  Shared, as accepted: BPR-1080's twelve glyphs and BPR-1079's tints; every post with its 16 px
  mark under its 18 px avatar and its rail (BPR-1083 v4: 2 px solid, 4 px blocking, grey when
  plain). Amber is the picked route, after the accepted Treeverse mockup's "in focus".

  Content. The long file is this repository's src/adapters/qt/src/conversation_cards_view.cpp at
  1d839518c (1550 lines; code verbatim). The pull request is made up: 22 conversations in 10
  files, extended from round v3's set, in the voices of conventional-comments-v1's people. The
  deep conversation has branching-thread-v1's shape (24 posts, three branches off the first
  comment, an aside forking off the third reply of the third branch), re-anchored to line 667 of
  the long file; its words and unread state are illustrative.

  Query parameters: c = A | B | C   f = main | d1 | d2   theme = light | dark
  The window fills the viewport; stills are taken at 1440x900 and 1920x1080.
  Static design frames, not the product. Nothing here is implemented.
-->

function hl(s) {
  let out = "", m;
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|\b(void|const|auto|bool|int|for|if|else|return|continue|break|true|false|static|constexpr|namespace|noexcept|this|nullptr|using)\b|\b(std|QRect|QColor|QPoint|QFontMetrics|QKeyEvent|card_post|thread_card|cards_scope|card_action|size_t|string|vector|optional)\b|\b([a-z_][a-z_0-9]*)(?=\()|\b([A-Z][A-Za-z]+)\b/g;
  let last = 0;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    const v = esc(m[0]);
    out += m[1] ? `<span class="cm">${v}</span>` : m[2] ? `<span class="str">${v}</span>` : m[3] ? `<span class="k">${v}</span>` : m[4] ? `<span class="ty">${v}</span>` : m[5] ? `<span class="fn">${v}</span>` : `<span class="nm">${v}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

function forestHtml(Wb, Hb, o = {}) {
  const S = o.step || 20, LW = o.lanew || 21, top0 = 56, bottom = 32;
  const avail = Hb - top0 - bottom - 16;
  const cap = Math.floor(avail / S) - 1;
  /* widths */
  const items = CONVS.map((c) => {
    const sel = o.sel && o.sel.k === c.k;
    const r = routeOf(c, sel ? o.sel.n : null);
    const f = folds(c, r.Lo, cap, sel ? r.focus : null);
    return {c, ...r, ...f, sel, w:(r.Lo.lanes - 1) * LW + 24};
  });
  const gapC = 8;

  const groups = FILES.map((f) => {
    const its = items.filter((x) => x.c.path === f);
    const inner = its.reduce((s, x) => s + x.w, 0) + gapC * (its.length - 1);
    const w = Math.max(inner + 16, 60);
    total += w;
    return {f, its, inner, w, want:base(f).length * 6.3 + 30};

  let room = Wb - 32 - total - 10 * (groups.length - 1);
  for (let pass = 0; pass < 6 && room > 1; pass++) {
    const short = groups.filter((g) => g.want > g.w);
    if (!short.length) break;
    const share = room / short.length;
    for (const g of short) { const d = Math.min(share, g.want - g.w); g.w += d; room -= d; }
  }
  const gapF2 = 10 + Math.max(0, room) / (groups.length - 1);
  let x = 16;
  let h = "";
  for (const g of groups) {
    const isHere = g.f === HERE;
    const fu = g.its.filter((v) => unread(v.c) && !v.c.draft).length;
    h += `<div class="terr ${isHere ? "here" : ""}" style="left:${x}px;width:${g.w}px" title="${g.f}"><span class="tn">${base(g.f)}</span>${fu ? '<i class="dot" style="width:6px;height:6px"></i>' : ""}</div>`;
    let cx = x + (g.w - g.inner) / 2;
    for (const it of g.its) {
      const {c, Lo, focus, path, down, hidden, pills, sel} = it;
      const Xl = (lane) => 11 + lane * LW;
      const Y = (id) => {

        return 22 + (Lo.pos[id].col + 1) * S;

      };

      let d = "";
      for (const v of ids) d += `<path d="${seg(Lo.dpar[v], v)}"/>`;
      if (sel) { for (const v of ids) if (down.has(v)) d += `<path class="dn" d="${seg(Lo.dpar[v], v)}"/>`; for (const v of ids) if (path.has(v)) d += `<path class="pa" d="${seg(Lo.dpar[v], v)}"/>`; }
      const by = Object.fromEntries(c.posts.map((p) => [p.id, p]));
      let nodes = "";

        if (hidden.has(v)) continue;

          o.hl ? (p.l === o.hl ? "hit" : "lo") : "", o.hov && o.hov.k === c.k && o.hov.n === v ? "hov" : ""].join(" ");
        nodes += `<span class="${cls}" style="left:${Xl(lane(v))}px;top:${Y(v)}px" title="${esc(tipOf(p))}">${nodeFace(p)}</span>`;
      }
      for (const pl of pills) nodes += `<span class="vfold" style="left:${Xl(pl.lane)}px;top:${22 + (pl.col + 1) * S + S * 0.5}px" title="${pl.n} earlier replies, all read">${pl.n}</span>`;
      const maxY = Math.max(...[Lo.root.id, ...ids].filter((v) => !hidden.has(v)).map(Y));
      const u = unread(c);

      const badge = c.draft ? `<span class="lock" style="position:absolute;left:${Xl(0)}px;top:${maxY + 14}px;transform:translateX(-50%)">${ic("lock", "xs")}</span>`
        : c.res ? `<span class="okm" style="position:absolute;left:${Xl(0)}px;top:${maxY + 13}px;transform:translateX(-50%)">${ic("okc", "xs")}</span>` : "";
      h += `<div class="tree ${sel ? "sel" : ""} ${c.res ? "res" : ""} ${lo ? "lo" : ""}" style="left:${cx}px;top:${top0}px;width:${it.w}px;height:${maxY + 20}px" title="${esc(base(c.path) + ":" + c.line + (u ? ", " + u + " new" : ""))}">${halo}<span class="tl" style="left:${Xl(0)}px">${c.line}</span><svg width="${it.w}" height="${maxY + 20}">${d}</svg>${nodes}${badge}</div>`;
      cx += it.w + gapC;

  const d2 = FR === "d2";
  const top = d2 ? 640 : BIG ? 652 : 659;
  const lines = `<div class="lines" style="width:${codeW}px">${codeLines(top, rows, d2 ? {sel:[656, 656]} : {pick:667, after:{667:unfold}})}</div>`;
  const notes = `<div class="margin" id="margin"></div>`;
  const textra = ib("map", "Find a conversation ⌘J", FR === "d1" ? "on" : "", `<span class="bd">${PRNEW}</span>`);
  let over = "";
  if (FR === "d1") over = overlayC();
  return chrome(`<div class="page">${lines}${notes}${ruler(top, 40)}</div>${over}`, {mode:"Read", status:"Read", textra});
}
function overlayC() {
  const SW = Math.min(W - 160, BIG ? 1500 : 1240);
  const preW = BIG ? 460 : 400;
  const colW = Math.floor((SW - preW) / 2);
  const q = "page";
  const match = (p) => /page/i.test(p.b);
  const half = Math.ceil(FILES.length / 2);
  const hlFile = (s) => s;
  const col1 = mapRows(colW, {files:FILES.slice(0, 3), sel:{k:"deep", n:"b5"}, match, step:20, x0:76, noHere:false});
  const col2 = mapRows(colW, {files:FILES.slice(3), match, step:20, x0:76});
  const c = CV.deep;
  const pre = `<div class="spre" style="width:${preW}px">${rhead(c, {crumbs:BIG, focus:"b5", noCode:true})}<div class="feed" style="padding-top:6px">${
    feedHtml(c, "b5").replace(/(next page|page)/g, '<mark class="hit">$1</mark>')}</div></div>`;
  const nm = CONVS.reduce((n, x) => n + x.posts.filter(match).length, 0);
  const nc = CONVS.filter((x) => x.posts.some(match)).length;
  return `<div class="scrim"></div><div class="sheet" style="width:${SW}px">
    <div class="shead"><span class="find on">${ic("search")}<span>${q}</span><span class="caret" style="height:17px"></span><span class="sp"></span><span style="color:var(--ink-3);font-size:12px">${nm} posts in ${nc}</span></span>
      <span class="tg on" title="Whole pull request">${ic("pr", "s")}</span><span class="tg" title="Only conversations with new replies"><i class="ud"></i>${PRNEW}</span><span class="tg" title="Only open conversations">${ic("unres", "s")}${PROPEN}</span><span class="tg" title="Highlight a label">${ic("tag", "s")}</span><span class="sp"></span>${ib("close", "Close ⎋")}</div>
    <div class="sbody"><div class="scols"><div class="scol">${col1}</div><div class="scol">${col2}</div></div>${pre}</div>
    <div class="sfoot"><span><span class="kbd">↑↓</span><span class="kbd">←→</span>move</span><span><span class="kbd">↩</span>open at its line</span><span><span class="kbd">⎋</span>back to the code</span></div></div>`;
}
/* margin notes are placed after layout, at their line's height */
function placeMargin() {
  const m = document.getElementById("margin");
  if (!m) return;
  const mr = m.getBoundingClientRect();
  const lines = [...document.querySelectorAll(".ln[data-n]")];
  const vis = {};
  for (const el of lines) vis[+el.dataset.n] = el.getBoundingClientRect();
  let h = "";
  const shown = Object.keys(vis).map(Number);
  const above = HERECONVS.filter((c) => !vis[c.line] && c.line < Math.min(...shown));
  const below = HERECONVS.filter((c) => !vis[c.line] && c.line > Math.max(...shown));
  const chip = (cs, dir) => `${ic(dir, "xs")}${cs.map((c) => (c.posts[0].l ? mark(c.posts[0].l, c.posts[0].blk, "sm") : "")).join("")}<span>${cs.length}</span>${cs.some((c) => unread(c) && !c.draft) ? '<i class="dot" style="width:6px;height:6px"></i>' : ""}`;
  if (above.length) h += `<div class="edgec" style="top:10px" title="${above.map((c) => "line " + c.line).join(", ")}">${chip(above, "up")}</div>`;
  if (below.length) h += `<div class="edgec" style="bottom:12px" title="${below.map((c) => "line " + c.line).join(", ")}">${chip(below, "down")}</div>`;
  let lastBottom = 46;
  for (const c of HERECONVS) {
    const r = vis[c.line];
    if (!r) continue;
    const y = Math.max(lastBottom, r.top - mr.top - 8);
    const open = c.k === PICK.k && FR !== "d2";
    const hov = FR === "d2" && c.k === "l656";
    const p0 = c.posts[0], u = unread(c);
    const textEnd = (() => { const t = document.querySelector(`.ln[data-n="${c.line}"] .t`); const range = document.createRange(); range.selectNodeContents(t); const rr = range.getBoundingClientRect(); return rr.right; })();
    h += `<i class="lead ${open ? "open" : ""}" style="top:${r.top - mr.top + 10}px;left:${textEnd - mr.left + 8}px;width:${Math.max(0, 14 - (textEnd - mr.left + 8))}px"></i>`;
    h += `<div class="mnote ${open ? "open" : ""} ${hov ? "hov" : ""}" style="top:${y}px" title="${esc(p0.b.replace(/`/g, ""))}">${p0.l ? mark(p0.l, p0.blk) : avatar(p0.a)}<span class="tx1">${bodyHtml(p0.b).replace(/<\/?code>/g, "")}</span><span class="mr"><span class="stack">${people(c.posts).slice(0, 4).map((a) => avatar(a, "sm")).join("")}</span><span style="display:flex;gap:4px;align-items:center">${c.draft ? `<span class="lock">${ic("lock", "xs")}</span>` : u ? `<span class="cnt">${u}</span>` : ""}<span class="cnt q">${c.posts.length}</span>${open ? `<span style="color:var(--route);display:inline-flex" title="Open below its line">${ic("chevd", "s")}</span>` : ""}</span></span></div>`;
    lastBottom = y + 62;
    if (hov) {
      h += `<div class="peek" style="position:absolute;left:14px;right:14px;width:auto;top:${y + 60}px"><div class="ph2">${base(c.path)}:${c.line}<span class="sp"></span><span class="kbd">↩</span> opens under the line</div>${c.posts.map((p) => post(p, {pl:22})).join("")}</div>`;
    }
  }
  m.innerHTML = h;
}

/* ================= draw ================= */
const app = document.getElementById("app");
app.innerHTML = CON === "A" ? conceptA() : CON === "B" ? conceptB() : conceptC();
placeMargin();
/* scroll the long thread lists so the picked conversation is in view */
for (const ms of document.querySelectorAll(".mscroll, .scol")) {
  const s = ms.querySelector(".cv.sel");
  if (s && s.offsetTop + s.offsetHeight > ms.clientHeight - 20) ms.scrollTop = s.offsetTop - 120;
}
/* A d1: place the hovered node's preview beside it */
const hp = document.getElementById("hovpeek");
if (hp) {
  const n = document.querySelector(".nd.hov");
  const r = n.getBoundingClientRect();
  hp.style.left = (r.right + 14) + "px"; hp.style.top = (r.top - 30) + "px";
}
/* B d2: the quote bar sits above the selected lines */
const qb = document.getElementById("qbar");
if (qb) {
  const s = document.querySelector('.ln.sel');
  const lr = qb.parentElement.getBoundingClientRect(), r = s.getBoundingClientRect();
  qb.style.left = "120px"; qb.style.top = (r.top - lr.top - 36) + "px";
}
</script>
