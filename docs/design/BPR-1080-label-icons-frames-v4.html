<title>BPR-1080 label icons, candidates v4</title>
<!--
  [[BPR-1080]] Twelve label icon candidates (RFC-BPR-0050 R30, R31), drawn into BPR-1079's
  accepted marks: the 16 px tinted square, soft fill normally and filled with the tint when
  blocking, centred under the avatar with the label rail (round v4, accepted in session
  3a17a6eb). The icons replace the two-letter placeholders. Nothing here is implemented and no
  candidate is approved until the owner selects it (R30).

  Round v4 (2026-10-05) follows the owner's v3 verdicts in session bfc59159: chore's v3 broom was
  accepted; typo was rejected ("I think you can do a little better, that b looks far from the A and
  that c looks cut off"). v4 redraws typo only and keeps the other eleven exactly as in v3. The
  owner's reference is BPR-1080-owner-ref-typo-abc.png beside this file. It sets the style asked
  for; the v4 coordinates are written by hand, not traced from it. Round v3 stays in
  BPR-1080-label-icons-frames-v3.html.

  Glyph source: GLYPHS below, authored for this card on the app's stroked-glyph grid (24 units,
  round caps and joins, as workbench_strip.cpp and review_cycle_share_marks.cpp draw). Path data
  uses only M, L, C and Z plus filled discs, so each maps one-to-one onto QPainterPath moveTo,
  lineTo, cubicTo, closeSubpath and addEllipse. A glyph is drawn in a 12 px box (unit 0.5 px)
  with a 2.6-unit pen: 1.3 px at 1x, 2.6 px at 2x. Four element kinds: a string is stroked with
  that pen; {d, w} is stroked with a w-unit pen (typo's letters); {fill} is a filled path
  (QPainter::fillPath, no pen); {dot:[x, y, r]} is a filled disc. A filled path with a hole (typo's
  A and b) winds the hole opposite to its outline, so the nonzero rule here and QPainterPath's default
  odd-even rule fill it the same way.

  Query parameters:
    f      the frame id (see FRAMES below); no f draws the index of frames
    theme  light (default) | dark
    pick   override the default option per label (v4 has one option per label)
    only   with f=ic-changes: draw one changed label's row, e.g. only=chore
    check  1: write #check: glyph separation (pairwise, at 12 and 24 px), glyph contrast on
           the soft and the filled mark in all four theme variants, mark centring and names
-->

    { who:"aleks", av:"A", when:"today", l:"quibble", text:"I'd keep pragma once here." } ] },

// edit: null, "reply" (my reply in the issue thread) or "root" (my own blocking thread's root)
function threads(o) {

  return `<div class="win">${titleRow("Read", narrow)}${reviewBar(narrow)}<div class="body">${code}<div class="tray" style="--trayw:${trayW}px">

    <div class="tr-tools"><span class="seg"><span class="on">This file</span><span>Whole PR</span></span><span class="chip">Unresolved ▾</span><span class="sp"></span><span class="ib box" title="Label key">${icon.key}</span></div>
    <div class="cards">${cards}</div></div></div></div>`;
}
// ---- BPR-1080 frames ------------------------------------------------------------------------
// A mark at a theme variant: n = normal, b = blocking.
const markV = (l, vi, blk, opt) => { const t = TINTS[l][vi], w = `${l}${blk ? " (blocking)" : ""}`;
  return `<span class="lm ${blk ? "blk" : ""}" role="img" data-label="${l}" data-variant="${vi}" style="--t:${t}${blk ? `;--on-t:${onTint(t)}` : ""}" title="${w}" aria-label="${w}">${glyphSvg(Array.isArray(opt) ? opt : glyphKey(l, opt))}</span>`; };
// Every label at actual size, normal over blocking, in the four theme variants; then 2.5x, greyscale and the grid.
function sheet() {
  const row = (vi, extra = "") => `<div class="lrow ${extra}">${LABELS.map((l) => `<div class="cl">${markV(l, vi, false)}${markV(l, vi, true)}<span class="nmx">${l}</span></div>`).join("")}</div>`;
  const pans = VARIANTS.map(([name, cls, vi]) => `<div class="vpan ${cls}"><div class="vh">${name}</div>${row(vi)}</div>`).join("");
  const big = `<div class="vgrid"><div class="vpan big"><div class="vh">2.5×, light</div>${row(0)}</div><div class="vpan dk big"><div class="vh">2.5×, dark</div>${row(1)}</div></div>`;
  const grey = `<div class="vgrid"><div class="vpan grey"><div class="vh">Greyscale, light</div>${row(0)}</div><div class="vpan dk grey"><div class="vh">Greyscale, dark</div>${row(1)}</div></div>`;
  const cons = `<div class="vpan"><div class="vh">24-unit grid, 2.6-unit pen (typo squiggle 2.0, chore handle 2.2)</div><div class="cons">${LABELS.map((l) => `<div class="cc">${glyphSvg(glyphKey(l), "c")}${l}</div>`).join("")}</div></div>`;
  return `<div class="sheet"><div class="vgrid">${pans}</div>${big}${grey}${cons}</div>`;
}
// Round v4's changed label: v3 beside v4, each as marks in the four theme variants (normal over
// blocking), at 2.5x, and on the grid; with the owner's reference image where one was attached.
function changes(only) {
  const ls = only && CHANGED[only] ? [only] : Object.keys(CHANGED);
  const strip = (l, g) => `${VARIANTS.map(([, cls, vi]) => `<span class="sm4 ${cls}" style="background:var(--panel)">${markV(l, vi, false, g)}${markV(l, vi, true, g)}</span>`).join("")}
      <span class="sm4 big">${markV(l, 0, false, g)}${markV(l, 0, true, g)}</span><span class="sm4"><span class="lm-c">${glyphSvg(g, "c")}</span></span>`;
  const rows = ls.map((l) => {
    const c = CHANGED[l], ref = `<img class="ref" src="${c.ref}" alt="Owner reference: ${c.refName}"><span class="rn">Owner reference<br>${c.refName}</span>`;
    return `<div class="ol">${l}</div>
      <div class="oc old"><span class="on">${PREV_ROUND}</span>${strip(l, PREV[l])}</div>
      <div class="oc"><span class="on">${ROUND}</span>${strip(l, GLYPHS[glyphKey(l)])}</div>
      <div class="oc rf">${ref}</div>`;

}
// The same marks where else they appear: Overview chips, the label menu, completion and the Label key.
function surfaces() {
  const chip = (l, n, o) => `<span class="lchip">${lm(l)}<b style="${o ? "color:var(--marker)" : ""}">${n}</b></span>`;
  const rows = [["HairStrandsLighting.cpp", [["issue", 2, 1], ["question", 1, 1], ["suggestion", 1, 1]], 4],
    ["HairStrandsRendering.h", [["nitpick", 3, 1], ["typo", 1, 1], ["polish", 2, 1]], 1],
    ["HairStrandsVisibility.cpp", [["thought", 1, 1], ["praise", 2, 1], ["todo", 1, 1], ["quibble", 1, 1]], 0],
    ["HairStrandsInterface.cpp", [["chore", 1, 1], ["note", 2, 1]], 2]];
  const ov = `<table class="otab"><thead><tr><th>File</th><th style="width:250px">Comments</th></tr></thead><tbody>${rows.map(([f, cs, other]) =>
    `<tr><td>${f}</td><td>${cs.map(([l, n, o]) => chip(l, n, o)).join("")}${other ? `<span class="lchip">${icon.other}<b>${other}</b></span>` : ""}</td></tr>`).join("")}</tbody></table>`;
  const menu = `<div class="mgrid">${LABELS.map((l) => `<div class="mi ${l === "issue" ? "sel" : ""}">${lm(l)}${l}</div>`).join("")}</div>`;
  const comp = `<div class="comp"><div style="color:var(--ink-3);font:11px var(--mono);padding:2px 6px 4px">:q</div>${["question", "quibble"].map((l, i) => `<div class="kr ${i ? "" : "sel"}">${lm(l)}<code>${CODE[l]}</code><b>${l}</b><span style="color:var(--ink-3)">${DESC[l]}</span></div>`).join("")}</div>`;
  const key = `<div class="klist">${LABELS.map((l) => `<div class="kr">${lm(l)}<b>${l}</b><code>${CODE[l]}</code><span class="d">${DESC[l]}</span></div>`).join("")}</div>`;
  return `<div class="surf"><div><h2>Overview, Comments column</h2><div class="box">${ov}</div>
    <h2 style="margin-top:14px">Label menu (⌘L)</h2><div class="box">${menu}</div>
    <h2 style="margin-top:14px">Completion after ":q"</h2><div class="box">${comp}</div></div>
    <div><h2>Label key (⌥K)</h2><div class="box">${key}</div></div></div>`;
}

// ---- after render: place the tooltip, measure ---------------------------------------------
const r3 = (x) => Math.round(x * 1000) / 1000;
// Glyph separation: each glyph is rasterised alone at 12 and 24 px with the shipping pen, and
// every pair is compared as ink masks (1 - intersection / union; 0 = identical, 1 = disjoint).
// Contrast: the glyph against its soft fill (normal) and against its tint (blocking) in the four
// theme variants, with the soft fill mixed exactly as the CSS does.
function rasterise(key, px) {
  const els = Array.isArray(key) ? key : GLYPHS[key];
  const c = document.createElement("canvas"); c.width = c.height = px;
  const g = c.getContext("2d"), u = px / 24;
  g.scale(u, u); g.lineWidth = 2.6; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = g.fillStyle = "#000";
  for (const x of els) {
    if (typeof x === "string") g.stroke(new Path2D(x));
    else if (x.fill) g.fill(new Path2D(x.fill));
    else if (x.d) { g.lineWidth = x.w; g.stroke(new Path2D(x.d)); g.lineWidth = 2.6; }
    else { g.beginPath(); g.arc(x.dot[0], x.dot[1], x.dot[2], 0, Math.PI * 2); g.fill(); }
  }
  const d = g.getImageData(0, 0, px, px).data, m = new Uint8Array(px * px);
  for (let i = 0; i < m.length; ++i) m[i] = d[i * 4 + 3] >= 128 ? 1 : 0;
  return m;
}
function separation(a, b) { let i = 0, u = 0; for (let k = 0; k < a.length; ++k) { i += a[k] & b[k]; u += a[k] | b[k]; } return u ? 1 - i / u : 0; }
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (t, p, w) => "#" + hex(t).map((c, i) => Math.round(c * w + hex(p)[i] * (1 - w)).toString(16).padStart(2, "0")).join("");
const VAR_PANEL = ["#FFFFFF", "#242930", "#FFFFFF", "#000000"], VAR_INK = ["#1F2328", "#E6EDF3", "#000000", "#FFFFFF"], VAR_MIX = [0.22, 0.30, 0.22, 0.30];
function glyphChecks() {
  const keys = LABELS.map((l) => glyphKey(l)), out = { glyphs:keys.length, distinctKeys:new Set(keys).size, labelsWithOptions:LABELS.filter((l) => Object.keys(OPTIONS[l]).length > 1) };
  for (const px of [12, 24]) {
    const ms = Object.fromEntries(keys.map((k) => [k, rasterise(k, px)]));
    // Every pair of the twelve; and each redrawn glyph against its own previous-round glyph.
    let min = { d:2 };
    for (let i = 0; i < keys.length; ++i) for (let j = i + 1; j < keys.length; ++j) {
      if (keys[i].split(".")[0] === keys[j].split(".")[0]) continue;
      const d = separation(ms[keys[i]], ms[keys[j]]);
      if (d < min.d) min = { d, a:keys[i], b:keys[j] };
    }
    const r = (a, b) => Math.round(separation(ms[a], ms[b]) * 1000) / 1000;
    out[`px${px}`] = { minAcrossLabels:{ ...min, d:Math.round(min.d * 1000) / 1000 },
      suggestionPolish:r("suggestion.bulb", "polish.sparkles"), nitpickQuibble:r("nitpick.loupe", "quibble.wobble"),
      typoQuibble:r("typo.abc", "quibble.wobble"), nitpickNote:r("nitpick.loupe", "note.info"), choreTodo:r("chore.broom", "todo.checkbox"),
      prevToNow:Object.fromEntries(Object.keys(CHANGED).map((l) => [l, Math.round(separation(rasterise(PREV[l], px), ms[glyphKey(l)]) * 1000) / 1000])),
      nearest:Object.fromEntries(Object.keys(CHANGED).map((l) => { let b = { d:2 }; for (const k of keys) if (k !== glyphKey(l)) { const d = separation(ms[glyphKey(l)], ms[k]); if (d < b.d) b = { d:Math.round(d * 1000) / 1000, k }; } return [l, b]; })),
      inkPixels:Object.fromEntries(keys.map((k) => [k, ms[k].reduce((a, b) => a + b, 0)])) };
  }
  let minNormal = { r:99 }, minBlocking = { r:99 };
  for (const l of LABELS) for (let v = 0; v < 4; ++v) {
    const t = TINTS[l][v], soft = mix(t, VAR_PANEL[v], VAR_MIX[v]);
    const rn = ratio(VAR_INK[v], soft), rb = ratio(onTint(t), t);
    if (rn < minNormal.r) minNormal = { r:Math.round(rn * 100) / 100, label:l, variant:VARIANTS[v][0] };
    if (rb < minBlocking.r) minBlocking = { r:Math.round(rb * 100) / 100, label:l, variant:VARIANTS[v][0] };
  }
  out.glyphContrast = { normal:minNormal, blocking:minBlocking };
  out.markNames = [...document.querySelectorAll(".lm[role=img]")].every((m) => (m.getAttribute("aria-label") || "").length > 0 && m.getAttribute("aria-label") === m.getAttribute("title"));
  return out;
}
function afterRender() {
  for (const el of document.querySelectorAll("[data-anchor]")) {
    const a = document.getElementById(el.dataset.anchor);
    if (!a) continue;
    const r = a.getBoundingClientRect();
    const host = el.offsetParent ? el.offsetParent.getBoundingClientRect() : { left:0, top:0 };
    const side = el.dataset.side === "right";
    el.style.left = `${(side ? r.right : r.left) - host.left + Number(el.dataset.dx || 0)}px`;
    el.style.top = `${(side ? r.top : r.bottom) - host.top + Number(el.dataset.dy || 0)}px`;
  }
  if (q.get("check") !== "1") return;
  // Centring: mark centre x minus avatar centre x, and the gap under the avatar.
  // Rail: its right edge to the avatar, its width, and whether it stays inside its card.
  const rows = [];
  for (const po of document.querySelectorAll(".post.v4")) {
    const a = po.querySelector(".av").getBoundingClientRect(), m = po.querySelector(".lm");
    const rail = getComputedStyle(po, "::before"), pr = po.getBoundingClientRect();
    const railRight = pr.left - 3, railW = parseFloat(rail.width), railLeft = railRight - railW;
    const cardEl = po.closest(".card"), cr = cardEl ? cardEl.getBoundingClientRect() : null;
    const row = { root:!po.classList.contains("reply"), deco:po.dataset.deco, label:po.dataset.label, railW, railToAvatar:r3(a.left - railRight),
      railInside:cr ? railLeft >= cr.left + 1 : true, name:po.getAttribute("aria-label"), rect:[a.left, a.top, a.width, a.height].map(r3) };
    if (m) { const r = m.getBoundingClientRect(); Object.assign(row, { dx:r3((r.left + r.width / 2) - (a.left + a.width / 2)), dy:r3(r.top - a.bottom), mw:r.width, aw:a.width,
      mark:[r.left, r.top, r.width, r.height].map(r3), markName:m.getAttribute("aria-label"), role:m.getAttribute("role"), filled:m.classList.contains("blk") }); }

  }
  const marked = rows.filter((x) => "dx" in x);
  const blkOk = rows.every((x) => (x.deco === "blocking") === (x.railW === 4) && (!x.label || (x.deco === "blocking") === x.filled));
  const nameOk = marked.every((x) => x.role === "img" && x.markName === `${x.label}${x.deco ? ` (${x.deco})` : ""}` && x.name.endsWith(x.markName));
  // Contrast of the blocking glyph on its tint, in all four theme variants.

  const out = { posts:rows.length, marks:marked.length, blocking:rows.filter((x) => x.deco === "blocking").length,
    dx:[...new Set(marked.map((x) => x.dx))], dy:[...new Set(marked.map((x) => x.dy))], markW:[...new Set(marked.map((x) => x.mw))], avatarW:[...new Set(marked.map((x) => x.aw))],
    railToAvatar:[...new Set(rows.map((x) => x.railToAvatar))], railW:[...new Set(rows.map((x) => x.railW))], railInsideCard:rows.every((x) => x.railInside),
    blockingTreatmentMatches:blkOk, accessibleNamesMatch:nameOk, minBlockingGlyphContrast:r3(minGlyph), headerMarks:document.querySelectorAll(".card-h .lm").length };
  Object.assign(out, glyphChecks());
  out.boxes = marked.slice(0, 4).map((x) => ({ avatar:x.rect, mark:x.mark, deco:x.deco }));
  const pre = document.createElement("pre");
  pre.id = "check";
  pre.textContent = JSON.stringify(out);
  document.body.append(pre);
}

// ---- the frames ---------------------------------------------------------------------------
const FRAMES = {
  "ic-sheet": { size:[1440, 820], fn:() => sheet() },
  "ic-changes": { size:[1440, 520], fn:() => changes(q.get("only")) },
  "ic-surfaces": { size:[1100, 480], fn:() => surfaces() },
  "th-wide": { size:[1440, 820], fn:() => threads({}) },
  "th-wide-more": { size:[1440, 820], fn:() => threads({ more:true }) },
  "th-narrow": { size:[960, 760], fn:() => threads({ narrow:true }) },
  "th-wide-edit": { size:[1440, 820], fn:() => threads({ edit:"reply" }) },
  "th-narrow-edit": { size:[960, 760], fn:() => threads({ narrow:true, edit:"root" }) },

window.BPR1080_FRAMES = Object.fromEntries(Object.entries(FRAMES).map(([k, v]) => [k, v.size]));

const f = q.get("f");
if (f && FRAMES[f]) {

  afterRender();
} else {
  document.body.classList.add("index");
  document.body.innerHTML = `<h3 style="margin:0 0 10px">BPR-1080 label icon frames v4: open one at its own size</h3><div class="idx">${Object.entries(FRAMES).map(([k, v]) => `<a href="?f=${k}">${k}</a><span style="color:var(--ink-3)">${v.size.join("×")}</span>`).join("")}</div>`;
}
