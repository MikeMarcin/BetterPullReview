<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BPR-1784: the tour's three steps</title>
<link rel="stylesheet" href="../BPR-1574-drawers-and-agent-v1/kit.css">
<style>
/* BPR-1784 design round v1: the Tour tab as the agent setup's numbered steps
   (BPR-1747), on BPR-1574's kit tokens. Step circles are neutral, blue while
   open and green once done; amber stays the stops' own. */
body { padding:0; }
.drawer { width:380px; height:720px; background:var(--drawer); border-left:1px solid var(--rule); display:flex; flex-direction:column; overflow:hidden; }
.tabs { display:flex; gap:14px; padding:9px 12px 0; border-bottom:1px solid var(--rule); font-weight:600; color:var(--ink-3); }
.tabs span { padding-bottom:8px; } .tabs span.on { color:var(--ink); box-shadow:inset 0 -2px 0 var(--signal); }
.body { flex:1; min-height:0; padding:12px 12px 0; display:flex; flex-direction:column; }
.steps { display:flex; flex-direction:column; }
.step { position:relative; padding:0 0 12px 34px; }
.step::before { content:""; position:absolute; left:11px; top:26px; bottom:4px; width:1.5px; background:var(--rule); }
.step:last-child::before { display:none; }
.sh { display:flex; align-items:center; gap:10px; margin-left:-34px; min-height:24px; }
.sh b { font-weight:650; font-size:13px; }
.step.later .sh b { color:var(--ink-3); }
.sum { flex:1; min-width:0; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chg { color:var(--signal); font-weight:600; }
.sg { flex:none; width:24px; height:24px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font:700 11px/1 var(--ui); }
.sg.now { background:var(--signal); color:var(--on-signal); }
.sg.later { box-shadow:inset 0 0 0 1.2px var(--rule-2); color:var(--ink-3); }
.sg.ok { background:var(--ok); color:#fff; }
.sg.att { box-shadow:inset 0 0 0 1.5px var(--danger); color:var(--danger); }
.sb { margin-top:6px; display:flex; flex-direction:column; gap:8px; }
.field { min-height:96px; padding:7px 9px; border-radius:6px; background:var(--panel); box-shadow:inset 0 0 0 1px var(--rule-2); color:var(--ink); line-height:1.45; }
.field.empty { color:var(--ink-3); }
.field.focus { box-shadow:inset 0 0 0 2px var(--signal); }
.row { display:flex; gap:6px; align-items:center; }
.sp { flex:1; }
.chip { padding:3px 9px; border-radius:6px; background:var(--panel); box-shadow:inset 0 0 0 1px var(--rule-2), 0 1px 1px rgba(0,0,0,.05); font-weight:500; }
.next { padding:3px 12px; border-radius:6px; background:var(--signal); color:var(--on-signal); font-weight:600; }
.next kbd { font:inherit; opacity:.7; margin-left:6px; }
.route { position:relative; padding-left:0; }
.stop { position:relative; display:flex; gap:10px; padding:6px 0 8px; }
.stop::before { content:""; position:absolute; left:10px; top:28px; bottom:-6px; width:2px; background:var(--route-line); }
.stop:last-child::before { display:none; }
.ring { flex:none; width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font:700 10.5px/1 var(--ui); color:var(--route); box-shadow:inset 0 0 0 2px var(--route); background:var(--panel); position:relative; z-index:1; }
.ring.ready { background:var(--route); color:#fff; }
body.dark .ring.ready { color:#1A1E24; }
.st b { display:block; font-weight:600; }
.st code { font:11px var(--mono); color:var(--ink-2); background:var(--panel-2); padding:0 4px; border-radius:3px; }
.st .t { color:var(--ink-3); }
.foot { margin-top:auto; display:flex; align-items:center; gap:8px; padding:8px 0 10px; border-top:1px solid var(--rule); }
.foot .s { flex:1; color:var(--ink-3); }
.pub { padding:3px 12px; border-radius:6px; font-weight:600; background:var(--panel); box-shadow:inset 0 0 0 1px var(--rule-2); color:var(--ink-3); }
.pub.go { background:var(--signal); color:var(--on-signal); box-shadow:none; }
.label { font:600 13px var(--ui); margin:14px 0 6px; }
.grid { display:flex; flex-wrap:wrap; gap:20px; padding:16px; }
</style></head>
<body>
<script>
"use strict";
const params = new URLSearchParams(location.search);
if (params.get("theme") === "dark") document.body.classList.add("dark");
const step = (n, name, state, sum, body) => `
  <div class="step ${state === "later" ? "later" : ""}">
    <div class="sh"><span class="sg ${state}">${state === "ok" ? "&#10003;" : state === "att" ? "!" : n}</span><b>${name}</b>
      ${sum ? `<span class="sum">${sum}</span><span class="chg">Change</span>` : `<span class="sp"></span>`}</div>
    ${body ? `<div class="sb">${body}</div>` : ""}
  </div>`;
const prose = (text, focus, next) => `
  <div class="field ${text ? "" : "empty"} ${focus ? "focus" : ""}">${text || "What problem does this change solve?"}</div>
  <div class="row"><span class="chip">Enhance text</span><span class="chip">Use selected description text</span><span class="sp"></span>
  <span class="next">${next}<kbd>&#8997;&#8617;</kbd></span></div>`;
const stops = (list) => `<div class="route">${list.map(([n, t, src, ready]) => `
  <div class="stop"><span class="ring ${ready ? "ready" : ""}">${n}</span><div class="st"><b>${t || '<span class="t">Untitled stop</span>'}</b><code>${src}</code></div></div>`).join("")}</div>
  <div class="row"><span class="chip">Add stop</span><span class="chip">Suggest an outline</span></div>`;
const frames = {
  empty: [step(1, "Problem", "now", "", prose("", true, "Next")), step(2, "Solution", "later"), step(3, "Stops", "later")],
  problem: [step(1, "Problem", "ok", "Readers need the context before the details."),
            step(2, "Solution", "now", "", prose("", true, "Next").replace("What problem does this change solve?", "How does this change solve the problem?")), step(3, "Stops", "later")],
  stops: [step(1, "Problem", "ok", "Readers need the context before the details."), step(2, "Solution", "ok", "Explain the boundary first, then follow the source."),
          step(3, "Stops", "now", "", stops([[1, "Why this boundary matters", "review.cpp 3–5", true], [2, "", "review.cpp 12–14", false]]))],
  ready: [step(1, "Problem", "ok", "Readers need the context before the details."), step(2, "Solution", "ok", "Explain the boundary first, then follow the source."),
          step(3, "Stops", "now", "", stops([[1, "Why this boundary matters", "review.cpp 3–5", true], [2, "Zero width is a real state", "review.cpp 12–14", true]]))],
  attention: [step(1, "Problem", "att", ""), step(2, "Solution", "ok", "Explain the boundary first, then follow the source."),
          step(3, "Stops", "now", "", stops([[1, "Why this boundary matters", "review.cpp 3–5", true]]))],
};
const which = params.get("frame") || "empty";
const ready = which === "ready";
document.body.innerHTML = `<div class="drawer"><div class="tabs"><span>Threads</span><span>Files</span><span class="on">Tour</span></div>
  <div class="body"><div class="steps">${frames[which].join("")}</div>
  <div class="foot"><span class="s">${ready ? "Saved locally. Nothing published." : "Private draft. Nothing published."}</span><span class="pub ${ready ? "go" : ""}">Preview and publish</span></div></div></div>`;
</script>
</body></html>
