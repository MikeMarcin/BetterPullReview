<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BPR-1588 · The promote label</title>
<link rel="stylesheet" href="kit.css"><script src="kit.js"></script>
<style>
.labelboard { width:1440px; height:900px; background:var(--bg); padding:40px 48px; display:grid; grid-template-columns:repeat(3, 1fr); gap:28px; align-content:start; }
.labelboard h2 { grid-column:1 / -1; margin:0 0 4px; font-size:20px; font-weight:650; }
.labelboard .lede2 { grid-column:1 / -1; margin:0 0 10px; color:var(--ink-2); font-size:14px; max-width:84ch; line-height:1.55; }
.opt { background:var(--drawer); border-radius:12px; box-shadow:0 0 0 1px var(--rule); padding:18px 14px 22px; position:relative; }
.opt .name { font-weight:650; font-size:15px; margin:0 6px 12px; display:flex; gap:8px; align-items:center; }
.opt .name .letter { display:inline-flex; width:24px; height:24px; border-radius:7px; align-items:center; justify-content:center; background:var(--panel); box-shadow:inset 0 0 0 1px var(--rule-2); font-size:12px; }
.opt .note { color:var(--ink-2); font-size:12.5px; margin:14px 6px 0; line-height:1.5; }
.opt .mini { position:relative; height:210px; }
</style></head>
<body><script>
"use strict";
const note = (label) => `<div class="card open privo" style="top:6px;left:6px;right:6px">
  <div class="ch"><span class="where">${ic("lock", "xs")} 433</span><span class="state">Private note</span><span class="sp"></span>${tool("max")}${tool("close")}</div>
  <div style="padding:10px 10px 12px 12px">
    <div style="font-size:13px;line-height:1.5">Is <code class="c">device_scale()</code> cheap enough to call per pass? Ask whether to cache the factor per frame.</div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:12px"><span class="lockline">${ic("lock", "xs")}Only you</span><span class="sp"></span>
      <span class="pill outline sm">${ic("promote", "xs")}${label}</span><span class="ib">${ic("more", "s")}</span></div></div></div>`;
const board = `<div class="labelboard">
  <h2>What should the action that turns a note into a draft comment say?</h2>
  <p class="lede2">It copies the note's text to a local draft at the same line; the note stays and nothing is published until the draft's own button. The same label will turn an agent's finding into a draft. "Post as comment" and "Share" are left out because the action posts and shares nothing.</p>
  <div class="opt"><div class="name"><span class="letter">A</span>To comment</div><div class="mini">${note("To comment")}</div><div class="note">Shortest; reads as "Promote to comment" with the verb understood.</div></div>
  <div class="opt"><div class="name"><span class="letter">B</span>Draft comment</div><div class="mini">${note("Draft comment")}</div><div class="note">Says the result exactly: a draft comment, not yet published.</div></div>
  <div class="opt"><div class="name"><span class="letter">C</span>Use as draft</div><div class="mini">${note("Use as draft")}</div><div class="note">Says the note's text becomes the draft; keeps "comment" out of a private surface.</div></div>
</div>`;
page({ nav: "Principles", title: "The promote label", lede: "For BPR-1588's review.", directions: [{ id: "promote-label", letter: "?", name: "Three short labels", frame: board, idea: "", pros: [], cons: [] }] });
</script></body></html>
