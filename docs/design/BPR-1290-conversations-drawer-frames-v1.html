<!doctype html>
<html lang="en">
<head>

<title>BPR-1290 Conversations drawer frames v1</title>
<!--
  [[BPR-1290]] Conversations drawer, round v1. The owner, 2026-10-06: "I don't understand the
  conversations drawer at all.. the useful part is this tiny little section at the bottom i can
  barely see and the rest I dont get." Three candidates, one per way of choosing a thread:
    A  Switcher   one row of thread chips above the conversation
    B  Stack      threads as one-line rows; the open one expands in place to full height
    C  Line rail  a thin strip whose ticks sit at the threads' lines; the conversation beside it
  Shared by all three: the conversation fills the drawer; every post has the 18 px avatar, the
  16 px mark 3 px under it and the rail 3 px left of it (BPR-1083 v4, blocking = filled mark and
  4 px rail); a reply that answers something other than the post above it says whom; branches
  fold; the reply field sits at the foot of the conversation. The map and the path caption are gone.

  Content: tests/fixtures/github/contracts/v1/conventional-comments-v1 (renderer.cpp threads, the
  viewer fixture-author, the whole PR's six threads) and
  tests/fixtures/github/conversations/branching-thread-v1 (the deep frames). The draft's body is
  illustrative: the owner's screenshot shows the draft card but not its text. Unread counts are
  the screenshot's. Icons: BPR-1080's selected glyphs, copied from BPR-1080-label-icons-selected.html.

  Query parameters:  f = frame id (none draws the index)   theme = light (default) | dark
  Static design frames, not the product. Nothing here is implemented.
-->
<style>
:root {
  --bg:#F6F7F9; --side:#F0F2F5; --panel:#FFFFFF; --panel-2:#EEF1F5; --rule:#D9DEE5; --rule-2:#C3CAD3;
  --ink:#1F2328; --ink-2:#57606A; --ink-3:#6B7480; --signal:#2F6FD6; --signal-soft:#DCE8F9; --on-signal:#FFFFFF;
  --open:#D29922; --ok:#1A7F37; --new:#2F6FD6; --hover:#F3F5F8;
  --code:#FFFFFF; --gutter:#F0F2F5; --lnum:#5B6570; --add:#E6FFEC; --add-g:#CCFFD8; --del:#FFEBE9;
  --field:#FFFFFF; --shadow:0 10px 28px rgba(31,35,40,.18); --tip:#1F2328; --tip-ink:#F6F7F9;
  --kw:#B51D27; --fn:#6639BA; --ty:#6E3EC8;
  --ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --mono:"JetBrains Mono NL", "JetBrains Mono", "SF Mono", Menlo, monospace;
}
body.dark {
  --bg:#1C2026; --side:#20252C; --panel:#242930; --panel-2:#2E343D; --rule:#343A44; --rule-2:#454D59;
  --ink:#E6EDF3; --ink-2:#A0A8B2; --ink-3:#8B949E; --signal:#7FB0E8; --signal-soft:#26374F; --on-signal:#0D1117;
  --open:#E0B15A; --ok:#3FB950; --new:#7FB0E8; --hover:#2A3038;
  --code:#0D1117; --gutter:#141921; --lnum:#8B949E; --add:#12301D; --add-g:#1A4A2A; --del:#3E1F1F;
  --field:#1A1F26; --shadow:0 12px 32px rgba(0,0,0,.55); --tip:#E6EDF3; --tip-ink:#1C2026;
  --kw:#6DA9DB; --fn:#FF8000; --ty:#FFD700;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; overflow:hidden; }
body { background:var(--bg); color:var(--ink); font:12px/1.4 var(--ui); -webkit-font-smoothing:antialiased; }
body.index { overflow:auto; padding:20px; }
svg.i { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none; display:block; }
svg.i.s { width:13px; height:13px; }
.sp { flex:1; }

/* window chrome, simplified from the owner's screenshot */
.win { width:100vw; height:100vh; display:flex; flex-direction:column; }
.title { flex:0 0 32px; display:flex; align-items:center; gap:8px; padding:0 10px 0 0; background:var(--panel); border-bottom:1px solid var(--rule-2); }
.lights { display:flex; gap:8px; padding-left:12px; width:84px; flex:none; }
.lights i { width:12px; height:12px; border-radius:50%; background:#FF5F57; display:block; }
.lights i:nth-child(2) { background:#FEBC2E; } .lights i:nth-child(3) { background:#28C840; }
.seg { display:inline-flex; border:1px solid var(--rule-2); border-radius:6px; overflow:hidden; }
.seg > span { display:inline-flex; align-items:center; gap:5px; padding:0 10px; height:21px; color:var(--ink-2); border-right:1px solid var(--rule-2); white-space:nowrap; }
.seg > span:last-child { border-right:0; }
.seg > span.on { background:var(--signal-soft); color:var(--ink); font-weight:600; }
.seg kbd { font:11px var(--ui); color:var(--ink-3); }
.tb { display:inline-flex; align-items:center; justify-content:center; gap:5px; height:22px; min-width:24px; padding:0 4px; border-radius:5px; color:var(--ink-2); white-space:nowrap; }
.tb.on { background:var(--signal-soft); color:var(--ink); }
.bar { flex:0 0 30px; display:flex; align-items:center; gap:10px; padding:0 10px; background:var(--panel); border-bottom:1px solid var(--rule); white-space:nowrap; color:var(--ink-2); }
.bar b { color:var(--ink); font-weight:600; }
.status { flex:0 0 24px; display:flex; align-items:center; padding:0 12px; background:var(--panel); border-top:1px solid var(--rule); color:var(--ink-2); font-size:11.5px; }
.main { flex:1; display:flex; min-height:0; }

/* code */
.cmp { flex:1; display:flex; flex-direction:column; min-width:0; background:var(--code); }
.fh { flex:0 0 24px; display:flex; align-items:center; justify-content:center; background:var(--side); border-bottom:1px solid var(--rule); color:var(--ink); font-size:12px; }
.panes { flex:1; display:flex; min-height:0; }
.pane { flex:1; padding-top:8px; font:12px/19px var(--mono); overflow:hidden; border-right:1px solid var(--rule); min-width:0; }
.pane:last-child { border-right:0; }
.ln { display:flex; white-space:pre; position:relative; }
.ln .g { flex:0 0 40px; text-align:right; padding-right:9px; color:var(--lnum); background:var(--gutter); }
.ln .t { padding-left:10px; flex:1; }
.ln.add .t { background:var(--add); } .ln.add .g { background:var(--add-g); }
.ln.cur .t { box-shadow:inset 0 0 0 1px var(--signal); }
.ln .gm { position:absolute; left:40px; top:2px; bottom:2px; width:4px; border-radius:1px; }
.k { color:var(--kw); } .fn { color:var(--fn); } .ty { color:var(--ty); }

/* drawer */
.drawer { flex:none; display:flex; flex-direction:column; background:var(--panel); border-left:1px solid var(--rule-2); min-height:0; position:relative; }
.solo { position:relative; overflow:hidden; }
.solo .drawer { width:100%; height:100%; border-left:0; }
.tabs { flex:0 0 30px; display:flex; align-items:stretch; padding:0 6px; border-bottom:1px solid var(--rule); }
.tab { display:flex; align-items:center; gap:6px; padding:0 10px; color:var(--ink-2); }
.tab.on { color:var(--ink); font-weight:600; box-shadow:inset 0 -2px 0 var(--signal); }
.pillc { display:inline-flex; align-items:center; justify-content:center; min-width:16px; height:16px; padding:0 5px; border-radius:8px; background:var(--new); color:var(--on-signal); font-size:10.5px; font-weight:700; }
.dbody { flex:1; display:flex; min-height:0; position:relative; }
.conv { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }

/* navigation rows */
.nav { flex:0 0 34px; display:flex; align-items:center; gap:4px; padding:0 6px; border-bottom:1px solid var(--rule); }
.ic { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:5px; color:var(--ink-2); flex:none; position:relative; }
.ic.on { background:var(--signal-soft); color:var(--ink); }
.ic.hot { box-shadow:0 0 0 2px var(--signal); }
.ic .bdg { position:absolute; right:1px; top:2px; width:6px; height:6px; border-radius:50%; background:var(--new); }
.vsep { width:1px; height:16px; background:var(--rule); margin:0 2px; flex:none; }
.scopes { display:inline-flex; border:1px solid var(--rule-2); border-radius:6px; overflow:hidden; flex:none; }
.scopes .ic { border-radius:0; width:26px; height:22px; }

/* A: chips */
.chips { flex:1; display:flex; gap:4px; overflow:hidden; min-width:0; -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent); }
.chip { display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 7px 0 4px; border-radius:6px; border:1px solid var(--rule); color:var(--ink); white-space:nowrap; flex:none; font-variant-numeric:tabular-nums; }
.chip.on { border-color:var(--signal); background:var(--signal-soft); box-shadow:0 0 0 1px var(--signal); }
.chip.draft { border-style:dashed; color:var(--ink-2); }
.chip .n { min-width:15px; height:15px; padding:0 4px; border-radius:8px; background:var(--new); color:var(--on-signal); font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }

/* thread header shared by A and C */
.thead { flex:none; display:flex; align-items:center; gap:4px; padding:6px 6px 6px 12px; border-bottom:1px solid var(--rule); }
.loc { display:inline-flex; align-items:center; gap:6px; min-width:0; color:var(--ink); font-weight:600; white-space:nowrap; overflow:hidden; }
.loc .p { overflow:hidden; text-overflow:ellipsis; }
.loc .p span { color:var(--ink-3); font-weight:400; }
.st { width:9px; height:9px; border-radius:50%; background:var(--open); flex:none; }
.st.res { background:var(--ok); }

/* the conversation */
.feed { flex:1; overflow:hidden; padding:4px 0 10px; position:relative; }
.post { position:relative; display:grid; grid-template-columns:18px 1fr; column-gap:9px; padding:9px 14px 9px 16px; }
.post.reply { padding-left:28px; }
.post .rail { position:absolute; left:11px; top:9px; bottom:9px; width:2px; border-radius:1px; background:var(--t, var(--rule-2)); }
.post.reply .rail { left:23px; }
.post.blk .rail { left:9px; width:4px; }
.post.reply.blk .rail { left:21px; }
.post.plain .rail { background:var(--rule-2); }
.gut { display:flex; flex-direction:column; align-items:center; gap:3px; }
.av { width:18px; height:18px; border-radius:50%; background:var(--panel-2); border:1px solid var(--rule-2); color:var(--ink-2); font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; text-transform:uppercase; }
.av.me { background:var(--signal); border-color:var(--signal); color:var(--on-signal); }
.lm { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:4px; border:1.5px solid var(--t); color:var(--ink); background:color-mix(in srgb, var(--t) 22%, var(--panel)); flex:none; }
body.dark .lm { background:color-mix(in srgb, var(--t) 30%, var(--panel)); }
.lm.blk { background:var(--t); color:var(--on-t); }
.lm svg { display:block; width:12px; height:12px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; }
.lm.sm { width:14px; height:14px; border-radius:3.5px; } .lm.sm svg { width:10px; height:10px; }
.pb { min-width:0; }
.nm { display:flex; align-items:center; gap:6px; min-height:18px; white-space:nowrap; }
.nm b { font-weight:600; }
.nm .dot { width:7px; height:7px; border-radius:50%; background:var(--new); }
.post.read .nm b { font-weight:500; color:var(--ink-2); }
.tx { margin:2px 0 0; font-size:13px; line-height:1.5; color:var(--ink); overflow-wrap:anywhere; }
.post.read .tx { color:color-mix(in srgb, var(--ink) 82%, var(--panel)); }
.tx code { font:12px var(--mono); background:var(--panel-2); padding:0 3px; border-radius:3px; }
.post.sel { background:color-mix(in srgb, var(--signal-soft) 55%, transparent); }
.newline { display:flex; align-items:center; gap:8px; margin:2px 14px 0 16px; color:var(--new); font-size:11px; font-weight:600; }
.newline::after { content:""; flex:1; height:1px; background:var(--new); opacity:.55; }
.re { display:inline-flex; align-items:center; gap:4px; max-width:100%; margin-top:1px; padding:1px 7px 1px 4px; border-radius:5px; background:var(--panel-2); color:var(--ink-2); font-size:11.5px; white-space:nowrap; overflow:hidden; }
.re b { color:var(--ink); font-weight:600; }
.re .q { overflow:hidden; text-overflow:ellipsis; }
.fork { display:inline-flex; align-items:center; gap:4px; height:20px; margin-top:5px; padding:0 7px 0 5px; border-radius:10px; border:1px solid var(--rule-2); color:var(--ink-2); font-size:11px; font-variant-numeric:tabular-nums; }
.fold { display:flex; align-items:center; gap:7px; margin:0 14px 0 28px; padding:6px 8px; border-radius:6px; border:1px dashed var(--rule-2); color:var(--ink-2); font-size:11.5px; }
.stack { display:inline-flex; }
.chip .av, .row .av, .tick .av { width:16px; height:16px; font-size:9px; }
.stack .av { width:16px; height:16px; font-size:9px; margin-left:-4px; box-shadow:0 0 0 1.5px var(--panel); }
.stack .av:first-child { margin-left:0; }
.draftpost { margin:6px 10px; border:1px dashed var(--rule-2); border-radius:7px; padding-top:2px; }
.draftpost .post { padding-left:12px; }
.draftpost .post .rail { left:7px; }
.dacts { display:flex; gap:2px; align-items:center; padding:0 6px 6px 37px; }
.btn { display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 10px; border-radius:6px; border:1px solid var(--rule-2); color:var(--ink); background:var(--panel); white-space:nowrap; font-weight:500; }
.btn.pri { background:var(--signal); border-color:var(--signal); color:var(--on-signal); }
.priv { font-size:11px; color:var(--ink-3); display:inline-flex; align-items:center; gap:4px; }

/* reply in place */
.rbox { flex:none; border-top:1px solid var(--rule); padding:8px 10px 10px; display:flex; flex-direction:column; gap:7px; background:var(--panel); }
.rf { display:flex; align-items:center; gap:8px; }
.field { flex:1; min-height:30px; border:1px solid var(--rule-2); border-radius:7px; background:var(--field); padding:6px 9px; color:var(--ink-3); font-size:13px; line-height:1.45; display:flex; align-items:center; gap:6px; }
.field.on { border-color:var(--signal); box-shadow:0 0 0 2px color-mix(in srgb, var(--signal) 30%, transparent); color:var(--ink); align-items:flex-start; min-height:78px; flex-direction:column; }
.field .caret { display:inline-block; width:1px; height:15px; background:var(--ink); vertical-align:-3px; }
.lab { display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 6px 0 3px; border-radius:5px; background:color-mix(in srgb, var(--t) 18%, var(--panel)); color:var(--ink); font-size:12px; }
.ract { display:flex; align-items:center; gap:4px; }

/* B: stacked rows */
.rows { flex:none; }
.row { display:flex; align-items:center; gap:7px; height:32px; padding:0 8px 0 6px; border-bottom:1px solid var(--rule); color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums; }
.row .chev { color:var(--ink-3); }
.row .ln2 { font-weight:600; } .ln2::before, .chip .lnum::before { content:":"; color:var(--ink-3); font-weight:400; }
.row .first { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; color:var(--ink-2); }
.row .cnt { color:var(--ink-3); font-size:11px; display:inline-flex; align-items:center; gap:3px; }
.row.open { background:var(--panel-2); border-bottom-color:var(--rule-2); height:34px; }
.row.open .first { color:var(--ink-2); }
.row.draft .first { font-style:normal; }
.row.draft { color:var(--ink-2); }
.row .n { min-width:15px; height:15px; padding:0 4px; border-radius:8px; background:var(--new); color:var(--on-signal); font-size:10px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }
.row .dash { width:14px; height:14px; border:1.5px dashed var(--ink-3); border-radius:3.5px; display:inline-flex; align-items:center; justify-content:center; }
.fgroup { height:22px; display:flex; align-items:center; padding:0 10px; color:var(--ink-3); font-size:11px; background:var(--side); border-bottom:1px solid var(--rule); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* C: line rail */
.lrail { flex:0 0 24px; position:relative; background:var(--side); border-right:1px solid var(--rule); }
.tick { position:absolute; left:3px; width:18px; height:18px; transform:translateY(-50%); border-radius:4px; display:flex; align-items:center; justify-content:center; }
.tick .lm { width:16px; height:16px; }
.tick.on::after { content:""; position:absolute; right:-6px; top:50%; width:7px; height:2px; background:var(--signal); }
.tick.on { box-shadow:0 0 0 2px var(--signal); background:var(--panel); }
.tick .u { position:absolute; right:-2px; top:-2px; width:7px; height:7px; border-radius:50%; background:var(--new); box-shadow:0 0 0 1.5px var(--side); }
.tick .dash { width:14px; height:14px; border:1.5px dashed var(--ink-3); border-radius:3.5px; display:flex; align-items:center; justify-content:center; color:var(--ink-3); }
.tick.out { opacity:.55; }
.span { position:absolute; left:11px; width:2px; background:var(--rule-2); border-radius:1px; }

/* popover and tooltip */
.pop { position:absolute; z-index:15; background:var(--panel); border:1px solid var(--rule-2); border-radius:8px; box-shadow:var(--shadow); padding:4px 0; overflow:hidden; }
.pop .row { border-bottom:0; height:30px; }
.pop .row.on { background:var(--signal-soft); }
.pop .fgroup { background:transparent; border-bottom:0; height:22px; padding-top:4px; }
.tip { position:absolute; z-index:20; background:var(--tip); color:var(--tip-ink); border-radius:5px; padding:4px 8px; font-size:11.5px; line-height:1.35; box-shadow:var(--shadow); white-space:nowrap; }
.tip kbd { font:11px var(--ui); opacity:.7; margin-left:6px; }

/* index */
.idx a { display:block; margin:2px 0; color:var(--signal); }
</style>
</head>

      if (st.pr) {
        for (const [f, kk] of PR) {
          const g = `<div class="fgroup">${f}</div>` + kk.filter((k) => k !== sel).map((k) => rowB(k, false)).join("");
          if (kk.includes(sel)) { above += `<div class="fgroup">${f}</div>` + kk.slice(0, kk.indexOf(sel)).map((k) => rowB(k, false)).join(""); below += kk.slice(kk.indexOf(sel) + 1).map((k) => rowB(k, false)).join(""); after = true; }
          else if (after) below += g; else above += g;
        }
      } else {
        for (const k of ks) { if (k === sel) { after = true; continue; } (after ? (below += rowB(k, false)) : (above += rowB(k, false))); }
      }
      inner = `<div class="conv">${navB(st)}<div class="rows">${above}${rowB(sel, true)}</div><div class="feed">${feed(sel)}</div>${replyBox(st.reply)}<div class="rows" style="border-top:1px solid var(--rule)">${below}</div></div>`;
    }
  } else {
    const nav = `<div class="nav">${scopes(st.pr)}<span class="sp"></span>${nextNew()}${btn("list", "All threads", st.list ? "on" : "")}${filterBtn()}</div>`;
    if (deep) {
      inner = `<div class="lrail">${`<span class="tick on" style="top:${lineY(42) > 600 ? 300 : lineY(42)}px"><span class="lm" style="--t:var(--ink-3);border-style:dashed"></span><i class="u"></i></span>`}</div>`;
      inner = `${railDeep()}<div class="conv">${nav}${deepHead}<div class="feed">${deepFeed({foldA:true})}</div>${replyBox(st.reply)}</div>`;
    } else {
      inner = `${railC(sel)}<div class="conv">${nav}${headC(sel)}<div class="feed">${feed(sel)}</div>${replyBox(st.reply)}</div>`;
      if (st.list) inner += listPop(sel, 0, 34, st.pr ? "pr" : "file");
    }
  }
  return `${tabs()}<div class="dbody">${inner}${st.tip ? `<div class="tip" style="${st.tip.pos}">${st.tip.text}</div>` : ""}</div>`;
}
/* The deep thread's file is not the screenshot's, so its one tick sits at an illustrative height. */
function railDeep() { return `<div class="lrail"><span class="tick on" style="top:180px" title="Line 42: reviewer-one, 24 posts, 3 new">${avatar("reviewer-one")}<i class="u"></i></span></div>`; }

/* ---------- the window around the drawer ---------- */
const LEFT = [["#include \"renderer.h\""], [""], ['<span class="k">void</span> <span class="ty">Renderer</span>::<span class="fn">draw</span>()'], ["{"], ['    <span class="fn">clear</span>();'], ['    <span class="fn">present</span>();'], ["}"], [""]];
const RIGHT = [["#include \"renderer.h\""], [""], ['<span class="k">void</span> <span class="ty">Renderer</span>::<span class="fn">draw</span>()'], ["{"], ['    <span class="fn">clear</span>();'], ['    <span class="fn">draw_scene</span>();', "add"], ['    <span class="fn">present</span>();'], ["}"], ["", "add"],
  ['<span class="k">void</span> <span class="ty">Renderer</span>::<span class="fn">resize</span>(<span class="k">const int</span> aWidth, <span class="k">const int</span> aHeight)', "add"], ["{", "add"], ["    Width  = aWidth;", "add"], ["    Height = aHeight;", "add"], ["}", "add"], [""]];
function pane(lines, marks = {}, cur) {
  return `<div class="pane">${lines.map(([t, c], i) => `<div class="ln ${c || ""} ${cur === i + 1 ? "cur" : ""}"><span class="g">${i + 1}</span>${marks[i + 1] ? `<i class="gm" style="background:${marks[i + 1]}"></i>` : ""}<span class="t">${t}</span></div>`).join("")}</div>`;
}
function windowFrame(cand, st, dw) {
  const cur = T[st.sel || "t6"].line;
  return `<div class="win"><div class="title"><span class="lights"><i></i><i></i><i></i></span><span class="tb">${ic("home")}</span><span class="tb">${ic("drawer")}</span><span class="sp"></span>
      <span class="seg"><span>Overview <kbd>⌘1</kbd></span><span class="on">Read <kbd>⌘2</kbd></span><span>Review <kbd>⌘3</kbd></span><span>Discuss <kbd>⌘4</kbd></span></span>
      <span class="tb">${ic("refresh")}</span><span class="tb on">${ic("drawer")}<span class="pillc">6</span></span><span class="tb">${ic("user")}</span><span class="tb">${ic("sun")}</span></div>
    <div class="bar"><span>Comparing whole PR, Oct 5 → Oct 5</span><span><b>File 5 of 17</b></span><span><b>Changes 1 of 2</b></span><span class="sp"></span></div>
    <div class="main"><div class="cmp"><div class="fh">renderer.cpp</div><div class="panes">${pane(LEFT, {}, null)}${pane(RIGHT, {6:"var(--open)", 12:"var(--signal)"}, cur)}</div></div>
      <div class="drawer" style="width:${dw}px">${drawer(cand, st)}</div></div>
    <div class="status">Actionable file 5 of 17. Private progress: unread, not accepted.</div></div>`;
}

/* ---------- frames ---------- */
const FRAMES = {};
const add = (id, cap, w, h, kind, cand, st = {}, dw = 375) => (FRAMES[id] = {cap, w, h, kind, cand, st, dw});
for (const c of ["a", "b", "c"]) {
  add(`${c}-window`, "Read, the owner's view: thread at line 6 open", 1440, 820, "window", c, {});
  add(`${c}-reply`, "Replying in place, 375 px", 375, 760, "solo", c, {reply:"typing"});
  add(`${c}-narrow`, "280 px, whole pull request", 280, 760, "solo", c, c === "b" ? {pr:true, sel:"t6"} : {pr:true, list:true});
  add(`${c}-deep`, "branching-thread-v1: 24 posts, three branches, 375 px", 375, 760, "solo", c, {deep:true});
}
FRAMES["a-reply"].st.tip = {pos:"left:150px;top:64px", text:"Line 12: jiayin, 2 posts, 1 new"};
FRAMES["b-reply"].st.tip = {pos:"right:44px;top:72px", text:"Mark 3 new as read"};
FRAMES["c-window"].st.tip = {pos:"left:-184px;top:233px", text:"Line 12: jiayin, 2 posts, 1 new"};
FRAMES["c-window"].dw = 375;

const f = Q.get("f");
const root = document.getElementById("root");
if (!f || !FRAMES[f]) {
  document.body.classList.add("index");
  root.innerHTML = `<div class="idx"><h3>BPR-1290 frames v1</h3>${Object.entries(FRAMES).map(([k, v]) => `<a href="?f=${k}">${k}: ${v.cap}</a><a href="?f=${k}&theme=dark">${k}, dark</a>`).join("")}</div>`;
} else {
  const F = FRAMES[f];
  if (F.kind === "window") root.innerHTML = windowFrame(F.cand, F.st, F.dw);
  else { document.body.classList.add("solo"); root.innerHTML = `<div class="solo" style="width:${F.w}px;height:${F.h}px"><div class="drawer">${drawer(F.cand, F.st)}</div></div>`; }
}
</script>
