-2026-09-11.2", "content": "The run: quit any running BetterPullReview, open the bundle with the command above. If a review opens on its own at launch, that is the restored review; otherwise stay signed out, press Read without signing in on Home, paste the pull request link into the bar and press Open, then let the review history settle. Nothing here writes to GitHub. Press Read (the strip's modality control or its shortcut) with a file open at your usual window size. In this build Read collapses the repositories drawer, so the comparison gains its 300 pixels; the conversations drawer (375 pixels minimum) still sits beside the two panes. The owner said the code was hard to read for lack of horizontal area; select what should happen next, or the last option to stop here.", "criteria": ["Pick what Read should do next about horizontal room for the code, after this build's change (Read now collapses the repositories drawer as well as the files drawer)"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "paths": ["src/adapters/qt", "src/app"], "options": ["Read also closes the conversations drawer; the strip's comments toggle brings the threads back (amends the RFC's Read definition)", "Keep the conversations drawer in Read but let it go narrower than 375 pixels", "A single-pane Read layout (one document with the other side's changes marked) as a new slice", "Leave Read as it is in this build"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "cc2afa7fb84d443a1bba93373b990be83748be20451fa0b6adde45cc6fae4c1c"}, "launch": {"label": "Open the bundle built at the BPR-0718/BPR-0723 head (quit any running BetterPullReview first)", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "fingerprint": "29aaf8afe6bc6929c43440f70328af89f9741067e5e5dc4e3ecc6f9d93ba6f3a", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0724-read-width", "fingerprint": "29aaf8afe6bc6929c43440f70328af89f9741067e5e5dc4e3ecc6f9d93ba6f3a", "decision_id": "205ac8b2-30fd-4339-8d08-51c621ab7fc8", "outcome": "select", "selected": ["Keep the conversations drawer in Read but let it go narrower than 375 pixels", "A single-pane Read layout (one document with the other side's changes marked) as a new slice"], "note": "Toggle to single pane view like p4merge's layout would be good", "attachments": [{"name": "image.png", "data": ""}, {"name": "image.png", "data": ""}], "saved_at": "2026-09-11T18:42:22.574416+00:00", "actor": "human"}, "observations": [{"time": "2026-09-11T18:08:01.919969+00:00", "evidence": "Prepared again on the tests-disabled bundle built at d1ba791f (BPR-0718 and BPR-0723 landed; executable sha256 cc2afa7f…). The ask is unchanged."}], "preparation_epoch": 2, "preparation_id": null}, {"id": "BPR-0725-epoch-line-cache-hit", "title": "The epoch line shows the updates when the catalogue already holds the head", "revision": "app-release-64d9e46a-2026-09-11.3", "criteria": ["Opening microsoft/terminal#20607 from Recently viewed (or by pasting its link) when it was already read on this Mac shows the nodes, the span and the handles on the epoch line, not 'No updates loaded.'"], "content": "The run: quit any running BetterPullReview, open the bundle with the command above. Home appears at once. Open microsoft/terminal#20607 from Recently viewed, or paste the link into the bar and press Open; the catalogue on this Mac already holds its head from the v006 session, so this is the cache-hit path the v006 rejections hit. Nothing here writes to GitHub. In this build the core asks for the newest history page as soon as the catalogue revision is settled, so a restored or cached open carries every update the catalogue holds. If the line is still empty, read ~/Library/Application Support/BetterPullReview/BetterPullReview/logs/diagnostics.log and erminal#20607 from Home and open ScreenBufferTests.cpp in Read or Review in Dark appearance. Nothing here writes to GitHub. The grammar itself emits no function role for C++ and leaves user types and macros plain, so this build adds a heuristic pass over the plain runs only: a word before ( is a function, an ALL_CAPS word is a macro even when called, a word before :: or after class/struct/enum/typename/new or a PascalCase word before another word, &, * or \u003c is a type. Look for misfires as well as misses: a plain word wrongly coloured is as much a finding as one left plain.", "paths": ["src/adapters/syntax", "src/adapters/qt"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "64d9e46a0fa7cff7e37d778d329a8e71bcf6ff13547bbc82eadb547ebb252827"}, "launch": {"label": "Open the bundle built at the BPR-0733 head (quit any running BetterPullReview first)", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "copy": [{"label": "Pull request link for the Home bar", "value": "https://github.com/microsoft/terminal/pull/20607"}], "fingerprint": "f46a9ee3a42878247bec904a98a4bed721eb096aa92e9e2a7f996e35c6709d5b", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0726-cpp-identifier-roles", "fingerprint": "f46a9ee3a42878247bec904a98a4bed721eb096aa92e9e2a7f996e35c6709d5b", "decision_id": "91d2fa40-e8da-47b9-9825-64e4b0f76a5e", "outcome": "accept", "note": "", "saved_at": "2026-09-11T23:46:15.564021+00:00", "actor": "human"}, "observations": [{"time": "2026-09-11T23:26:21.204708+00:00", "evidence": "Static review material prepared"}], "preparation_id": null, "preparation_epoch": 1}, {"id": "BPR-0727-overview-drawers", "title": "Overview refuses a drawer opened by hand, and is chosen rather than inferred", "revision": "app-release-64d9e46a-2026-09-11.3", "criteria": ["In Overview, the strip's drawer toggles and Alt+Shift+1/2/3 leave every drawer collapsed and the status bar says why; in Read, Review and Discuss the same toggles still open the drawers", "Quit in Read with only the files drawer open (the same shape as Overview's preset) and relaunch: the restored review comes back in Read, not Overview, and its drawer toggles work; Overview is only ever the result of choosing it"], "content": "The run: quit any running BetterPullReview, open the bundle with the command above, open microsoft/terminal#20607 from Home, switch to Overview and try the drawer toggles on the strip and the shortcuts; then switch to Read, Review and Discuss and try them again. Nothing here writes to GitHub. The second criterion is a judgement the integrator made while landing this card and wants you to see: the window used to infer Overview from the files-only drawer shape at restart; it no longer does, because that shape is indistinguishable from a Read with the conversations closed by hand, and inferring Overview would make the app refuse a toggle the strip never promised to refuse. If you would rather the files-only shape came back as Overview, reject with a note.", "paths": ["src/core", "src/application", "src/adapters/qt"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "64d9e46a0fa7cff7e37d778d329a8e71bcf6ff13547bbc82eadb547ebb252827"}, "launch": {"label": "Open the bundle built at the BPR-0733 head (quit any running BetterPullReview first)", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "copy": [{"label": "Pull request link for the Home bar", "value": "https://github.com/microsoft/terminal/pull/20607"}], "fingerprint": "cd9e85e3a5f668f64b26b56e4bc7cb7bad3d62926fdf7cec2f71d14661c10bba", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0727-overview-drawers", "fingerprint": "cd9e85e3a5f668f64b26b56e4bc7cb7bad3d62926fdf7cec2f71d14661c10bba", "decision_id": "e10736e3-b90e-4621-8bc6-e3065e9e883b", "outcome": "accept", "note": "", "saved_at": "2026-09-11T23:46:29.229674+00:00", "actor": "human"}, "observations": [{"time": "2026-09-11T23:26:21.485547+00:00", "evidence": "Static review material prepared"}], "preparation_id": null, "preparation_epoch": 1}, {"id": "BPR-0728-conversations-drawer-width", "title": "The conversations drawer goes narrower than 375 pixels in Read", "revision": "app-release-64d9e46a-2026-09-11.3", "criteria": ["In Read, the handle drags the conversations drawer well below 375 pixels (down to about 200 is comfortable; the narrowest stop is the same 64-pixel floor the other drawers have), the code gets the room, and every control in the drawer stays reachable (the column scrolls sideways beneath about 290 rather than clipping)", "The narrowed width survives Home and back"], "content": "The run: quit any running BetterPullReview, open the bundle with the command above, open microsoft/terminal#20607 from Home, switch to Read and drag the handle between the code and the conversations drawer to the right. Then press the Home button on the strip and open the pull request again from Recently viewed. Nothing here writes to GitHub. This is the second option you selected on BPR-0724 in v006. The 375 design width is still where a squeezed drawer is lifted back to on a later launch when it was persisted narrower than 160.", "paths": ["src/adapters/qt"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "64d9e46a0fa7cff7e37d778d329a8e71bcf6ff13547bbc82eadb547ebb252827"}, "launch": {"label": "Open the bundle built at the BPR-0733 head (quit any running BetterPullReview first)", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "copy": [{"label": "Pull request link for the Home bar", "value": "https://github.com/microsoft/terminal/pull/20607"}], "fingerprint": "f61c6e2f549a2b87de6823d61b36533cde4fd3216a87de9ba9eea47db8dc7d66", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0728-conversations-drawer-width", "fingerprint": "f61c6e2f549a2b87de6823d61b36533cde4fd3216a87de9ba9eea47db8dc7d66", "decision_id": "8a907ecd-4aef-4596-a035-320365d12b40", "outcome": "accept", "note": "It does, but the mouse cursor for the horizontal resize flickers only for a brief moment and the returns back to the normal cursor so it's difficult to resize properly since you have no visual indicator you're cursor is over the border element.", "saved_at": "2026-09-11T23:47:54.288046+00:00", "actor": "human"}, "observations": [{"time": "2026-09-11T23:26:21.770134+00:00", "evidence": "Static review material prepared"}], "preparation_id": null, "preparation_epoch": 1}, {"id": "BPR-0732-signed-out-home", "title": "A signed-out Home is one paste field that opens a public pull request", "revision": "app-release-64d9e46a-2026-09-11.3", "criteria": ["Signed out, Home shows the account card, one paste field with Open and the status bar; no review queue heading, list or filter combos, and no separate Read without signing in button", "Pasting a public pull request link (or owner/name#123) into the field and pressing Open or Return opens it in one gesture, read-only, with no sign-in stop and no intermediate page"], "content": "The run: quit any running BetterPullReview, open the bundle with the command above. If an account is signed in, sign out first (Settings > Accounts & hosts) so Home is the signed-out one. Paste the pull request link into the field and press Open. Nothing here
