	<rect x="0" y="0" width="1600" height="132" fill="#FFFFFF"/>
	<line x1="0" y1="132" x2="1600" y2="132" stroke="#D4D9E0" stroke-width="2"/>
	<text x="56" y="58" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#1F2328">Alternative A: the whole review in one place</text>
	<text x="56" y="96" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6570">Every thread across every file, plus the pull-request-level comments the file drawer never shows.</text>
	<rect x="1214" y="34" width="330" height="42" fill="#FFF1D6" rx="6" stroke="#C79A2E" stroke-width="1"/>
	<text x="1379" y="62" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#7A5A0B" text-anchor="middle">MOCKUP - NOT IMPLEMENTED</text>
	<line x1="56" y1="1472" x2="1544" y2="1472" stroke="#8C8C8C" stroke-width="1"/>
	<text x="56" y="1504" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6570">Reachable from the projection exactly as it is today: this drops the set_anchor_file filter and groups by Path. No model change, no fetch change.</text>
	<text x="56" y="1532" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6570">The row vocabulary is unchanged, so "Review by", "Pull request comment by" and the Open/Resolved/Outdated facts are the strings the delegate already paints.</text>
	<text x="56" y="1560" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6570">What it costs is a second surface to keep in sync with the drawer, and a second place a reviewer can lose their position.</text>
	<rect x="56" y="180" width="1488" height="1010" fill="#FFFFFF" rx="10" stroke="#D4D9E0" stroke-width="1"/>
	<rect x="56" y="180" width="1488" height="56" fill="#F0F2F5" rx="10"/>
	<rect x="56" y="220" width="1488" height="16" fill="#F0F2F5"/>
	<line x1="56" y1="236" x2="1544" y2="236" stroke="#D4D9E0" stroke-width="1"/>
