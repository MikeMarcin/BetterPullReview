	<line x1="56" y1="1472" x2="1544" y2="1472" stroke="#8C8C8C" stroke-width="1"/>
	<text x="56" y="1504" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6570">The conversation drawn here is SYNTHESIZED. No recorded pull request in this repository has any conversation, and the deepest real structure anywhere</text>
	<text x="56" y="1532" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6570">is one replyTo edge in a contract fixture. This mockup therefore shows a shape the product could carry, not one it has ever displayed.</text>
	<text x="56" y="1560" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6570">Cost: the reply edge already exists at github_read_model.hpp:233 and is discarded at github_projection_mapping.cpp:175, which writes the thread root as ParentId.</text>
