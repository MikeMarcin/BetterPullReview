	<text x="56" y="58" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#1F2328">Alternative B: a Treeverse-style overview of one deep thread</text>
	<text x="56" y="96" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#5B6570">A map of the reply structure, with the read path highlighted and one node in focus.</text>
	<rect x="1214" y="34" width="330" height="42" fill="#FFF1D6" rx="6" stroke="#C79A2E" stroke-width="1"/>
