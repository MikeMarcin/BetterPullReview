	<text x="76" y="1038" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2328">What the join needs, and what exists</text>
	<text x="80" y="1098" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2328">The revision axis</text>
	<text x="356" y="1098" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A7F37">exists</text>
	<text x="80" y="1128" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#24292F">accepted_pull_request_revision carries Base and Head OIDs and an Origin of live or explicit_historical_import.</text>
	<text x="80" y="1188" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2328">The conversation axis</text>
	<text x="356" y="1188" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1A7F37">exists</text>
	<text x="80" y="1218" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#24292F">github_conversation_projection carries Path, Line, Resolved and Outdated for every node.</text>
	<text x="80" y="1278" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2328">A comment's revision</text>
	<text x="356" y="1278" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#CF222E">not projected</text>
	<text x="80" y="1308" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#24292F">Nothing on github_conversation_projection keys a node to a revision. A review's commit_id is required on read and dropped here; a comment's commit is not requested at all.</text>
	<text x="80" y="1368" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1F2328">Therefore</text>
	<text x="80" y="1398" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#24292F">Not computable from the projection today, and nearer than it looks: the write path already sends commit_id. It is still a model question before a presentation one, which is why this asks for an RFC.</text>
