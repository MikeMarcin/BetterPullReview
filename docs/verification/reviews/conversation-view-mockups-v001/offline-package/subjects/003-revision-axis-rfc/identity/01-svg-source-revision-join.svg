	<text x="56" y="1504" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6570">The epoch axis is real: epoch_comparison_control already offers independent left and right selectors, and the labels above are the exact format at</text>
	<text x="56" y="1532" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6570">epoch_history_model.cpp:132-137. The conversation axis is real. The projection carries no commit OID, epoch, or ordinal - verified field by field at</text>
	<text x="56" y="1560" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6570">github_projection.hpp:124-139 - so no cell above can be computed from it. But a review's commit_id is already REQUIRED on read and then dropped, so this</text>
	<text x="56" y="1588" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5B6570">is nearer than "unknown": what is missing for a per-comment row is a field the review-thread GraphQL selection does not yet ask for.</text>
