	<text x="96" y="1004" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#0969DA">Filter: show only lanes with something unresolved  ·  collapse a lane to its root</text>
	<text x="96" y="1036" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6570">A lane is a thread. That is BPR-0191's own reading, and it is the part of it that was right.</text>
