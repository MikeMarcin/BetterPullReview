let state=embedded, current=null, local=[], saving=false, pending=[];
const token=new URLSearchParams(location.hash.slice(1)).get('token');
const online=!embedded&&location.protocol==='http:';
const el=id=>document.getElementById(id);
const say=text=>el('notice').textContent=text;
const cacheKey=()=>`attended-review:${state.session}`;
function restore(){try{local=JSON.parse(localStorage.getItem(cacheKey())||'[]').filter(d=>state.candidates.some(c=>c.id===d.candidate&&c.fingerprint===d.fingerprint));}catch(e){local=[];el('storage').textContent='Browser storage is unavailable. Export decisions before closing this page.';}}
