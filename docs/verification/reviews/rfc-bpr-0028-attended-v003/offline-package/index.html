 el('wizard').replaceChildren();if(c.wizard){const p=document.createElement('p');p.textContent=c.wizard.instructions||'Follow the companion wizard, then return here for your decision.';el('wizard').append(p);if(c.wizard.url){try{const url=new URL(c.wizard.url);if(['http:','https:','file:'].includes(url.protocol)){const a=document.createElement('a');a.href=url.href;a.textContent='Open manual steps';a.target='_blank';a.rel='noopener noreferrer';el('wizard').append(a);}}catch(e){}}}
 const oldOptions=new Set([...el('options').querySelectorAll('input:checked')].map(v=>v.value));
 el('options').replaceChildren();for(const option of c.options||[]){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=option;input.checked=oldOptions.has(option);label.append(input,document.createTextNode(` ${option}`));el('options').append(label);}
 const d=decision(c),enabled=c.phase==='ready'&&c.protected&&!saving&&!state.handed_back;
 el('accept').textContent=(c.options?'Save selection':'Accept')+(d&&d.outcome!=='accept'?' instead':'');
 el('reject').textContent='Reject'+(d&&d.outcome!=='reject'?' instead':'');
 el('accept').disabled=el('reject').disabled=!enabled;
 el('clear').disabled=!enabled||!d;el('clear').hidden=!d;
 el('images').disabled=!enabled;
 el('attachments').replaceChildren();
 for(const a of pending){const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption');image.src=a.data;image.alt=a.name;caption.textContent=a.name;figure.append(image,caption);el('attachments').append(figure);}
 // The note is part of the verdict, so the verdict says it back.
 el('verdict').textContent=d?`Recorded: ${d.outcome}${d.selected?' — '+d.selected.join(', '):''}${d.note?` — “${d.note}”`:''}${d.attachments?.length?` — ${d.attachments.length} image(s)`:''}`:c.phase==='ready'?'':c.error||'Preparation is pending. Other ready items are available.';
 el('launch').replaceChildren();
 el('copy-values').replaceChildren();
 for(const value of c.copy||[]){const row=document.createElement('p'),label=document.createElement('span'),code=document.createElement('code'),copy=document.createElement('button');label.className='group';label.textContent=value.label;code.textContent=value.value;copy.textContent='Copy';copy.onclick=async()=>{try{await navigator.clipboard.writeText(value.value);say(`${value.label} copied.`);}catch(e){const range=document.createRange();range.selectNodeContents(code);getSelection().removeAllRanges();getSelection().addRange(range);say('Copy the selected text using your keyboard.');}};row.append(label);el('copy-values').append(row,code,copy);}
 if(c.launch){const p=document.createElement('p'),code=document.createElement('code'),copy=document.createElement('button');p.textContent=c.launch.label||'Open what this asks you to look at:';code.textContent=c.launch.command;copy.textContent='Copy command';copy.onclick=async()=>{try{await navigator.clipboard.writeText(c.launch.command);say('Command copied. Paste it in a terminal.');}catch(e){const range=document.createRange();range.selectNodeContents(code);getSelection().removeAllRanges();getSelection().addRange(range);say('Copy the selected command using your keyboard.');}};el('launch').append(p,code,copy);}
}
async function record(outcome){
 const c=candidate();if(!c)return;
 const d={candidate:c.id,fingerprint:c.fingerprint,decision_id:globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`,outcome,note:el('note').value};
 if(outcome!=='withdrawn'&&pending.length)d.attachments=pending.map(a=>({name:a.name,data:a.data}));
 if(outcome==='select'){d.selected=[...el('options').querySelectorAll('input:checked')].map(v=>v.value);if(!d.selected.length){say('Select at least one option.');return;}}
 saving=true;draw();
 try{if(online){await api('/api/decisions',{schema_version:1,session:state.session,decisions:[d]});state=await api('/api/status');say(outcome==='withdrawn'?'Decision cleared. Decide again whenever you are ready.':'Decision saved. It is shown below; change or clear it whenever you like, or pick the next item.');}else{local=local.filter(v=>!(v.candidate===d.candidate&&v.fingerprint===d.fingerprint));if(outcome!=='withdrawn')local.push(d);persist();say(outcome==='withdrawn'?'Decision cleared in this browser.':'Decision retained in this browser. Export whenever you are ready to stop.');}select(c.id);}catch(e){say(`Decision was not confirmed saved: ${e.message}. Retry; a matching repeated import is safe.`);}finally{saving=false;draw();}
}
el('accept').onclick=()=>record(candidate()?.options?'select':'accept');el('reject').onclick=()=>record('reject');el('skip').onclick=chooseNext;
el('clear').onclick=()=>record('withdrawn');
el('finish').onclick=async()=>{
 const decided=state.candidates.filter(decision),pending=state.candidates.filter(c=>!decision(c));
 const summary=`${decided.length} answered${decided.length?': '+decided.map(c=>`${c.title} — ${decision(c).outcome}`).join('; '):''}. ${pending.length} left unanswered.`;
 try{
  if(online){await api('/api/hand-back',{});state=await api('/api/status');say(`Handed back. ${summary} Your answers are saved; you can close this tab.`);}
  else{el('export').click();say(`${summary} Your answers are in the box below: copy or download it and give it to your driver, then close this tab.`);el('fallback').open=true;}
 }catch(e){say(`Could not hand back: ${e.message}. Your saved answers are unaffected.`);}
 draw();};
// A screenshot is on the clipboard, not on disk. Pasting one into the note
// attaches it, under the same bounds a chosen file has.
async function attach(files){for(const file of files){if(pending.length>=4){say('Four images is the bound for one answer.');break;}if(file.size>3*1024*1024){say(`${file.name||'that image'} is larger than 3 MB; use a smaller one.`);continue;}try{pending.push({name:file.name||`pasted-${pending.length+1}.png`,data:await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file);})});}catch(e){say('That image could not be read.');}}draw();}
el('note').onpaste=async event=>{const files=[...(event.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(!files.length)return;event.preventDefault();await attach(files);say(`${files.length} image(s) attached to this answer.`);};
el('images').onchange=async()=>{const files=[...el('images').files];el('images').value='';await attach(files);};
el('start').onclick=async()=>{try{if(online){await api('/api/start',{interrupt:true});state=await api('/api/status');}say('Review ready items now. Skips remain pending.');chooseNext();}catch(e){say(e.message);}};
el('pause').onclick=async()=>{try{if(online){await api('/api/pause',{});state=await api('/api/status');}say(online?'Session paused. Prepared candidates remain protected.':'You can stop now. Export partial decisions first; undecided items remain pending.');draw();}catch(e){say(e.message);}};
el('export').onclick=()=>{el('transfer').value=JSON.stringify(packet(),null,2);};
el('copy').onclick=async()=>{el('export').click();try{await navigator.clipboard.writeText(el('transfer').value);say('Decision JSON copied.');}catch(e){el('transfer').select();say('Copy the selected JSON using your keyboard.');}};
el('download').onclick=()=>{el('export').click();const blob=new Blob([el('transfer').value],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='attended-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function stamp(){if(!state)return;const when=state.generated_at;el('generated').textContent=online?'':when?`This file was written at ${when}. Anything decided in the live session after that is not in it; ask your driver to write it again.`:'';}
async function boot(){try{if(online){state=await api('/api/status');history.replaceState(null,'',location.pathname+location.hash);}if(!state)throw Error('Open the complete URL printed by serve, or generate an offline HTML file.');if(!online)restore();stamp();draw();if(online)setInterval(async()=>{if(saving)return;try{const next=await api('/api/status');if(next.sequence!==state.sequence){state=next;draw();}}catch(e){say('Live host is unavailable. Reopen it with your driver; saved decisions remain on disk.');}},1500);}catch(e){say(e.message);}}
boot();
</script></html>
