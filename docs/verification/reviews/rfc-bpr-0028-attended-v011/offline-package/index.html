t 'No updates loaded.'"], "content": "The run: quit any running BetterPullReview, open the bundle with the command above. Home appears at once. Open microsoft/terminal#20607 from Recently viewed, or paste the link into the bar and press Open; the catalogue on this Mac already holds its head from the v006 session, so this is the cache-hit path the v006 rejections hit. Nothing here writes to GitHub. In this build the core asks for the newest history page as soon as the catalogue revision is settled, so a restored or cached open carries every update the catalogue holds. If the line is still empty, read ~/Library/Application Support/BetterPullReview/BetterPullReview/logs/diagnostics.log and note the epoch_stage entries for the launch.", "paths": ["src/core", "src/application", "src/adapters/qt", "src/app"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "64d9e46a0fa7cff7e37d778d329a8e71bcf6ff13547bbc82eadb547ebb252827"}, "launch": {"label": "Open the bundle built at the BPR-0733 head (quit any running BetterPullReview first)", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "copy": [{"label": "Pull request link for the Home bar", "value": "https://github.com/microsoft/terminal/pull/20607"}], "fingerprint": "50a8e32602d4ce56f0e27496ce93f68c49af667a12a351f81c04a350d49fda4f", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0725-epoch-line-cache-hit", "fingerprint": "50a8e32602d4ce56f0e27496ce93f68c49af667a12a351f81c04a350d49fda4f", "decision_id": "917a826e-ebd8-4306-bd28-9fbb4b695ff7", "outcome": "accept", "note": "", "saved_at": "2026-09-11T23:45:56.349633+00:00", "actor": "human"}, "observations": [{"time": "2026-09-11T23:26:20.920160+00:00", "evidence": "Static review material prepared"}], "preparation_id": null, "preparation_epoch": 2}, {"id": "BPR-0726-cpp-identifier-roles", "title": "Functions, types and macros are coloured in C and C++", "revision": "app-release-64d9e46a-2026-09-11.3", "criteria": ["In ScreenBufferTests.cpp on the dark palette, calls such as ProcessString and GetTextBuffer are pale yellow, types such as TextAttribute, ScreenBufferTests and ServiceLocator are teal, and ALL_CAPS macros such as VERIFY_ARE_EQUAL and BEGIN_TEST_METHOD_PROPERTIES take the preprocessor grey, while comments and strings keep their own single colour throughout"], "content": "The run: quit any running BetterPullReview, open the bundle with the command above, open microsoft/terminal#20607 from Home and open ScreenBufferTests.cpp in Read or Review in Dark appearance. Nothing here writes to GitHub. The grammar itself emits no function role for C++ and leaves user types and macros plain, so this build adds a heuristic pass over the plain runs only: a word before ( is a function, an ALL_CAPS word is a macro even when called, a word before :: or after class/struct/enum/typename/new or a PascalCase word before another word, &, * or \u003c is a type. Look for misfires as well as misses: a plain word wrongly coloured is as much a finding as one left plain.", "paths": ["src/adapters/syntax", "src/adapters/qt"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "64d9e46a0fa7cff7e37d778d329a8e71bcf6ff13547bbc82eadb547ebb252827"}, "launch": {"label": "Open the bundle built at the BPR-0733 head (quit any running BetterPullReview first)", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "copy": [{"label": "Pull request link for the Home bar", "value": "https://github.com/microsoft/terminal/pull/20607"}], "fingerprint": "f46a9ee3a42878247bec904a98a4bed721eb096aa92e9e2a7f996e35c6709d5b", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0726-cpp-identifier-roles", "fingerprint": "f46a9ee3a42878247bec904a98a4bed721eb096aa92e9e2a7f996e35c6709d5b", "decision_id": "91d2fa40-e8da-47b9-9825-64e4b0f76a5e", "outcome": "accept", "note": "", "saved_at": "2026-09-11T23:46:15.564021+00:00", "actor": "human"}, "observations": [{"time": "2026-09-11T23:26:21.204708+00:00", "evidence": "Static review material prepared"}], "preparation_id": null, "preparation_epoch": 2}, {"id": "BPR-0727-overview-drawers", "title": "Overview refuses a drawer opened by hand, and is chosen rather than inferred", "revision": "app-release-64d9e46a-2026-09-11.3", "criteria": ["In Overview, the strip's drawer toggles and Alt+Shift+1/2/3 leave every drawer collapsed and the status bar says why; in Read, Review and Discuss the same toggles still open the drawers", "Quit in Read with only the files drawer open (the same shape as Overview's preset) and relaunch: the restored review comes back in Read, not Overview, and its drawer toggles work; Overview is only ever the result of choosing it"], "content": "The run: quit any running BetterPullReview, open the bundle with the command above, open microsoft/terminal#20607 from Home, switch to Overview and try the drawer toggles on the strip and the shortcuts; then switch to Read, Review and Discuss and try them again. Nothing here writes to GitHub. The second criterion is a judgement the integrator made while landing this card and wants you to see: the window used to infer Overview from the files-only drawer shape at restart; it no longer does, because that shape is indistinguishable from a Read with the conversations closed by hand, and inferring Overview would make the app refuse a toggle the strip never promised to refuse. If you would rather the files-only shape came back as Overview, reject with a note.", "paths": ["src/core", "src/application", "src/adapters/qt"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "64d9e46a0fa7cff7e37d778d329a8e71bcf6ff13547bbc82eadb547ebb252827"}, "launch": {"label": "Open the bundle built at the BPR-0733 head (quit any running BetterPullReview first)", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "copy": [{"label": "Pull request link for the Home bar", "value": "https://github.com/microsoft/terminal/pull/20607"}], "fingerprint": "cd9e85e3a5f668f64b26b56e4bc7cb7bad3d62926fdf7cec2f71d14661c10bba", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0727-overview-drawers", "fingerprint": "cd9e85e3a5f668f64b26b56e4bc7cb7bad3d62926fdf7cec2f71d14661c10bba", "decision_id": "e10736e3-b90e-4621-8bc6-e3065e9e883b", "outcome": "accept", "note": "", "saved_at": "2026-09-11T23:46:29.229674+00:00", "actor": "human"}, "observations": [{"time": "2026-09-11T23:26:21.485547+00:00", "evidence": "Static review material prepared"}], "preparation_id": null, "preparation_epoch": 2}, {"id": "BPR-0728-conversations-drawer-width", "title": "The conversations drawer goes narrower than 375 pixels in Read", "revision": "app-release-64d9e46a-2026-09-11.3", "criteria": ["In Read, the handle drags the conversations drawer well below 375 pixels (down to about 200 is comfortable; the narrowest stop is the same 64-pixel floor the other drawers have), the code gets the room, and every control in the drawer stays reachable (the column scrolls sideways beneath about 290 rather than clipping)", "The narrowed width survives Home and back"], "content": "The run: quit any running BetterPullReview, open the bundle with the command above, open microsoft/terminal#20607 from Home, switch to Read and drag the handle between the code and the conversations drawer to the right. Then press the Home button on the strip and open the pull request again from Recently viewed. Nothing here writes to GitHub. This is the second option you selected on BPR-0724 in v006. The 375 design width is still where a squeezed drawer is lifted back to on a later launch when it was persisted narrower than 160.", "paths": ["src/adapters/qt"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "64d9e46a0fa7cff7e37d778d329a8e71bcf6ff13547bbc82eadb547ebb252827"}, "launch": {"label": "Open the bundle built at the BPR-0733 head (quit any running BetterPullReview first)", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "copy": [{"label": "Pull request link for the Home bar", "value": "https://github.com/microsoft/terminal/pull/20607"}], "fingerprint": "f61c6e2f549a2b87de6823d61b36533cde4fd3216a87de9ba9eea47db8dc7d66", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0728-conversations-drawer-width", "fingerprint": "f61c6e2f549a2b87de6823d61b36533cde4fd3216a87de9ba9eea47db8dc7d66", "decision_id": "8a907ecd-4aef-4596-a035-320365d12b40", "outcome": "accept", "note": "It does, but the mouse cursor for the horizontal resize flickers only for a brief moment and the returns back to the normal cursor so it's difficult to resize properly since you have no visual indicator you're cursor is over the border element.", "saved_at": "2026-09-11T23:47:54.288046+00:00", "actor": "human"}, "observations": [{"time": "2026-09-11T23:26:21.770134+00:00", "evidence": "Static review material prepared"}], "preparation_id": null, "preparation_epoch": 2}, {"id": "BPR-0729-one-pane-layout", "title": "Read and Review in one pane", "revision": "app-release-a6dc1565-2026-09-12.6", "criteria": ["Do you accept the one-pane layout on this signed bundle, including Review in one pane and the empty-side ribbon shapes shown here?"], "content": "Open the signed BetterPullReview bundle and choose View > One pane on an active comparison. Switch from Read to Review and confirm it remains one pane with side-specific thread cards. The attached Review crop and pure insertion/deletion render come from the same source at 100% scale; the latter shows the empty-side ribbons that the accepted design did not draw. If an image-only empty-side example is insufficient, reject and name the live file or path you need. One verdict covers this layout criterion.", "paths": ["src/adapters/qt/include/bpr/qt/diff_link_map.hpp", "src/adapters/qt/include/bpr/qt/diff_workbench.hpp", "src/adapters/qt/include/bpr/qt/workbench_window.hpp", "src/adapters/qt/src/diff_link_map.cpp", "src/adapters/qt/src/diff_workbench.cpp", "src/adapters/qt/src/workbench_window.cpp", "src/adapters/sqlite/src/workbench_settings_database.cpp", "src/adapters/sqlite/src/workbench_settings_database.hpp", "src/application/include/bpr/application/workbench_runtime_ports.hpp", "src/application/src/workbench_application_host.cpp", "src/core/include/bpr/core/workbench_interaction.hpp", "src/core/src/workbench_interaction.cpp"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "a6dc1565908cfacc5eb7d573d8d05983c51aa10780db2052e1c138682870eaf2"}, "launch": {"label": "Open the signed bundle", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "copy": [{"label": "Example pull request for the Home paste field", "value": "https://github.com/microsoft/terminal/pull/20607"}], "media": [{"kind": "image", "url": "", "label": "Review: removed and added rows with side-specific thread cards (100% test render)"}, {"kind": "image", "url": "", "label": "Read: replacement, pure deletion, and pure insertion with one-sided ribbons (100% test render)"}], "metadata": {"card": "BPR-0729", "source_commit": "3dcbf237", "bundle_executable_sha256": "a6dc1565908cfacc5eb7d573d8d05983c51aa10780db2052e1c138682870eaf2"}, "fingerprint": "70a2a9417b2532450cf66f71228fbabe1f627de748ed8ea25767cecec875228c", "phase": "ready", "protected": true, "decision": {"candidate": "BPR-0729-one-pane-layout", "fingerprint": "70a2a9417b2532450cf66f71228fbabe1f627de748ed8ea25767cecec875228c", "decision_id": "0f6d7348-e230-41ce-a815-af50ebf2bb0d", "outcome": "accept", "note": "", "saved_at": "2026-09-12T21:31:00.638202+00:00", "actor": "human"}, "observations": [{"time": "2026-09-12T20:40:42.515134+00:00", "evidence": "Static review material prepared"}], "preparation_id": "941c240901739575"}, {"id": "BPR-0732-signed-out-home", "title": "A signed-out Home is one paste field that opens a public pull request", "revision": "app-release-64d9e46a-2026-09-11.3", "criteria": ["Signed out, Home shows the account card, one paste field with Open and the status bar; no review queue heading, list or filter combos, and no separate Read without signing in button", "Pasting a public pull request link (or owner/name#123) into the field and pressing Open or Return opens it in one gesture, read-only, with no sign-in stop and no intermediate page"], "content": "The run: quit any running BetterPullReview, open the bundle with the command above. If an account is signed in, sign out first (Settings > Accounts & hosts) so Home is the signed-out one. Paste the pull request link into the field and press Open. Nothing here writes to GitHub; the read is anonymous and counts against GitHub's sixty-an-hour anonymous limit from this machine. This is your v006 answer on Home: the queue and its filters had no use signed out, open by link did not work without an account, and Read without signing in led to another confusing page. Sign-in is still offered on the card for anyone who wants their queue, and the queue appears once a session with an account exists. BPR-0716 (one visible control on Home that opens without an account) is finished with this one.", "paths": ["src/core", "src/application", "src/adapters/qt", "src/app"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "64d9e46a0fa7cff7e37d778d329a8e71bcf6ff13547bbc82eadb547ebb252827"}, "launch": {"label": "Open the bundle built at the BPR-0733 head (quit any running BetterPullReview first)", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "copy": [{"label": "Pull request link for the Home bar", "value": "https://github.com/microsoft/terminal/pull/20607"}], "fingerprint": "81a8601820c70b1f5583507562c8b1b1275ff4dc5e9f115a62b0b7b60e2d08ae", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0732-signed-out-home", "fingerprint": "81a8601820c70b1f5583507562c8b1b1275ff4dc5e9f115a62b0b7b60e2d08ae", "decision_id": "18afd9ae-c74b-4ddc-9e4f-e08f5f5d52ed", "outcome": "accept", "note": "", "saved_at": "2026-09-11T23:48:01.436887+00:00", "actor": "human"}, "observations": [{"time": "2026-09-11T23:26:22.057823+00:00", "evidence": "Static review material prepared"}], "preparation_id": null, "preparation_epoch": 2}, {"id": "BPR-0733-recently-viewed", "title": "Home lists recently viewed pull requests instead of restoring the last one", "revision": "app-release-64d9e46a-2026-09-11.3", "criteria": ["Relaunching the bundle with a review saved shows Home at once, with the saved pull request as the first entry of Recently viewed between the paste field and the queue; nothing opens by itself", "Activating the entry (click, or Return with it focused) opens the pull request by hand, and Resume reading returns to the saved position; the section is absent when the list is empty", "When the restoration store or the saved destination cannot be used the app says so; when only the startup authority is missing (no grant, or the capability is not composed) it stays silent, because nothing was pending"], "content": "The run: quit any running BetterPullReview, open the bundle with the command above. The one-row store from the older build is migrated into the list, newest first, so Home should already show microsoft/terminal#20607 under Recently viewed if it was open at the last quit. Open it, read a little, quit, and relaunch: Home again, the entry first, and Resume reading takes you back. Signed out the list shows the public-preview entries only; an account's entries appear once its session exists. Nothing here writes to GitHub. The third criterion is a change made while landing this card and shown for your judgement: the old automatic restore spoke when its authority was refused; now that nothing is pending at startup, a refused authority is silent, while a refused destination or store still speaks. If you would rather every refusal spoke, say so in the note.", "paths": ["src/core", "src/application", "src/adapters/sqlite", "src/adapters/qt", "src/app"], "resources": ["install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"], "resource_versions": {"install:/Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app": "64d9e46a0fa7cff7e37d778d329a8e71bcf6ff13547bbc82eadb547ebb252827"}, "launch": {"label": "Open the bundle built at the BPR-0733 head (quit any running BetterPullReview first)", "command": "open /Users/jaeger/Documents/GitHub/BetterPullReview/build/app-release/src/app/BetterPullReview.app"}, "copy": [{"label": "Pull request link for the Home bar", "value": "https://github.com/microsoft/terminal/pull/20607"}], "fingerprint": "39fa48b4b48f69ab068ef95c77383319b1f2dbd4136e8f41f6b20fbf8a774502", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0733-recently-viewed", "fingerprint": "39fa48b4b48f69ab068ef95c77383319b1f2dbd4136e8f41f6b20fbf8a774502", "decision_id": "76d1917a-f3d7-44c3-b96e-6679191a9ace", "outcome": "accept", "note": "", "saved_at": "2026-09-11T23:48:33.857394+00:00", "actor": "human"}, "observations": [{"time": "2026-09-11T23:26:22.339386+00:00", "evidence": "Static review material prepared"}], "preparation_id": null, "preparation_epoch": 2}, {"id": "BPR-0734-read-one-pane", "title": "Read in one pane, redrawn over the link map", "revision": "design-v7-2026-09-12", "criteria": ["The gutter is the link map at its limit: each change's struck and added rows converge on a spine, and a change with an empty side draws one ribbon rather than two", "One pane is a View item like Line numbers, so it is per window with no modality of its own and checking it gives Review one pane too; say if Review should stay two-pane", "The whole-file overview v6 drew in that gutter is gone, because the two-pane state has none; say if you want one back as its own element", "The reworded Modalities amendment, and AC-05 unchanged"], "content": "A design page, not a build; nothing to install and nothing to quit. Open it with the command above and read state 2b.\n\nYour v008 note was \"The one-page should also use a link map as the p4merge example provided. Relax the non-goals restriction to allow extending the link-map in this limit direction.\" v6 had put a change map there, the whole file's changes as ticks with a lens. That is gone. The gutter is now the link map at its limit: with one column there is no second pane to cross to, so for each change the struck rows and the added rows leave the code's edge over their own rows and converge on a short spine. A change that only inserts draws one ribbon against the spine, and so does one that only deletes, so an empty side reads as an empty side rather than as a ribbon that failed to draw.\n\nYour other two answers are applied: the rows are in unified-diff order, and the choice is a View item, drawn as a menu below the window because on macOS the menu bar is not in the window.\n\nTwo consequences to refuse if they are wrong. First, Line numbers is per window with no modality of its own, so One pane is too, which means checking it gives Review one pane as well and not only Read; v6 had made it a property of Read with Review always two-pane. Second, the whole-file overview went with the change map, because the two-pane state has never had one and keeping it would have made this a different element again; if you want one back it is a separate element and a separate decision.\n\nAlso in the ask: the reworded Modalities amendment on the card, and AC-05's text, which did not change because the redraw moved the map and not the threads.", "paths": ["docs/design/RFC-BPR-0028-workbench-direction-v7.html", "docs/rfcs/RFC-BPR-0028-review-workbench-direction.md"], "resources": [], "launch": {"label": "Open the redrawn state in a browser", "command": "open '/Users/jaeger/Documents/GitHub/BetterPullReview/docs/design/RFC-BPR-0028-workbench-direction-v7.html#read-one-pane'"}, "metadata": {"cards": ["BPR-0734", "BPR-0745"]}, "fingerprint": "1f5c6ab4133593592701203351699f493645590401a981a314f97ed5f4938f05", "phase": "ready", "protected": false, "decision": {"candidate": "BPR-0734-read-one-pane", "fingerprint": "1f5c6ab4133593592701203351699f493645590401a981a314f97ed5f4938f05", "decision_id": "31462e78-51ea-4ef5-ba85-231a18098b68", "outcome": "accept", "note": "", "saved_at": "2026-09-12T16:03:03.402479+00:00", "actor": "human"}, "observations": [{"time": "2026-09-12T07:34:32.002765+00:00", "evidence": "docs/design/RFC-BPR-0028-workbench-direction-v7.html rendered headless at 1500 px with Chrome --headless=new --force-device-scale-factor=2 and inspected: the link-map ribbons and their spine land on the struck and a  el('identity').textContent=`${c.id} · candidate ${c.revision}`;el('title').textContent=c.title;el('content').textContent=c.content||'';
 el('criteria').replaceChildren();for(const text of c.criteria){const li=document.createElement('li');li.textContent=text;el('criteria').append(li);}
 el('media').replaceChildren();for(const m of c.media||[]){const node=document.createElement(m.kind==='image'?'img':m.kind);node.src=m.url;node.alt=m.label||'';if(m.kind!=='image')node.controls=true;el('media').append(node);}
 el('wizard').replaceChildren();if(c.wizard){const p=document.createElement('p');p.textContent=c.wizard.instructions||'Follow the companion wizard, then return here for your decision.';el('wizard').append(p);if(c.wizard.url){try{const url=new URL(c.wizard.url);if(['http:','https:','file:'].includes(url.protocol)){const a=document.createElement('a');a.href=url.href;a.textContent='Open manual steps';a.target='_blank';a.rel='noopener noreferrer';el('wizard').append(a);}}catch(e){}}}
 const oldOptions=new Set([...el('options').querySelectorAll('input:checked')].map(v=>v.value));
 el('options').replaceChildren();for(const option of c.options||[]){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=option;input.checked=oldOptions.has(option);label.append(input,document.createTextNode(` ${option}`));el('options').append(label);}
 const d=decision(c),enabled=c.phase==='ready'&&c.protected&&!saving&&!state.handed_back;
 el('accept').textContent=(c.options?'Save selection':'Accept')+(d&&d.outcome!=='accept'?' instead':'');
 el('reject').textContent='Reject'+(d&&d.outcome!=='reject'?' instead':'');
 el('accept').disabled=el('reject').disabled=!enabled;
 el('clear').disabled=!enabled||!d;el('clear').hidden=!d;
 el('images').disabled=!enabled;
 el('attachments').replaceChildren();
 for(const a of pending){const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption');image.src=a.data;image.alt=a.name;caption.textContent=a.name;figure.append(image,caption);el('attachments').append(figure);}
 // The note is part of the verdict, so the verdict says it back.
 el('verdict').textContent=d?`Recorded: ${d.outcome}${d.selected?' — '+d.selected.join(', '):''}${d.note?` — “${d.note}”`:''}${d.attachments?.length?` — ${d.attachments.length} image(s)`:''}`:c.phase==='ready'?'':c.error||'Preparation is pending. Other ready items are available.';
 el('launch').replaceChildren();
 el('copy-values').replaceChildren();
 for(const value of c.copy||[]){const row=document.createElement('p'),label=document.createElement('span'),code=document.createElement('code'),copy=document.createElement('button');label.className='group';label.textContent=value.label;code.textContent=value.value;copy.textContent='Copy';copy.onclick=async()=>{try{await navigator.clipboard.writeText(value.value);say(`${value.label} copied.`);}catch(e){const range=document.createRange();range.selectNodeContents(code);getSelection().removeAllRanges();getSelection().addRange(range);say('Copy the selected text using your keyboard.');}};row.append(label);el('copy-values').append(row,code,copy);}
 if(c.launch){const p=document.createElement('p'),code=document.createElement('code'),copy=document.createElement('button');p.textContent=c.launch.label||'Open what this asks you to look at:';code.textContent=c.launch.command;copy.textContent='Copy command';copy.onclick=async()=>{try{await navigator.clipboard.writeText(c.launch.command);say('Command copied. Paste it in a terminal.');}catch(e){const range=document.createRange();range.selectNodeContents(code);getSelection().removeAllRanges();getSelection().addRange(range);say('Copy the selected command using your keyboard.');}};el('launch').append(p,code,copy);}
}
async function record(outcome){
 const c=candidate();if(!c)return;
 const d={candidate:c.id,fingerprint:c.fingerprint,decision_id:globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`,outcome,note:el('note').value};
 if(outcome!=='withdrawn'&&pending.length)d.attachments=pending.map(a=>({name:a.name,data:a.data}));
 if(outcome==='select'){d.selected=[...el('options').querySelectorAll('input:checked')].map(v=>v.value);if(!d.selected.length){say('Select at least one option.');return;}}
 saving=true;draw();
 try{if(online){await api('/api/decisions',{schema_version:1,session:state.session,decisions:[d]});state=await api('/api/status');say(outcome==='withdrawn'?'Decision cleared. Decide again whenever you are ready.':'Decision saved. It is shown below; change or clear it whenever you like, or pick the next item.');}else{local=local.filter(v=>!(v.candidate===d.candidate&&v.fingerprint===d.fingerprint));if(outcome!=='withdrawn')local.push(d);persist();say(outcome==='withdrawn'?'Decision cleared in this browser.':'Decision retained in this browser. Export whenever you are ready to stop.');}select(c.id);}catch(e){say(`Decision was not confirmed saved: ${e.message}. Retry; a matching repeated import is safe.`);}finally{saving=false;draw();}
}
el('accept').onclick=()=>record(candidate()?.options?'select':'accept');el('reject').onclick=()=>record('reject');el('skip').onclick=chooseNext;
el('clear').onclick=()=>record('withdrawn');
el('finish').onclick=async()=>{
 const decided=state.candidates.filter(decision),pending=state.candidates.filter(c=>!decision(c));
 const summary=`${decided.length} answered${decided.length?': '+decided.map(c=>`${c.title} — ${decision(c).outcome}`).join('; '):''}. ${pending.length} left unanswered.`;
 try{
  if(online){await api('/api/hand-back',{});state=await api('/api/status');say(`Handed back. ${summary} Your answers are saved; you can close this tab.`);}
  else{el('export').click();say(`${summary} Your answers are in the box below: copy or download it and give it to your driver, then close this tab.`);el('fallback').open=true;}
 }catch(e){say(`Could not hand back: ${e.message}. Your saved answers are unaffected.`);}
 draw();};
// A screenshot is on the clipboard, not on disk. Pasting one into the note
// attaches it, under the same bounds a chosen file has.
async function attach(files){for(const file of files){if(pending.length>=4){say('Four images is the bound for one answer.');break;}if(file.size>3*1024*1024){say(`${file.name||'that image'} is larger than 3 MB; use a smaller one.`);continue;}try{pending.push({name:file.name||`pasted-${pending.length+1}.png`,data:await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file);})});}catch(e){say('That image could not be read.');}}draw();}
el('note').onpaste=async event=>{const files=[...(event.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/'));if(!files.length)return;event.preventDefault();await attach(files);say(`${files.length} image(s) attached to this answer.`);};
el('images').onchange=async()=>{const files=[...el('images').files];el('images').value='';await attach(files);};
el('start').onclick=async()=>{try{if(online){await api('/api/start',{interrupt:true});state=await api('/api/status');}say('Review ready items now. Skips remain pending.');chooseNext();}catch(e){say(e.message);}};
el('pause').onclick=async()=>{try{if(online){await api('/api/pause',{});state=await api('/api/status');}say(online?'Session paused. Prepared candidates remain protected.':'You can stop now. Export partial decisions first; undecided items remain pending.');draw();}catch(e){say(e.message);}};
el('export').onclick=()=>{el('transfer').value=JSON.stringify(packet(),null,2);};
el('copy').onclick=async()=>{el('export').click();try{await navigator.clipboard.writeText(el('transfer').value);say('Decision JSON copied.');}catch(e){el('transfer').select();say('Copy the selected JSON using your keyboard.');}};
el('download').onclick=()=>{el('export').click();const blob=new Blob([el('transfer').value],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='attended-decisions.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
function stamp(){if(!state)return;const when=state.generated_at;el('generated').textContent=online?'':when?`This file was written at ${when}. Anything decided in the live session after that is not in it; ask your driver to write it again.`:'';}
async function boot(){try{if(online){state=await api('/api/status');history.replaceState(null,'',location.pathname+location.hash);}if(!state)throw Error('Open the complete URL printed by serve, or generate an offline HTML file.');if(!online)restore();stamp();draw();if(online)setInterval(async()=>{if(saving)return;try{const next=await api('/api/status');if(next.sequence!==state.sequence){state=next;draw();}}catch(e){say('Live host is unavailable. Reopen it with your driver; saved decisions remain on disk.');}},1500);}catch(e){say(e.message);}}
boot();
</script></html>
