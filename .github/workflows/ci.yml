name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Qt 6.11.1
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: dev
            qt_arch: ""
          - os: windows-2025
            preset: windows-dev
            qt_arch: win64_msvc2022_64
          - os: macos-15
            preset: dev
            qt_arch: ""

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Qt
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: "6.11.1"
          arch: ${{ matrix.qt_arch }}
          cache: false

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: "1.25"

  core-only:
    name: Qt-free core
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure
        run: cmake --preset core-only

      - name: Build
        run: cmake --build --preset core-only

      - name: Test
        run: ctest --preset core-only --output-on-failure
